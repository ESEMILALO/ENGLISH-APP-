<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Word Log — Vocabulary Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2124;
    --panel:#232B31;
    --rule:#3A4650;
    --card:#EDE8DA;
    --card-ink:#211F1A;
    --card-ink-soft:#6B6255;
    --text:#E9E6DC;
    --text-soft:#96A0A6;
    --amber:#E39A3A;
    --amber-ink:#241804;
    --amber-deep:#B9741C;
    --good:#5CAE7C;
    --good-bg:rgba(78,154,108,.16);
    --warn:#D57C4E;
    --warn-bg:rgba(200,106,58,.18);
    --new:#8B959C;
    --new-bg:rgba(124,135,144,.14);
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --cond:'IBM Plex Sans Condensed',var(--sans);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #262F35 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:26px 16px 56px;
  }
  #app{ max-width:520px; margin:0 auto; }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  ::selection{ background:var(--amber); color:var(--amber-ink); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:4px; }

  .view{ animation:viewIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ .view,.card{ animation:none !important; } }

  .eyebrow{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.09em;
    color:var(--text-soft); text-transform:uppercase; margin-bottom:6px;
  }
  .title{ font-family:var(--cond); font-weight:700; font-size:clamp(1.8rem,7vw,2.4rem); margin:0 0 6px; letter-spacing:-.01em; }
  .subtitle{ color:var(--text-soft); margin:0 0 22px; font-size:.95rem; line-height:1.5; }
  .loading{ color:var(--text-soft); font-family:var(--mono); font-size:.85rem; padding:40px 0; text-align:center; }
  .hint{ color:var(--text-soft); font-size:.82rem; line-height:1.5; margin:8px 2px 0; }

  /* stats readout */
  .stat-row{ display:flex; gap:10px; margin-bottom:22px; }
  .stat{
    flex:1; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:12px 10px; text-align:center; font-family:var(--mono); font-size:1.35rem; font-weight:600;
  }
  .stat small{ display:block; font-family:var(--sans); font-weight:400; font-size:.72rem; letter-spacing:.02em;
    color:var(--text-soft); margin-top:4px; text-transform:lowercase; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .dot-good{ background:var(--good); } .dot-warn{ background:var(--warn); } .dot-new{ background:var(--new); }

  /* buttons */
  .btn-hero{
    display:block; width:100%; text-align:left; background:var(--amber); color:var(--amber-ink);
    border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; margin-bottom:22px;
    font-family:var(--cond); font-weight:700; font-size:clamp(1.25rem,5.2vw,1.5rem); letter-spacing:-.01em;
    box-shadow:0 12px 26px rgba(0,0,0,.30); transition:background .15s ease, transform .1s ease;
  }
  .btn-hero:hover{ background:var(--amber-deep); }
  .btn-hero:active{ transform:scale(.995); }
  .btn-hero small{
    display:block; font-family:var(--sans); font-weight:500; font-size:.84rem; letter-spacing:0;
    line-height:1.45; margin-top:6px; opacity:.82;
  }
  .hero-bar{ height:6px; background:rgba(36,24,4,.22); border-radius:3px; overflow:hidden; margin-top:12px; }
  .hero-bar span{ display:block; height:100%; background:var(--amber-ink); border-radius:3px; }

  .btn-primary{
    display:block; width:100%; background:var(--amber); color:var(--amber-ink); border:none;
    font-weight:700; font-size:.92rem; letter-spacing:.03em; text-transform:uppercase;
    padding:15px 18px; border-radius:8px; cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background:var(--amber-deep); }
  .btn-primary:active{ transform:scale(.99); }
  .btn-secondary{
    display:block; width:100%; background:transparent; color:var(--text); border:1px solid var(--rule);
    font-weight:600; font-size:.88rem; padding:14px 18px; border-radius:8px; cursor:pointer; margin-top:10px;
  }
  .btn-secondary:hover{ border-color:var(--text-soft); }
  .btn-oncard{
    display:block; width:100%; background:var(--card-ink); color:var(--card); border:none;
    font-weight:700; font-size:.85rem; letter-spacing:.03em; text-transform:uppercase;
    padding:13px 16px; border-radius:7px; cursor:pointer; margin-top:22px;
  }
  .btn-oncard:hover{ opacity:.88; }

  /* session length toggle */
  .length-toggle{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .len-btn{
    flex:1 1 84px; background:var(--panel); border:1px solid var(--rule); color:var(--text-soft);
    border-radius:8px; padding:9px 6px; cursor:pointer; font-size:.82rem; font-weight:600;
  }
  .len-btn small{ display:block; font-family:var(--mono); font-weight:400; font-size:.72rem; margin-top:2px; }
  .len-btn.active{ background:rgba(227,154,58,.14); border-color:var(--amber); color:var(--amber); }

  .divider{ display:flex; align-items:center; gap:10px; margin:26px 0 14px; color:var(--text-soft);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--rule); }

  /* category list */
  .cat-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .cat-row{
    text-align:left; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:13px 14px; cursor:pointer; color:var(--text); width:100%;
  }
  .cat-row:hover{ border-color:var(--text-soft); }
  .cat-row-top{ display:flex; justify-content:space-between; align-items:center; }
  .cat-name{ font-weight:600; font-size:.95rem; }
  .cat-arrow{ color:var(--amber); font-family:var(--mono); }
  .cat-row-meta{ font-family:var(--mono); font-size:.74rem; color:var(--text-soft); margin:5px 0 8px; }
  .bar{ height:5px; background:var(--rule); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--good); border-radius:3px; }
  .bar-session{ margin:10px 0 22px; }
  .bar-session .bar-fill{ background:var(--amber); }

  .reset-link{
    display:block; margin:26px auto 0; background:none; border:none; color:var(--text-soft);
    font-size:.76rem; text-decoration:underline; cursor:pointer; padding:8px;
  }

  /* session header */
  .sess-top{ display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:.76rem; color:var(--text-soft); letter-spacing:.04em; }
  .sess-back{
    background:none; border:none; color:var(--text-soft); cursor:pointer; padding:4px 6px 4px 0;
    display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:.76rem; letter-spacing:.04em;
  }
  .sess-back:hover{ color:var(--text); }
  .sess-back svg{ width:14px; height:14px; flex-shrink:0; }
  .cat-tag{ background:var(--panel); border:1px solid var(--rule); padding:3px 8px; border-radius:5px; text-transform:uppercase; }

  /* flashcard */
  .card{
    position:relative; background:var(--card); color:var(--card-ink); border-radius:16px;
    padding:34px 24px 26px; text-align:center; box-shadow:0 22px 44px rgba(0,0,0,.38), 0 2px 0 rgba(0,0,0,.05);
    transform:rotate(-.4deg); animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .hole{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:16px; height:16px;
    border-radius:50%; background:var(--bg); box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
  }
  .card-word{ font-family:var(--cond); font-weight:700; font-size:clamp(2.1rem,9vw,2.9rem); letter-spacing:-.01em; line-height:1.05; word-break:break-word; }
  .card-pron{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
  .pron-text{ font-family:var(--mono); font-size:.95rem; color:var(--card-ink-soft); }
  .speak-btn{
    background:var(--amber); color:var(--amber-ink); border:none; width:30px; height:30px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .speak-btn:hover{ background:var(--amber-deep); }
  .speak-btn svg{ width:14px; height:14px; }

  .meanings{ text-align:left; margin-top:24px; display:flex; flex-direction:column; gap:16px; }
  .meaning-row{ display:flex; gap:10px; }
  .meaning-num{ font-family:var(--mono); font-weight:600; color:var(--amber-deep); font-size:.9rem; flex-shrink:0; width:16px; }
  .meaning-text{ font-weight:500; font-size:1rem; line-height:1.4; }
  .meaning-example{ color:var(--card-ink-soft); font-style:italic; font-size:.9rem; margin-top:4px; line-height:1.4; display:flex; align-items:center; gap:6px; }
  .mini-speak{
    background:none; border:none; color:var(--card-ink-soft); cursor:pointer; padding:2px; flex-shrink:0;
    display:inline-flex; align-items:center;
  }
  .mini-speak:hover{ color:var(--amber-deep); }
  .mini-speak svg{ width:12px; height:12px; }

  .note-box{
    text-align:left; margin-top:18px; padding:10px 12px; border-left:3px solid var(--amber);
    background:rgba(33,31,26,.05); font-size:.85rem; line-height:1.5; font-style:italic; color:var(--card-ink-soft);
  }
  .note-label{ font-family:var(--mono); font-style:normal; font-weight:600; font-size:.68rem; color:var(--amber-deep);
    letter-spacing:.06em; margin-right:6px; }

  .rate-row{ display:flex; gap:10px; margin-top:20px; }
  .tag-btn{
    flex:1; border:none; border-radius:9px; padding:14px 8px; font-weight:700; font-size:.85rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; min-height:48px;
  }
  .tag-btn svg{ width:15px; height:15px; flex-shrink:0; }
  .tag-warn{ background:var(--warn-bg); color:var(--warn); border:1px solid rgba(213,124,78,.4); }
  .tag-warn:hover{ background:rgba(213,124,78,.26); }
  .tag-good{ background:var(--good-bg); color:var(--good); border:1px solid rgba(92,174,124,.4); }
  .tag-good:hover{ background:rgba(92,174,124,.26); }

  .ask-link{
    display:block; margin:14px auto 0; background:none; border:none; color:var(--text-soft);
    font-size:.82rem; cursor:pointer; padding:6px;
  }
  .ask-link:hover{ color:var(--amber); }

  /* summary */
  .follow-list{ display:flex; flex-direction:column; gap:1px; background:var(--rule); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .follow-row{ background:var(--panel); padding:12px 14px; display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .follow-word{ font-weight:600; font-size:.92rem; flex-shrink:0; }
  .follow-gloss{ color:var(--text-soft); font-size:.8rem; text-align:right; }

  .word-list{ display:flex; flex-direction:column; gap:1px; background:var(--rule); border-radius:10px;
    overflow-y:auto; max-height:56vh; margin-bottom:8px; }
  .word-row{ background:var(--panel); border:none; padding:12px 14px; display:flex; justify-content:space-between;
    align-items:center; cursor:pointer; width:100%; text-align:left; color:var(--text); }
  .word-row-name{ font-weight:600; font-size:.92rem; }
  .word-row-pct{ font-family:var(--mono); font-weight:600; font-size:.85rem; flex-shrink:0; margin-left:10px; }
  .history-row-score{ font-family:var(--mono); font-weight:600; flex-shrink:0; }

  /* search + add-word form fields */
  .field{ margin-bottom:14px; }
  .field-label{ display:block; font-family:var(--mono); font-size:.72rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--text-soft); margin-bottom:6px; }
  .field-input{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--rule);
    background:var(--panel); color:var(--text); font-family:var(--sans); font-size:.95rem; }
  .field-input:focus{ outline:none; border-color:var(--amber); }
  select.field-input{ appearance:none; -webkit-appearance:none; }
  .field-error{ color:var(--warn); font-size:.82rem; margin:2px 2px 12px; min-height:1.2em; }

  /* streak */
  .streak-row{ display:flex; align-items:center; gap:6px; margin-bottom:18px; color:var(--amber); font-size:.85rem; font-weight:600; }
  .streak-row svg{ width:15px; height:15px; flex-shrink:0; }
  .streak-row .streak-best{ color:var(--text-soft); font-weight:400; font-family:var(--mono); font-size:.72rem; }

  /* typed-answer mode */
  .prompt-label{ font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--card-ink-soft); margin-bottom:14px; }
  .type-input{
    width:100%; margin-top:20px; padding:13px 14px; border-radius:8px; border:1.5px solid rgba(33,31,26,.25);
    background:rgba(33,31,26,.04); color:var(--card-ink); font-family:var(--sans); font-size:1.05rem; font-weight:500;
    text-align:center;
  }
  .type-input:focus{ outline:none; border-color:var(--amber-deep); background:#fff; }
  .result-badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px;
    font-family:var(--mono); font-size:.72rem; font-weight:600; text-transform:uppercase; margin-bottom:10px;
  }
  .result-badge svg{ width:11px; height:11px; }
  .result-good{ background:var(--good-bg); color:var(--good); }
  .result-bad{ background:var(--warn-bg); color:var(--warn); }

  /* sentence-completion mode */
  .cloze-sentence{ font-style:italic; font-size:1rem; line-height:1.5; color:var(--card-ink); margin:4px 0; }
  .cloze-sentence strong{ font-style:normal; color:var(--amber-deep); }

  /* speech coach mic button */
  .listen-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--card-ink); color:var(--card); border:none; font-weight:700; font-size:.85rem;
    letter-spacing:.03em; text-transform:uppercase; padding:15px 16px; border-radius:7px; cursor:pointer; margin-top:22px;
  }
  .listen-btn:hover{ opacity:.88; }
  .listen-btn.is-listening{ background:var(--warn); color:var(--amber-ink); }
  .listen-btn svg{ width:16px; height:16px; flex-shrink:0; }
  .listen-error{ color:var(--warn); font-size:.85rem; margin-top:10px; }

  /* speech coach */
  .sc-phrase{ font-family:var(--cond); font-weight:700; font-size:clamp(1.3rem,5.5vw,1.7rem); line-height:1.3; }
  .sc-score-row{ display:flex; align-items:baseline; gap:10px; margin:16px 0 10px; }
  .sc-score-value{ font-family:var(--mono); font-weight:700; font-size:1.8rem; }
  .sc-score-label{ font-size:.88rem; color:var(--card-ink-soft); }
  .sc-diff{ font-size:1.05rem; line-height:1.7; margin:6px 0 14px; text-align:left; }
  .sc-diff .ok{ color:var(--good); font-weight:600; }
  .sc-diff .miss{ color:var(--warn); text-decoration:underline; text-decoration-style:wavy; text-decoration-color:rgba(213,124,78,.5); }
  .sc-transcript{ color:var(--card-ink-soft); font-size:.85rem; font-style:italic; text-align:left; }

  /* fast mode */
  .fast-bar-track{ height:4px; background:rgba(0,0,0,.15); border-radius:2px; overflow:hidden; margin:22px 0 0; }
  .fast-bar-fill{ height:100%; width:0%; background:var(--amber-deep); border-radius:2px; }
  .fast-controls{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; }
  .fast-pause-btn{
    background:var(--panel); border:1px solid var(--rule); color:var(--text); width:44px; height:44px;
    border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .fast-pause-btn svg{ width:16px; height:16px; }
  .card.fast-tap{ cursor:pointer; }

  @media (max-width:380px){
    .rate-row{ flex-direction:column; }
    .stat{ font-size:1.15rem; }
  }

  /* Desktop: one column still, but everything spans the window as full
     width bars instead of sitting in a phone-width strip. */
  @media (min-width:900px){
    body{ padding:30px 28px 44px; }
    #app{ max-width:1400px; }

    /* bars get taller and their type scales up with the extra width */
    .btn-hero{ padding:26px 28px 24px; font-size:1.7rem; }
    .btn-hero small{ font-size:.95rem; }
    .btn-primary{ padding:20px 22px; font-size:1.02rem; }
    .btn-secondary{ padding:18px 22px; font-size:.96rem; }
    .stat{ padding:18px 14px; font-size:1.7rem; }
    .stat small{ font-size:.8rem; }
    .len-btn{ padding:14px 10px; font-size:.92rem; }
    .len-btn small{ font-size:.78rem; }
    .cat-row{ padding:18px 22px; }
    .cat-name{ font-size:1.1rem; }
    .cat-row-meta{ font-size:.82rem; }
    .cat-list{ gap:10px; }
    .word-row{ padding:15px 22px; }
    .word-row-name{ font-size:1rem; }
    .follow-row{ padding:15px 22px; }
    .word-list{ max-height:64vh; }
    .field-input{ padding:14px 16px; font-size:1rem; }

    /* the card is a bar too, but hold the text to a readable measure */
    .card{ padding:40px 32px 32px; }
    .meanings, .cloze-sentence, .sc-diff, .sc-transcript, .note-box{
      max-width:820px; margin-left:auto; margin-right:auto;
    }
    .type-input{ max-width:560px; margin-left:auto; margin-right:auto; }
    .listen-btn, .btn-oncard{ max-width:560px; margin-left:auto; margin-right:auto; }
  }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading your progress…</p></div>

<script>

rd someone \u2014 Tratar.", "e": "Treat everyone with respect."}, {"m": "Give medical care \u2014 Tratar.", "e": "Doctors treated the injury."}, {"m": "Special pleasure \u2014 Gusto / premio.", "e": "Ice cream is a treat."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Chiefly", "cat": "School vocabulary", "w": "Chiefly", "p": "ch\u00edifli", "me": [{"m": "Mainly \u2014 Principalmente.", "e": "The town depends chiefly on tourism."}], "n": "Formal adverb; mainly is more common in conversation."}, {"id": "School vocabulary::Cattle", "cat": "School vocabulary", "w": "Cattle", "p": "k\u00e1tol", "me": [{"m": "Cows and bulls \u2014 Ganado vacuno.", "e": "The farmer raises cattle."}], "n": "Plural collective noun; one animal is a cow, bull, or head of cattle."}, {"id": "School vocabulary::Hogs", "cat": "School vocabulary", "w": "Hogs", "p": "jogz", "me": [{"m": "Large pigs \u2014 Cerdos.", "e": "The farm keeps several hogs."}, {"m": "Takes selfishly \u2014 Acapara.", "e": "He hogs the television."}], "n": "Plural noun or third-person verb."}, {"id": "School vocabulary::Not until + auxiliary + subject + main verb", "cat": "School vocabulary", "w": "Not until + auxiliary + subject + main verb", "p": "nat ant\u00edl", "me": [{"m": "Inversion after not until \u2014 Inversi\u00f3n despu\u00e9s de not until.", "e": "Not until midnight did she arrive."}], "n": "Use auxiliary + subject + main verb when Not until begins the sentence."}, {"id": "School vocabulary::Withstands", "cat": "School vocabulary", "w": "Withstands", "p": "uithst\u00e1ndz", "me": [{"m": "Resists successfully \u2014 Resiste / soporta.", "e": "The bridge withstands strong winds."}], "n": "Third-person form; withstand, withstood, withstood."}, {"id": "School vocabulary::Hypothesis", "cat": "School vocabulary", "w": "Hypothesis", "p": "jaip\u00e1thasis", "me": [{"m": "Possible explanation to test \u2014 Hip\u00f3tesis.", "e": "The experiment tested the hypothesis."}], "n": "Plural: hypotheses. Correct spelling: hypothesis."}, {"id": "School vocabulary::For scient", "cat": "School vocabulary", "w": "For scient", "p": "for s\u00e1iant", "me": [{"m": "For a scientific purpose \u2014 Para fines cient\u00edficos.", "e": "The material was collected for scient research."}], "n": "Preserved as written, but it is not standard English; for science or for scientific research is natural."}, {"id": "School vocabulary::Probe", "cat": "School vocabulary", "w": "Probe", "p": "pr\u00f3ub", "me": [{"m": "Investigate deeply \u2014 Investigar.", "e": "Police probed the incident."}, {"m": "Tool for examining \u2014 Sonda.", "e": "The doctor used a probe."}, {"m": "Space exploration craft \u2014 Sonda espacial.", "e": "The probe reached Mars."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Prove", "cat": "School vocabulary", "w": "Prove", "p": "pr\u00fauv", "me": [{"m": "Show something is true \u2014 Demostrar.", "e": "The evidence proved his claim."}, {"m": "Turn out to be \u2014 Resultar ser.", "e": "The task proved difficult."}], "n": "Irregular: prove, proved, proven/proved."}, {"id": "School vocabulary::Eloped", "cat": "School vocabulary", "w": "Eloped", "p": "il\u00f3upt", "me": [{"m": "Ran away to marry \u2014 Se fug\u00f3 para casarse.", "e": "The couple eloped last summer."}, {"m": "Ran away secretly, not necessarily to marry \u2014 Huy\u00f3 / se escap\u00f3.", "e": "The teenager eloped from home during the night."}], "n": "Past tense of elope."}, {"id": "School vocabulary::Cigars", "cat": "School vocabulary", "w": "Cigars", "p": "sig\u00e1rz", "me": [{"m": "Rolled tobacco products \u2014 Puros / cigarros.", "e": "They smoked cigars outside."}], "n": "Singular: cigar."}, {"id": "School vocabulary::Look forward to + verb-ing", "cat": "School vocabulary", "w": "Look forward to + verb-ing", "p": "luk f\u00f3rward tu", "me": [{"m": "Wait happily for \u2014 Esperar con ilusi\u00f3n.", "e": "I look forward to seeing you."}], "n": "Use look forward to + noun or verb-ing."}, {"id": "School vocabulary::Root", "cat": "School vocabulary", "w": "Root", "p": "r\u00faut", "me": [{"m": "Underground plant part \u2014 Ra\u00edz.", "e": "The tree has deep roots."}, {"m": "Main cause \u2014 Ra\u00edz / causa.", "e": "We found the root of the problem."}, {"m": "Cheer for \u2014 Apoyar.", "e": "I root for my team."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Dove", "cat": "School vocabulary", "w": "Dove", "p": "dav", "me": [{"m": "Small peaceful bird \u2014 Paloma.", "e": "A white dove flew overhead."}, {"m": "Person favoring peace \u2014 Pacifista.", "e": "She is considered a political dove."}, {"m": "Past of dive, American English \u2014 Se zambull\u00f3.", "e": "He dove into the pool."}], "n": "Pronunciation differs: bird dav; past of dive d\u00f3uv."}, {"id": "School vocabulary::Pigeon", "cat": "School vocabulary", "w": "Pigeon", "p": "p\u00edyon", "me": [{"m": "Common city bird \u2014 Paloma.", "e": "A pigeon landed on the roof."}, {"m": "Easy victim, informal \u2014 Incauto/a.", "e": "The scammer found a pigeon."}], "n": "The second meaning is informal and uncommon."}, {"id": "School vocabulary::Offspring", "cat": "School vocabulary", "w": "Offspring", "p": "\u00f3fspring", "me": [{"m": "Child or young animal \u2014 Descendencia / cr\u00eda.", "e": "The animal protects its offspring."}, {"m": "Product or result \u2014 Resultado / fruto.", "e": "The invention was the offspring of years of work."}], "n": "Same form for singular and plural."}, {"id": "School vocabulary::I lost my train of thought", "cat": "School vocabulary", "w": "I lost my train of thought", "p": "ai lost mai tr\u00e9in ov th\u00f3t", "me": [{"m": "I forgot what I was saying \u2014 Perd\u00ed el hilo de mis pensamientos.", "e": "Sorry, I lost my train of thought."}], "n": "Standard expression uses singular thought."}, {"id": "School vocabulary::Pull out", "cat": "School vocabulary", "w": "Pull out", "p": "pul \u00e1ut", "me": [{"m": "Remove \u2014 Sacar.", "e": "She pulled out a chair."}, {"m": "Leave or withdraw \u2014 Retirarse.", "e": "The company pulled out of the deal."}, {"m": "Drive into traffic \u2014 Salir con el veh\u00edculo.", "e": "He pulled out carefully."}], "n": "Separable in the remove meaning."}, {"id": "School vocabulary::Seldom", "cat": "School vocabulary", "w": "Seldom", "p": "s\u00e9ldom", "me": [{"m": "Not often \u2014 Rara vez.", "e": "We seldom eat out."}], "n": "Frequency adverb; usually before the main verb."}, {"id": "School vocabulary::Youngest", "cat": "School vocabulary", "w": "Youngest", "p": "y\u00e1ngest", "me": [{"m": "Least old \u2014 El/la menor.", "e": "She is the youngest child."}], "n": "Superlative of young. Correct spelling: youngest."}, {"id": "School vocabulary::Vice", "cat": "School vocabulary", "w": "Vice", "p": "v\u00e1is", "me": [{"m": "Bad or immoral habit \u2014 Vicio.", "e": "Gambling became his vice."}, {"m": "Tool that holds objects \u2014 Tornillo de banco.", "e": "The mechanic tightened the vice."}, {"m": "Deputy position \u2014 Vice-.", "e": "She is the vice president."}], "n": "Tool is spelled vise in American English; vice in British English."}, {"id": "School vocabulary::Beef", "cat": "School vocabulary", "w": "Beef", "p": "b\u00edif", "me": [{"m": "Meat from cattle \u2014 Carne de res.", "e": "We cooked beef for dinner."}, {"m": "Complaint, informal \u2014 Queja.", "e": "What is your beef with him?"}, {"m": "Complain, informal \u2014 Quejarse.", "e": "They beefed about the price."}], "n": "Informal meanings are common in conversation."}, {"id": "School vocabulary::Permitted", "cat": "School vocabulary", "w": "Permitted", "p": "perm\u00edtid", "me": [{"m": "Allowed \u2014 Permitido/a.", "e": "Phones are not permitted here."}], "n": "Past tense or adjective from permit. Corrected from permitteds."}, {"id": "School vocabulary::Piggyback", "cat": "School vocabulary", "w": "Piggyback", "p": "p\u00edgibak", "me": [{"m": "Ride on someone's back \u2014 A caballito.", "e": "The child got a piggyback ride."}, {"m": "Use an existing system \u2014 Aprovechar / apoyarse en.", "e": "The app piggybacks on another service."}, {"m": "Transmit extra data through an existing channel \u2014 Incorporar datos a un canal existente.", "e": "The system piggybacks control data on the main signal."}], "n": "Can be noun, adjective, adverb, or verb."}, {"id": "School vocabulary::Rush", "cat": "School vocabulary", "w": "Rush", "p": "rash", "me": [{"m": "Move with great speed \u2014 Apresurarse.", "e": "Do not rush your work."}, {"m": "Sudden hurry \u2014 Prisa.", "e": "I left in a rush."}, {"m": "Sudden strong feeling \u2014 Oleada.", "e": "She felt a rush of excitement."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Pleased", "cat": "School vocabulary", "w": "Pleased", "p": "pl\u00edizd", "me": [{"m": "Happy or satisfied \u2014 Complacido/a / contento/a.", "e": "I am pleased with the result."}, {"m": "Willing, formal \u2014 Encantado/a de.", "e": "I would be pleased to help."}, {"m": "Made someone happy or satisfied \u2014 Agrad\u00f3 / complaci\u00f3.", "e": "The good news pleased everyone."}], "n": "Common patterns: pleased with and pleased to."}, {"id": "School vocabulary::Chide", "cat": "School vocabulary", "w": "Chide", "p": "ch\u00e1id", "me": [{"m": "Scold mildly \u2014 Reprender suavemente.", "e": "She chided him for being late."}], "n": "Often followed by for."}, {"id": "School vocabulary::Scold", "cat": "School vocabulary", "w": "Scold", "p": "sk\u00f3uld", "me": [{"m": "Speak angrily to criticize \u2014 Rega\u00f1ar.", "e": "The teacher scolded the student."}, {"m": "Person who often complains, old use \u2014 Rega\u00f1\u00f3n/a.", "e": "He was known as a scold."}], "n": "Usually a verb in modern English."}, {"id": "School vocabulary::Reprimand#2", "cat": "School vocabulary", "w": "Reprimand", "p": "r\u00e9primand", "me": [{"m": "Official scolding \u2014 Reprimenda.", "e": "He received a reprimand."}, {"m": "Scold officially \u2014 Reprender.", "e": "The manager reprimanded him."}], "n": "Corrected from repriment; can be noun or verb."}, {"id": "School vocabulary::Admonish", "cat": "School vocabulary", "w": "Admonish", "p": "adm\u00e1nish", "me": [{"m": "Warn or scold firmly \u2014 Amonestar / reprender.", "e": "The teacher admonished the class."}, {"m": "Advise seriously \u2014 Advertir.", "e": "She admonished him to be careful."}], "n": "Formal verb."}, {"id": "School vocabulary::Hardship", "cat": "School vocabulary", "w": "Hardship", "p": "j\u00e1rdship", "me": [{"m": "Serious difficulty \u2014 Dificultad / penuria.", "e": "The family faced financial hardship."}, {"m": "Difficult experience \u2014 Adversidad.", "e": "They survived many hardships."}], "n": "Can be countable or uncountable."}, {"id": "School vocabulary::Windy", "cat": "School vocabulary", "w": "Windy", "p": "u\u00edndi", "me": [{"m": "Having much wind \u2014 Ventoso/a.", "e": "It is a windy day."}, {"m": "Too long in speech, informal \u2014 Verboso/a.", "e": "He gave a windy speech."}], "n": "Do not confuse windy with winding."}, {"id": "School vocabulary::Flabbergasted", "cat": "School vocabulary", "w": "Flabbergasted", "p": "fl\u00e1berg\u00e1stid", "me": [{"m": "Extremely surprised \u2014 At\u00f3nito/a.", "e": "I was flabbergasted by the news."}], "n": "Correct standard spelling: flabbergasted."}, {"id": "School vocabulary::Breathtaking", "cat": "School vocabulary", "w": "Breathtaking", "p": "br\u00e9th-t\u00e9iking", "me": [{"m": "Extremely beautiful or exciting \u2014 Impresionante.", "e": "The mountain view was breathtaking."}, {"m": "Very surprising \u2014 Asombroso/a.", "e": "The final performance was breathtaking."}], "n": "Usually positive."}, {"id": "School vocabulary::Plateau", "cat": "School vocabulary", "w": "Plateau", "p": "plat\u00f3u", "me": [{"m": "High flat land \u2014 Meseta.", "e": "They crossed a rocky plateau."}, {"m": "Period with no progress \u2014 Estancamiento.", "e": "Sales reached a plateau."}, {"m": "Stop increasing \u2014 Estabilizarse.", "e": "Prices plateaued."}], "n": "Plural: plateaus or plateaux. Corrected spelling."}, {"id": "School vocabulary::Overrun", "cat": "School vocabulary", "w": "Overrun", "p": "\u00f3uverran", "me": [{"m": "Spread over and occupy \u2014 Invadir.", "e": "The garden was overrun with weeds."}, {"m": "Exceed time or cost \u2014 Excederse.", "e": "The project overran its budget."}, {"m": "Run beyond \u2014 Pasarse.", "e": "The meeting overran by an hour."}], "n": "Verb forms: overrun, overran, overrun."}, {"id": "School vocabulary::Bocana", "cat": "School vocabulary", "w": "Bocana", "p": "bok\u00e1na", "me": [{"m": "Entrance to a harbor or waterway \u2014 Bocana / entrada.", "e": "The boat crossed the bocana at dawn."}], "n": "Spanish loan/local term preserved; inlet or harbor entrance is standard English."}, {"id": "School vocabulary::Mule", "cat": "School vocabulary", "w": "Mule", "p": "mi\u00fal", "me": [{"m": "Horse-donkey hybrid \u2014 Mula.", "e": "The mule carried supplies."}, {"m": "Person carrying illegal goods \u2014 Mula.", "e": "Police arrested a drug mule."}, {"m": "Stubborn person, informal \u2014 Persona terca.", "e": "He can be stubborn as a mule."}], "n": "Usually countable."}, {"id": "School vocabulary::Mule ride", "cat": "School vocabulary", "w": "Mule ride", "p": "mi\u00fal r\u00e1id", "me": [{"m": "Trip riding a mule \u2014 Paseo en mula.", "e": "We took a mule ride through the canyon."}], "n": "Countable phrase."}, {"id": "School vocabulary::Kueve", "cat": "School vocabulary", "w": "Kueve", "p": "ku\u00e9ve", "me": [{"m": "Name or local term \u2014 Nombre o t\u00e9rmino local.", "e": "Kueve appears as a name in the text."}], "n": "Preserved exactly as requested; its meaning requires source context."}, {"id": "School vocabulary::Poke", "cat": "School vocabulary", "w": "Poke", "p": "p\u00f3uk", "me": [{"m": "to push or prod lightly with a finger or pointed object \u2014 empujar o picar suavemente con el dedo o un objeto puntiagudo", "e": "She poked the button."}, {"m": "to stick out or thrust slightly \u2014 asomarse o sobresalir ligeramente", "e": "His head poked out of the window."}, {"m": "to tap/contact someone online; informal \u2014 dar un toque o contactar a alguien en l\u00ednea; informal", "e": "I poked him on social media."}], "n": "Verb/noun; poke around = search casually."}, {"id": "School vocabulary::Wool", "cat": "School vocabulary", "w": "Wool", "p": "wul", "me": [{"m": "Soft hair from sheep \u2014 Lana.", "e": "This sweater is made of wool."}, {"m": "Material made from animal hair \u2014 Tejido de lana.", "e": "She bought a wool blanket."}], "n": "Usually uncountable."}, {"id": "School vocabulary::Yarn", "cat": "School vocabulary", "w": "Yarn", "p": "yarn", "me": [{"m": "Long thread for knitting \u2014 Hilo / lana.", "e": "She knitted a scarf with blue yarn."}, {"m": "Long story, informal \u2014 Relato / cuento.", "e": "He told us an amusing yarn."}, {"m": "Tell stories or chat at length, informal \u2014 Contar historias / charlar largamente.", "e": "They yarned around the fire for hours."}], "n": "The story meaning is informal."}, {"id": "School vocabulary::Asset", "cat": "School vocabulary", "w": "Asset", "p": "\u00e1set", "me": [{"m": "Valuable thing owned \u2014 Activo / bien.", "e": "The company sold an asset."}, {"m": "Useful person or quality \u2014 Recurso / ventaja.", "e": "Her experience is an asset to the team."}, {"m": "Person who secretly provides information \u2014 Informante / activo de inteligencia.", "e": "The agency protected its overseas asset."}], "n": "In accounting, assets are things of value owned by a person or company."}, {"id": "School vocabulary::Greenhouse", "cat": "School vocabulary", "w": "Greenhouse", "p": "gr\u00edin-j\u00e1us", "me": [{"m": "Glass building for growing plants \u2014 Invernadero.", "e": "Tomatoes grow in the greenhouse."}, {"m": "Related to heat trapped in the atmosphere \u2014 De efecto invernadero.", "e": "Greenhouse gases warm the planet."}], "n": "The second meaning is usually used in phrases such as greenhouse gas or greenhouse effect."}, {"id": "School vocabulary::Intended", "cat": "School vocabulary", "w": "Intended", "p": "int\u00e9ndid", "me": [{"m": "Planned or meant \u2014 Previsto/a / intencionado/a.", "e": "The message had the intended effect."}, {"m": "Meant for a person or purpose \u2014 Destinado/a.", "e": "This book is intended for beginners."}, {"m": "Planned to do \u2014 Ten\u00eda la intenci\u00f3n de.", "e": "I intended to call you."}], "n": "Past tense or adjective from intend; intended for is a common pattern."}, {"id": "School vocabulary::Shut", "cat": "School vocabulary", "w": "Shut", "p": "shat", "me": [{"m": "Close \u2014 Cerrar.", "e": "Please shut the door."}, {"m": "Closed \u2014 Cerrado/a.", "e": "The store is shut today."}, {"m": "Exclude or prevent entry, usually with out \u2014 Excluir / impedir la entrada.", "e": "They shut him out of the meeting."}], "n": "Irregular verb: shut, shut, shut. Shut up can sound rude."}, {"id": "School vocabulary::Mourned", "cat": "School vocabulary", "w": "Mourned", "p": "mornd", "me": [{"m": "Felt sadness after a death or loss \u2014 Lament\u00f3 / guard\u00f3 luto.", "e": "She mourned her grandfather."}, {"m": "Expressed sorrow publicly \u2014 Lament\u00f3.", "e": "The nation mourned the victims."}, {"m": "Regretted or lamented a loss or change \u2014 Lament\u00f3 una p\u00e9rdida o cambio.", "e": "Residents mourned the loss of the old theater."}], "n": "Past tense of mourn; use mourn someone or mourn for someone."}, {"id": "School vocabulary::In time", "cat": "School vocabulary", "w": "In time", "p": "in t\u00e1im", "me": [{"m": "Before it is too late \u2014 A tiempo.", "e": "We arrived in time to catch the train."}, {"m": "Eventually \u2014 Con el tiempo.", "e": "In time, you will feel better."}, {"m": "Following the rhythm \u2014 Al comp\u00e1s.", "e": "Clap in time with the music."}], "n": "In time means early enough; do not confuse it with on time."}, {"id": "School vocabulary::On time", "cat": "School vocabulary", "w": "On time", "p": "on t\u00e1im", "me": [{"m": "At the scheduled time \u2014 Puntual / a tiempo.", "e": "The train arrived on time."}], "n": "On time means punctual; in time means before it is too late."}, {"id": "School vocabulary::Bloom", "cat": "School vocabulary", "w": "Bloom", "p": "bl\u00faum", "me": [{"m": "Produce flowers \u2014 Florecer.", "e": "The roses bloom in spring."}, {"m": "A flower or group of flowers \u2014 Floraci\u00f3n / flor.", "e": "The tree is covered in pink blooms."}, {"m": "Become healthy or successful \u2014 Prosperar.", "e": "Her confidence bloomed at school."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Planted", "cat": "School vocabulary", "w": "Planted", "p": "pl\u00e1ntid", "me": [{"m": "Put a seed or plant in soil \u2014 Plant\u00f3 / plantado.", "e": "They planted tomatoes in the garden."}, {"m": "Placed firmly \u2014 Coloc\u00f3 / clav\u00f3.", "e": "She planted her feet on the ground."}, {"m": "Placed secretly \u2014 Escondi\u00f3 / puso a escondidas.", "e": "Someone planted evidence in the room."}], "n": "Past tense and past participle of plant."}, {"id": "School vocabulary::To poke", "cat": "School vocabulary", "w": "To poke", "p": "tu p\u00f3uk", "me": [{"m": "Push lightly with a finger or object \u2014 Picar / empujar suavemente.", "e": "Do not poke me with the pencil."}, {"m": "Stick out \u2014 Asomarse / sobresalir.", "e": "A branch poked through the fence."}, {"m": "Search casually \u2014 Curiosear.", "e": "She poked around the old attic."}], "n": "Usually written simply as poke in dictionaries; poke around is a common phrasal verb."}, {"id": "School vocabulary::Literally", "cat": "School vocabulary", "w": "Literally", "p": "l\u00edterali", "me": [{"m": "In the exact, nonfigurative sense \u2014 Literalmente.", "e": "The word literally means exactly what it says."}, {"m": "Used informally for emphasis \u2014 Literalmente / de verdad.", "e": "I literally could not stop laughing."}], "n": "The informal emphatic use is common, though it may not be strictly literal."}, {"id": "School vocabulary::Limb", "cat": "School vocabulary", "w": "Limb", "p": "lim", "me": [{"m": "Arm or leg \u2014 Extremidad.", "e": "The injury affected his left limb."}, {"m": "Large branch of a tree \u2014 Rama principal.", "e": "The bird rested on a tree limb."}, {"m": "Part extending from something \u2014 Brazo / ramal.", "e": "The storm moved along the eastern limb."}], "n": "The b is silent."}, {"id": "School vocabulary::Jowls", "cat": "School vocabulary", "w": "Jowls", "p": "y\u00e1ulz", "me": [{"m": "Loose flesh below the cheeks or jaw \u2014 Papada / carrillos ca\u00eddos.", "e": "The old dog had heavy jowls."}, {"m": "Cheeks and jaw area \u2014 Mejillas y mand\u00edbula.", "e": "His jowls shook when he laughed."}], "n": "Corrected from Julls; usually plural."}, {"id": "School vocabulary::Bass", "cat": "School vocabulary", "w": "Bass", "p": "b\u00e9is / bas", "me": [{"m": "Low musical sound or voice \u2014 Bajo.", "e": "He sings bass in the choir."}, {"m": "Low-pitched instrument \u2014 Bajo.", "e": "She plays bass in a band."}, {"m": "Freshwater or sea fish \u2014 Lubina / r\u00f3balo.", "e": "They caught a bass in the lake."}], "n": "Pronounced b\u00e9is for music and bas for the fish."}, {"id": "School vocabulary::Casket", "cat": "School vocabulary", "w": "Casket", "p": "k\u00e1skit", "me": [{"m": "Box for a dead body \u2014 Ata\u00fad.", "e": "The flowers were placed beside the casket."}, {"m": "Small decorative box \u2014 Cofre / cajita.", "e": "She kept jewelry in a wooden casket."}], "n": "In American English, casket commonly means coffin."}, {"id": "School vocabulary::Count", "cat": "School vocabulary", "w": "Count", "p": "k\u00e1unt", "me": [{"m": "Determine the number \u2014 Contar.", "e": "Count the books on the shelf."}, {"m": "Include or matter \u2014 Contar / tener importancia.", "e": "Every vote counts."}, {"m": "Noble title \u2014 Conde.", "e": "The count lived in a castle."}], "n": "Can be a verb or noun; count on means rely on."}, {"id": "School vocabulary::Revenge", "cat": "School vocabulary", "w": "Revenge", "p": "riv\u00e9ny", "me": [{"m": "Harm done in return for harm \u2014 Venganza.", "e": "He wanted revenge for the betrayal."}, {"m": "Take revenge \u2014 Vengarse.", "e": "She revenged herself on her enemy."}], "n": "More commonly a noun; take revenge on is the usual expression."}, {"id": "School vocabulary::Bother", "cat": "School vocabulary", "w": "Bother", "p": "b\u00e1der", "me": [{"m": "Annoy or disturb \u2014 Molestar.", "e": "Please do not bother the baby."}, {"m": "Make an effort \u2014 Molestarse / tomarse la molestia.", "e": "Do not bother to call tonight."}, {"m": "Worry or trouble \u2014 Preocupar.", "e": "The problem has been bothering me."}], "n": "Can be a verb or noun; often followed by with or to plus a verb."}, {"id": "School vocabulary::Bug", "cat": "School vocabulary", "w": "Bug", "p": "bag", "me": [{"m": "Small insect \u2014 Bicho / insecto.", "e": "A bug landed on the window."}, {"m": "Annoy \u2014 Molestar.", "e": "That noise really bugs me."}, {"m": "Software error \u2014 Error inform\u00e1tico.", "e": "The update fixed the bug."}], "n": "Can also mean a hidden listening device."}, {"id": "School vocabulary::Don't bother me", "cat": "School vocabulary", "w": "Don't bother me", "p": "d\u00f3unt b\u00e1der m\u00ed", "me": [{"m": "Do not disturb or annoy me \u2014 No me molestes.", "e": "I am studying, so don't bother me."}], "n": "Direct expression; it can sound rude without please or a softer tone."}, {"id": "School vocabulary::Don't bug me", "cat": "School vocabulary", "w": "Don't bug me", "p": "d\u00f3unt bag m\u00ed", "me": [{"m": "Do not annoy me \u2014 No me fastidies / no me molestes.", "e": "Don't bug me while I am working."}], "n": "Informal and stronger than don't bother me in some contexts."}, {"id": "School vocabulary::Biennials", "cat": "School vocabulary", "w": "Biennials", "p": "bai\u00e9niolz", "me": [{"m": "Plants that complete their life cycle in two years \u2014 Plantas bienales.", "e": "Carrots are often grown as biennials."}, {"m": "Events occurring every two years \u2014 Eventos bienales.", "e": "The art biennials attract international visitors."}], "n": "Plural of biennial; do not confuse with biannual, which means twice a year."}, {"id": "School vocabulary::Sprout", "cat": "School vocabulary", "w": "Sprout", "p": "spr\u00e1ut", "me": [{"m": "Begin to grow \u2014 Brotar / germinar.", "e": "The seeds began to sprout."}, {"m": "Young shoot \u2014 Brote.", "e": "A green sprout appeared above the soil."}, {"m": "River in Virginia \u2014 R\u00edo Appomattox.", "e": "The Appomattox River flows through central Virginia."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Surrender", "cat": "School vocabulary", "w": "Surrender", "p": "sor\u00e9nder", "me": [{"m": "Stop resisting and give up \u2014 Rendirse.", "e": "The soldiers were ordered to surrender."}, {"m": "Give something up \u2014 Entregar / ceder.", "e": "Please surrender your passport at the desk."}, {"m": "Act of giving up \u2014 Rendici\u00f3n.", "e": "Their surrender ended the battle."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Appomattox", "cat": "School vocabulary", "w": "Appomattox", "p": "apom\u00e1taks", "me": [{"m": "Town in Virginia associated with the end of the U.S. Civil War \u2014 Appomattox.", "e": "The surrender at Appomattox occurred in 1865."}, {"m": "County in Virginia \u2014 Condado de Appomattox.", "e": "They visited Appomattox County."}], "n": "Corrected from Appromattox; a proper noun and therefore capitalized."}, {"id": "School vocabulary::Strikes me", "cat": "School vocabulary", "w": "Strikes me", "p": "str\u00e1iks m\u00ed", "me": [{"m": "Seems to me \u2014 Me parece.", "e": "It strikes me that we need a new plan."}, {"m": "Makes a strong impression on me \u2014 Me impacta.", "e": "Her honesty strikes me most."}, {"m": "Suddenly occurs to me \u2014 Se me ocurre.", "e": "It strikes me that I have seen him before."}], "n": "Often followed by as or by a that-clause."}, {"id": "School vocabulary::Assert", "cat": "School vocabulary", "w": "Assert", "p": "as\u00e9rt", "me": [{"m": "State firmly \u2014 Afirmar / aseverar.", "e": "She asserted that the report was accurate."}, {"m": "Defend or exercise a right \u2014 Hacer valer.", "e": "Workers asserted their right to organize."}, {"m": "Show confidence or authority \u2014 Imponerse.", "e": "He learned to assert himself."}], "n": "Assert oneself means act confidently or defend one's rights."}, {"id": "School vocabulary::Get lucky", "cat": "School vocabulary", "w": "Get lucky", "p": "get l\u00e1ki", "me": [{"m": "Have good fortune \u2014 Tener suerte.", "e": "We got lucky and found the last tickets."}, {"m": "Have an unexpectedly favorable result \u2014 Salir afortunado/a.", "e": "You might get lucky in the drawing."}, {"m": "Have sex, slang \u2014 Ligar / tener sexo.", "e": "He hoped to get lucky at the party."}], "n": "The slang meaning is informal and context-dependent."}, {"id": "School vocabulary::Harvest", "cat": "School vocabulary", "w": "Harvest", "p": "j\u00e1rvist", "me": [{"m": "Gather a crop \u2014 Cosechar.", "e": "Farmers harvest the wheat in summer."}, {"m": "Crop gathered \u2014 Cosecha.", "e": "The apple harvest was excellent."}, {"m": "Collect cells, organs, or resources \u2014 Extraer / recolectar.", "e": "The system harvests energy from sunlight."}], "n": "Corrected from Harvist; can be a noun or verb."}, {"id": "School vocabulary::Plains", "cat": "School vocabulary", "w": "Plains", "p": "pl\u00e9inz", "me": [{"m": "Large flat areas of land \u2014 Llanuras.", "e": "Bison once crossed the Great Plains."}, {"m": "Laments or complains, archaic \u2014 Se lamenta / se queja.", "e": "In the old poem, the speaker plains of his sorrow."}], "n": "Usually the plural of plain; as a verb, plain means lament or complain and is archaic. Do not confuse it with explain."}, {"id": "School vocabulary::Tides", "cat": "School vocabulary", "w": "Tides", "p": "t\u00e1idz", "me": [{"m": "Regular rise and fall of the sea \u2014 Mareas.", "e": "The moon influences the tides."}, {"m": "Powerful trends or changes \u2014 Corrientes / tendencias.", "e": "Public opinion turned with the political tides."}], "n": "Plural of tide; high tide and low tide are common expressions."}, {"id": "School vocabulary::Achieved", "cat": "School vocabulary", "w": "Achieved", "p": "ach\u00edivd", "me": [{"m": "Successfully reached a goal \u2014 Logr\u00f3 / alcanz\u00f3.", "e": "She achieved her goal after years of work."}, {"m": "Produced a desired result \u2014 Consigui\u00f3.", "e": "The treatment achieved good results."}], "n": "Past tense and past participle of achieve."}, {"id": "School vocabulary::Enzymes", "cat": "School vocabulary", "w": "Enzymes", "p": "\u00e9nzaimz", "me": [{"m": "Proteins that speed up chemical reactions \u2014 Enzimas.", "e": "Digestive enzymes break down food."}, {"m": "Biological catalysts \u2014 Catalizadores biol\u00f3gicos.", "e": "Enzymes help cells perform essential reactions."}], "n": "Plural of enzyme."}, {"id": "School vocabulary::Split off", "cat": "School vocabulary", "w": "Split off", "p": "split \u00f3f", "me": [{"m": "Separate from a larger group \u2014 Separarse / escindirse.", "e": "A small faction split off from the party."}, {"m": "Separate a part \u2014 Desprender / separar.", "e": "The company split off its software division."}], "n": "Can be transitive or intransitive; split off from is common."}, {"id": "School vocabulary::Stye (orzuelo)", "cat": "School vocabulary", "w": "Stye (orzuelo)", "p": "st\u00e1i", "me": [{"m": "Painful red lump on the eyelid \u2014 Orzuelo.", "e": "She developed a stye on her upper eyelid."}], "n": "English term supplied for the Spanish word orzuelo; also spelled sty."}, {"id": "School vocabulary::Split ends", "cat": "School vocabulary", "w": "Split ends", "p": "split endz", "me": [{"m": "Hair ends that have divided or frayed \u2014 Puntas abiertas.", "e": "This conditioner helps prevent split ends."}], "n": "Usually plural."}, {"id": "School vocabulary::Donate", "cat": "School vocabulary", "w": "Donate", "p": "d\u00f3uneit", "me": [{"m": "Give money or goods to help \u2014 Donar.", "e": "They donated clothes to the shelter."}, {"m": "Give blood or an organ \u2014 Donar.", "e": "She donates blood twice a year."}, {"m": "Contribute time, skills, or services \u2014 Donar tiempo / aportar servicios.", "e": "Several doctors donated their time to the clinic."}], "n": "Common patterns: donate something to an organization and donate to a cause."}, {"id": "School vocabulary::Because of", "cat": "School vocabulary", "w": "Because of", "p": "bik\u00f3z ov", "me": [{"m": "For the reason of \u2014 A causa de / debido a.", "e": "The game was canceled because of the rain."}], "n": "Followed by a noun, pronoun, or -ing form; because is followed by a clause."}, {"id": "School vocabulary::Fetus", "cat": "School vocabulary", "w": "Fetus", "p": "f\u00edtas", "me": [{"m": "Developing human or animal before birth \u2014 Feto.", "e": "The fetus continued to develop normally."}], "n": "Plural: fetuses or, in technical use, fetuses/foetuses depending on spelling convention."}, {"id": "School vocabulary::Embryonic", "cat": "School vocabulary", "w": "Embryonic", "p": "embri\u00e1nik", "me": [{"m": "Related to an embryo \u2014 Embrionario/a.", "e": "The scientist studied embryonic development."}, {"m": "At a very early stage \u2014 Incipiente.", "e": "The project is still in its embryonic stage."}], "n": "Corrected from Embryoaic."}, {"id": "School vocabulary::Hay", "cat": "School vocabulary", "w": "Hay", "p": "j\u00e9i", "me": [{"m": "Dried grass used as animal food \u2014 Heno.", "e": "The horses ate hay in the barn."}, {"m": "Marijuana, slang \u2014 Marihuana.", "e": "The word hay can refer to marijuana in informal slang."}], "n": "Usually uncountable; a bale of hay is countable."}, {"id": "School vocabulary::It's like finding a needle in a haystack", "cat": "School vocabulary", "w": "It's like finding a needle in a haystack", "p": "its l\u00e1ik f\u00e1inding a n\u00edidol in a j\u00e9istak", "me": [{"m": "It is extremely difficult to find \u2014 Es como buscar una aguja en un pajar.", "e": "Finding that old file is like finding a needle in a haystack."}], "n": "Corrected apostrophe and spelling; the standard expression uses haystack as one word."}, {"id": "School vocabulary::Needle", "cat": "School vocabulary", "w": "Needle", "p": "n\u00edidol", "me": [{"m": "Thin pointed tool for sewing \u2014 Aguja.", "e": "Thread the needle before you sew."}, {"m": "Thin medical instrument \u2014 Aguja.", "e": "The nurse used a sterile needle."}, {"m": "Provoke or tease \u2014 Provocar / picar.", "e": "His friends needled him about the mistake."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Humid", "cat": "School vocabulary", "w": "Humid", "p": "hi\u00famid", "me": [{"m": "Containing a lot of moisture in the air \u2014 H\u00famedo/a.", "e": "The weather is hot and humid today."}], "n": "Usually describes air, weather, or climate; damp is common for objects and surfaces."}, {"id": "School vocabulary::Manlike", "cat": "School vocabulary", "w": "Manlike", "p": "m\u00e1nlaik", "me": [{"m": "Resembling a man \u2014 Semejante a un hombre.", "e": "The figure had a manlike shape."}, {"m": "Traditionally masculine in character \u2014 Varonil.", "e": "The story describes his manlike courage."}], "n": "Valid but uncommon; humanlike or masculine may be more natural depending on context."}, {"id": "School vocabulary::Decompose", "cat": "School vocabulary", "w": "Decompose", "p": "diikomp\u00f3uz", "me": [{"m": "Decay naturally \u2014 Descomponerse.", "e": "Leaves decompose on the forest floor."}, {"m": "Break into simpler parts \u2014 Descomponer.", "e": "Heat can decompose the chemical compound."}, {"m": "Analyze into basic components \u2014 Descomponer / factorizar.", "e": "The software decomposes the signal into frequencies."}], "n": "Can be transitive or intransitive."}, {"id": "School vocabulary::Constituent", "cat": "School vocabulary", "w": "Constituent", "p": "konst\u00edchuent", "me": [{"m": "One part of a whole \u2014 Componente / constituyente.", "e": "Hydrogen is a constituent of water."}, {"m": "Voter represented by an official \u2014 Elector/a.", "e": "The senator met with her constituents."}, {"m": "Forming part of a whole \u2014 Constitutivo/a.", "e": "The constituent elements were analyzed."}], "n": "Can be a noun or adjective."}, {"id": "School vocabulary::Gay", "cat": "School vocabulary", "w": "Gay", "p": "gu\u00e9i", "me": [{"m": "Attracted to people of the same sex \u2014 Gay / homosexual.", "e": "He is openly gay."}, {"m": "Cheerful or brightly colored, older use \u2014 Alegre / vistoso/a.", "e": "They wore gay costumes in the old novel."}], "n": "The modern primary meaning concerns sexual orientation; the cheerful meaning is dated."}, {"id": "School vocabulary::Bonds", "cat": "School vocabulary", "w": "Bonds", "p": "bandz", "me": [{"m": "Connections between people or groups \u2014 V\u00ednculos / lazos.", "e": "Shared experiences created strong bonds."}, {"m": "Debt investments \u2014 Bonos.", "e": "The company issued government-backed bonds."}, {"m": "Things that bind or restrain \u2014 Ataduras.", "e": "The prisoner broke his bonds."}], "n": "Plural noun or third-person form of bond."}, {"id": "School vocabulary::Derive", "cat": "School vocabulary", "w": "Derive", "p": "dir\u00e1iv", "me": [{"m": "Obtain from a source \u2014 Obtener / derivar.", "e": "Many medicines derive from plants."}, {"m": "Develop from an origin \u2014 Provenir.", "e": "The word derives from Latin."}, {"m": "Formed from another word or base \u2014 Derivado de otra palabra o ra\u00edz.", "e": "The adjective readable is derived from the verb read."}], "n": "Corrected from Deriyed; common patterns: derive from and derive something from."}, {"id": "School vocabulary::Derived", "cat": "School vocabulary", "w": "Derived", "p": "dir\u00e1ivd", "me": [{"m": "Obtained from a source \u2014 Derivado/a.", "e": "This medicine is derived from a plant."}, {"m": "Developed through calculation or reasoning \u2014 Deducido/a.", "e": "The result was derived from the data."}, {"m": "Supply a ship or engine with coal \u2014 Abastecer de carb\u00f3n.", "e": "Workers coaled the steamship before departure."}], "n": "Past tense and past participle of derive."}, {"id": "School vocabulary::Coal", "cat": "School vocabulary", "w": "Coal", "p": "k\u00f3ul", "me": [{"m": "Black fossil fuel \u2014 Carb\u00f3n mineral.", "e": "The power plant once burned coal."}, {"m": "Burning piece of material \u2014 Brasa.", "e": "A glowing coal fell from the fire."}, {"m": "Damage someone's reputation by association \u2014 Manchar la reputaci\u00f3n.", "e": "Critics tried to tar everyone with the same brush."}], "n": "Usually uncountable as a fuel."}, {"id": "School vocabulary::Tar", "cat": "School vocabulary", "w": "Tar", "p": "tar", "me": [{"m": "Thick dark substance \u2014 Alquitr\u00e1n.", "e": "Road workers covered the surface with tar."}, {"m": "Cover with tar \u2014 Alquitranar.", "e": "They tarred the roof to stop leaks."}], "n": "Can be a noun or verb; past tense: tarred."}, {"id": "School vocabulary::Aeronomy", "cat": "School vocabulary", "w": "Aeronomy", "p": "er\u00e1nomi", "me": [{"m": "Study of the upper atmosphere \u2014 Aeronom\u00eda.", "e": "Aeronomy examines the chemistry of the upper atmosphere."}], "n": "Scientific field related to atmospheric physics and chemistry."}, {"id": "School vocabulary::Broad", "cat": "School vocabulary", "w": "Broad", "p": "brod", "me": [{"m": "Wide \u2014 Ancho/a.", "e": "The river is broad at this point."}, {"m": "General and not detailed \u2014 Amplio/a / general.", "e": "The report gives a broad overview."}, {"m": "Including many kinds or people \u2014 Extenso/a / diverso/a.", "e": "The policy has broad support."}], "n": "The comparative form is broader."}, {"id": "School vocabulary::Encourage", "cat": "School vocabulary", "w": "Encourage", "p": "enk\u00e9rich", "me": [{"m": "Give confidence or support \u2014 Animar / alentar.", "e": "Her teacher encouraged her to continue."}, {"m": "Promote or make more likely \u2014 Fomentar.", "e": "The program encourages healthy habits."}], "n": "Common pattern: encourage someone to do something."}, {"id": "School vocabulary::Likely", "cat": "School vocabulary", "w": "Likely", "p": "l\u00e1ikli", "me": [{"m": "Probable \u2014 Probable.", "e": "Rain is likely this afternoon."}, {"m": "Probably \u2014 Probablemente.", "e": "She will likely arrive early."}, {"m": "Rapid expansion of the early universe \u2014 Inflaci\u00f3n c\u00f3smica.", "e": "Cosmic inflation may explain the universe's large-scale uniformity."}], "n": "As an adjective, often used with be; likely can also be an adverb."}, {"id": "School vocabulary::Increase", "cat": "School vocabulary", "w": "Increase", "p": "\u00ednkris / inkr\u00edis", "me": [{"m": "Become or make greater \u2014 Aumentar.", "e": "Prices increased last month."}, {"m": "A rise in amount \u2014 Aumento.", "e": "There was an increase in demand."}], "n": "Noun stress: \u00ednkris; verb stress: inkr\u00edis."}, {"id": "School vocabulary::Inflation", "cat": "School vocabulary", "w": "Inflation", "p": "infl\u00e9ishon", "me": [{"m": "General rise in prices \u2014 Inflaci\u00f3n.", "e": "High inflation reduces purchasing power."}, {"m": "Act of filling with air or gas \u2014 Inflado.", "e": "The inflation of the balloon took seconds."}], "n": "In economics, inflation means a sustained general increase in prices."}, {"id": "School vocabulary::Rise", "cat": "School vocabulary", "w": "Rise", "p": "r\u00e1iz", "me": [{"m": "Move upward \u2014 Subir / elevarse.", "e": "The sun rises in the east."}, {"m": "Increase \u2014 Aumentar.", "e": "Prices continue to rise."}, {"m": "An increase, noun \u2014 Subida / aumento.", "e": "The company reported a rise in sales."}], "n": "Intransitive: something rises by itself; irregular forms: rise, rose, risen."}, {"id": "School vocabulary::Raise", "cat": "School vocabulary", "w": "Raise", "p": "r\u00e9iz", "me": [{"m": "Lift something \u2014 Levantar.", "e": "Raise your hand if you know the answer."}, {"m": "Increase something \u2014 Aumentar.", "e": "The company raised its prices."}, {"m": "Collect money or bring up a topic \u2014 Recaudar / plantear.", "e": "They raised funds for the school."}], "n": "Transitive: someone raises something; regular forms: raise, raised, raised."}, {"id": "School vocabulary::Tight", "cat": "School vocabulary", "w": "Tight", "p": "t\u00e1it", "me": [{"m": "Firmly fixed or fitting closely \u2014 Apretado/a.", "e": "These shoes are too tight."}, {"m": "Strict or limited \u2014 Estricto/a / limitado/a.", "e": "We are working with a tight budget."}, {"m": "Close or difficult \u2014 Re\u00f1ido/a / dif\u00edcil.", "e": "It was a tight race."}], "n": "Can describe clothing, schedules, money, or competition."}, {"id": "School vocabulary::Pride", "cat": "School vocabulary", "w": "Pride", "p": "pr\u00e1id", "me": [{"m": "Feeling of satisfaction \u2014 Orgullo.", "e": "She takes pride in her work."}, {"m": "Excessive self-importance \u2014 Soberbia.", "e": "His pride kept him from apologizing."}, {"m": "Group of lions \u2014 Manada de leones.", "e": "We saw a pride of lions."}], "n": "Take pride in is a common expression."}, {"id": "School vocabulary::Grace", "cat": "School vocabulary", "w": "Grace", "p": "gr\u00e9is", "me": [{"m": "Elegance of movement or behavior \u2014 Gracia / elegancia.", "e": "She danced with grace."}, {"m": "Kindness or goodwill \u2014 Benevolencia.", "e": "He accepted the criticism with grace."}, {"m": "Short prayer before a meal \u2014 Bendici\u00f3n.", "e": "They said grace before dinner."}], "n": "Corrected from Agrace; with good grace means willingly and politely."}, {"id": "School vocabulary::Accept something with good grace", "cat": "School vocabulary", "w": "Accept something with good grace", "p": "aks\u00e9pt s\u00e1mthing uith gud gr\u00e9is", "me": [{"m": "Accept something willingly and politely \u2014 Aceptar algo de buena gana.", "e": "She accepted the decision with good grace."}], "n": "Good grace suggests calmness and no resentment."}, {"id": "School vocabulary::Brag", "cat": "School vocabulary", "w": "Brag", "p": "brag", "me": [{"m": "Talk proudly about yourself or achievements \u2014 Presumir / fanfarronear.", "e": "He likes to brag about his grades."}, {"m": "A boastful statement \u2014 Presunci\u00f3n / alarde.", "e": "Her comment sounded like a brag."}], "n": "Can be a noun or verb; usually followed by about."}, {"id": "School vocabulary::Brag about", "cat": "School vocabulary", "w": "Brag about", "p": "brag ab\u00e1ut", "me": [{"m": "Speak too proudly about something \u2014 Presumir de algo.", "e": "They bragged about winning the championship."}], "n": "Brag about is inseparable; past tense: bragged about."}, {"id": "School vocabulary::Announce", "cat": "School vocabulary", "w": "Announce", "p": "an\u00e1uns", "me": [{"m": "Make information publicly known \u2014 Anunciar.", "e": "The school announced the results."}, {"m": "State formally \u2014 Comunicar / declarar.", "e": "She announced that she was leaving."}], "n": "Common patterns: announce something and announce that plus a clause."}, {"id": "School vocabulary::Redundancies", "cat": "School vocabulary", "w": "Redundancies", "p": "rid\u00e1ndansiz", "me": [{"m": "Unnecessary repetitions \u2014 Redundancias.", "e": "The editor removed several redundancies."}, {"m": "Job losses because positions are no longer needed \u2014 Despidos por reestructuraci\u00f3n.", "e": "The company announced twenty redundancies."}], "n": "Plural of redundancy; the employment meaning is especially common in British English."}, {"id": "School vocabulary::Engagement", "cat": "School vocabulary", "w": "Engagement", "p": "eng\u00e9ichment", "me": [{"m": "Agreement to marry \u2014 Compromiso matrimonial.", "e": "They announced their engagement."}, {"m": "Appointment or commitment \u2014 Compromiso / cita.", "e": "She has a speaking engagement tonight."}, {"m": "Involvement or participation \u2014 Participaci\u00f3n.", "e": "Student engagement improved this term."}], "n": "Meaning depends on context."}, {"id": "School vocabulary::Retirement", "cat": "School vocabulary", "w": "Retirement", "p": "rit\u00e1irment", "me": [{"m": "Leaving work permanently, usually because of age \u2014 Jubilaci\u00f3n.", "e": "He is planning for retirement."}, {"m": "Withdrawal from use or competition \u2014 Retiro.", "e": "The athlete announced her retirement."}], "n": "Usually uncountable when describing the life stage."}, {"id": "School vocabulary::Appear", "cat": "School vocabulary", "w": "Appear", "p": "ap\u00edr", "me": [{"m": "Become visible or arrive \u2014 Aparecer.", "e": "A rainbow appeared after the storm."}, {"m": "Seem \u2014 Parecer.", "e": "She appears tired today."}, {"m": "Perform or be shown publicly \u2014 Aparecer / actuar.", "e": "He appeared on television."}], "n": "Common patterns: appear to be and appear in/on."}, {"id": "School vocabulary::Daily Mail", "cat": "School vocabulary", "w": "Daily Mail", "p": "d\u00e9ili m\u00e9il", "me": [{"m": "British newspaper name \u2014 Daily Mail.", "e": "She read the story in the Daily Mail."}, {"m": "Mail received or delivered each day \u2014 Correo diario.", "e": "He sorts the daily mail every morning."}], "n": "Capitalize both words when referring to the newspaper."}, {"id": "School vocabulary::Arrange", "cat": "School vocabulary", "w": "Arrange", "p": "arr\u00e9inch", "me": [{"m": "Put things in order \u2014 Organizar / acomodar.", "e": "She arranged the books by color."}, {"m": "Plan or prepare \u2014 Organizar / concertar.", "e": "We arranged a meeting for Friday."}, {"m": "Make an agreement \u2014 Acordar.", "e": "They arranged to meet at noon."}], "n": "Common patterns: arrange something and arrange to do something."}, {"id": "School vocabulary::Settle", "cat": "School vocabulary", "w": "Settle", "p": "s\u00e9tol", "me": [{"m": "Resolve a disagreement or problem \u2014 Resolver.", "e": "They settled the dispute peacefully."}, {"m": "Begin living permanently \u2014 Establecerse.", "e": "The family settled in Canada."}, {"m": "Pay an amount owed \u2014 Saldar / pagar.", "e": "He settled the bill before leaving."}], "n": "Can be transitive or intransitive."}, {"id": "School vocabulary::Exasperating", "cat": "School vocabulary", "w": "Exasperating", "p": "igz\u00e1sper\u00e9iting", "me": [{"m": "Extremely annoying or frustrating \u2014 Exasperante.", "e": "The repeated delays were exasperating."}], "n": "Adjective from exasperate; a person feels exasperated, but a situation is exasperating."}, {"id": "School vocabulary::Vase", "cat": "School vocabulary", "w": "Vase", "p": "v\u00e9is / vaz", "me": [{"m": "Container for flowers \u2014 Florero / jarr\u00f3n.", "e": "She put the roses in a glass vase."}], "n": "Pronunciation varies: v\u00e9is is common in American English; vaz or voz occurs in British English."}, {"id": "School vocabulary::Christened", "cat": "School vocabulary", "w": "Christened", "p": "kr\u00edsend", "me": [{"m": "Given a name in a Christian ceremony \u2014 Bautizado/a.", "e": "The baby was christened on Sunday."}, {"m": "Named something \u2014 Bautiz\u00f3 / puso por nombre.", "e": "They christened the boat Sea Star."}, {"m": "Used for the first time \u2014 Estren\u00f3.", "e": "She christened her new shoes at the party."}], "n": "Past tense and past participle of christen; the t is silent."}, {"id": "School vocabulary::Christen", "cat": "School vocabulary", "w": "Christen", "p": "kr\u00edsen", "me": [{"m": "Give a name during a Christian ceremony \u2014 Bautizar.", "e": "They will christen the baby next month."}, {"m": "Give a name to something \u2014 Poner nombre.", "e": "The crew christened the new ship."}, {"m": "Use something for the first time \u2014 Estrenar.", "e": "He christened the new grill with steaks."}], "n": "The t is silent."}, {"id": "School vocabulary::Christening", "cat": "School vocabulary", "w": "Christening", "p": "kr\u00edsening", "me": [{"m": "Christian naming or baptism ceremony \u2014 Bautizo.", "e": "The family attended the baby's christening."}, {"m": "Act of naming or first using something \u2014 Inauguraci\u00f3n / estreno.", "e": "The ship's christening drew a crowd."}], "n": "Gerund or noun from christen."}, {"id": "School vocabulary::Meters", "cat": "School vocabulary", "w": "Meters", "p": "m\u00edterz", "me": [{"m": "Devices that measure something \u2014 Medidores / contadores.", "e": "Workers checked the electricity meters."}, {"m": "Units of length, American spelling \u2014 Metros.", "e": "The pool is fifty meters long."}, {"m": "Poetic rhythmic patterns \u2014 M\u00e9trica.", "e": "The poems use different meters."}], "n": "American spelling for the length unit; British spelling is metres."}, {"id": "School vocabulary::Metres", "cat": "School vocabulary", "w": "Metres", "p": "m\u00edterz", "me": [{"m": "Units of length, British spelling \u2014 Metros.", "e": "The finish line is one hundred metres away."}], "n": "British spelling of meters when referring to units of length; measuring devices are meters."}, {"id": "School vocabulary::Cracking", "cat": "School vocabulary", "w": "Cracking", "p": "kr\u00e1king", "me": [{"m": "Breaking or developing cracks \u2014 Agriet\u00e1ndose / rompi\u00e9ndose.", "e": "The ice is cracking under the pressure."}, {"m": "Excellent, British informal \u2014 Excelente / estupendo/a.", "e": "That was a cracking performance."}, {"m": "Sharp sound \u2014 Chasquido / estallido.", "e": "We heard the cracking of branches."}], "n": "Meaning depends on context."}, {"id": "School vocabulary::Hare", "cat": "School vocabulary", "w": "Hare", "p": "jer", "me": [{"m": "Fast-running animal similar to a large rabbit \u2014 Liebre.", "e": "A hare ran across the field."}, {"m": "Move very quickly, British informal \u2014 Correr precipitadamente.", "e": "She hared down the street to catch the bus."}], "n": "Do not confuse hare with hair or hear; hares are generally larger than rabbits."}, {"id": "School vocabulary::Cargo", "cat": "School vocabulary", "w": "Cargo", "p": "k\u00e1rgou", "me": [{"m": "Goods carried by a ship, aircraft, or vehicle \u2014 Carga.", "e": "The ship carried valuable cargo."}], "n": "Usually uncountable; plural cargoes or cargos."}, {"id": "School vocabulary::Rucksack", "cat": "School vocabulary", "w": "Rucksack", "p": "r\u00e1ksak", "me": [{"m": "Bag carried on the back \u2014 Mochila.", "e": "He packed his lunch in a rucksack."}], "n": "Common in British English; backpack is common in American English."}, {"id": "School vocabulary::Banners", "cat": "School vocabulary", "w": "Banners", "p": "b\u00e1nerz", "me": [{"m": "Long signs or flags \u2014 Pancartas / estandartes.", "e": "The crowd carried colorful banners."}, {"m": "Large online advertisements \u2014 Banners publicitarios.", "e": "The website displays advertising banners."}], "n": "Plural of banner."}, {"id": "School vocabulary::Wheat", "cat": "School vocabulary", "w": "Wheat", "p": "u\u00edit", "me": [{"m": "Grain used to make flour \u2014 Trigo.", "e": "The farmer grows wheat."}], "n": "Usually uncountable."}, {"id": "School vocabulary::Whole wheat bread", "cat": "School vocabulary", "w": "Whole wheat bread", "p": "j\u00f3ul u\u00edit bred", "me": [{"m": "Bread made with flour containing the entire wheat grain \u2014 Pan integral.", "e": "We usually eat whole wheat bread for breakfast."}], "n": "Wholemeal bread is the common British term."}, {"id": "School vocabulary::Motion", "cat": "School vocabulary", "w": "Motion", "p": "m\u00f3ushon", "me": [{"m": "Movement \u2014 Movimiento.", "e": "The camera detected motion."}, {"m": "Formal proposal in a meeting \u2014 Moci\u00f3n.", "e": "The committee approved the motion."}, {"m": "Gesture used to communicate \u2014 Se\u00f1a / gesto.", "e": "She motioned for us to sit down."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Purse", "cat": "School vocabulary", "w": "Purse", "p": "pers", "me": [{"m": "Small bag for carrying money and personal items \u2014 Bolso / cartera.", "e": "She put her keys in her purse."}, {"m": "Money available for a prize \u2014 Premio / bolsa.", "e": "The winner received a large purse."}, {"m": "Draw the lips together \u2014 Fruncir.", "e": "He pursed his lips thoughtfully."}], "n": "In British English, purse often means a small wallet, especially for coins."}, {"id": "School vocabulary::Bag", "cat": "School vocabulary", "w": "Bag", "p": "bag", "me": [{"m": "Flexible container \u2014 Bolsa / bolso.", "e": "Put the groceries in a bag."}, {"m": "Capture or obtain, informal \u2014 Conseguir / atrapar.", "e": "She bagged the last ticket."}, {"m": "Criticize, informal \u2014 Criticar.", "e": "Stop bagging my ideas."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Tote", "cat": "School vocabulary", "w": "Tote", "p": "t\u00f3ut", "me": [{"m": "Carry something, especially something heavy \u2014 Cargar / transportar.", "e": "He toted the boxes upstairs."}, {"m": "Large open bag \u2014 Bolso tote / bolsa grande.", "e": "She carried a canvas tote."}], "n": "Can be a noun or verb; tote bag is the common noun phrase."}, {"id": "School vocabulary::Male purse", "cat": "School vocabulary", "w": "Male purse", "p": "m\u00e9il pers", "me": [{"m": "Small bag carried by a man \u2014 Bolso de hombre.", "e": "He keeps his phone in a small male purse."}], "n": "Corrected from Mail purse; man bag or crossbody bag is often more natural."}, {"id": "School vocabulary::Waist bag", "cat": "School vocabulary", "w": "Waist bag", "p": "u\u00e9ist bag", "me": [{"m": "Small bag worn around the waist \u2014 Ri\u00f1onera / cangurera.", "e": "She carried her passport in a waist bag."}], "n": "Also called a belt bag, fanny pack in American English, or bum bag in British English."}, {"id": "School vocabulary::Court-martial", "cat": "School vocabulary", "w": "Court-martial", "p": "kort m\u00e1rshal", "me": [{"m": "Military court for service members \u2014 Consejo de guerra / tribunal militar.", "e": "The officer faced a court-martial."}, {"m": "Try someone in a military court \u2014 Someter a consejo de guerra.", "e": "The army court-martialed the soldier."}], "n": "Hyphenated; plural noun: courts-martial."}, {"id": "School vocabulary::Shoulder holster", "cat": "School vocabulary", "w": "Shoulder holster", "p": "sh\u00f3ulder j\u00f3ulster", "me": [{"m": "Harness for carrying a handgun under the arm \u2014 Sobaquera / funda de hombro.", "e": "The detective wore a shoulder holster under his jacket."}], "n": "Usually secured around the shoulder and torso."}, {"id": "School vocabulary::Holster", "cat": "School vocabulary", "w": "Holster", "p": "j\u00f3ulster", "me": [{"m": "Case for carrying a handgun \u2014 Funda de pistola.", "e": "The officer returned the pistol to its holster."}, {"m": "Put a weapon in its holster \u2014 Enfundar.", "e": "She holstered the weapon."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Judge", "cat": "School vocabulary", "w": "Judge", "p": "yach", "me": [{"m": "Official who decides court cases \u2014 Juez/a.", "e": "The judge listened to both sides."}, {"m": "Form an opinion or decision \u2014 Juzgar / evaluar.", "e": "Do not judge a book by its cover."}, {"m": "Expert who evaluates a contest \u2014 Jurado/a.", "e": "She served as a judge in the competition."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Blank", "cat": "School vocabulary", "w": "Blank", "p": "blank", "me": [{"m": "Empty or without writing \u2014 En blanco.", "e": "Please fill in the blank space."}, {"m": "Without expression or memory \u2014 Inexpresivo/a / en blanco.", "e": "He gave me a blank look."}, {"m": "Empty space to complete \u2014 Espacio en blanco.", "e": "Write your name in the blank."}], "n": "Can be an adjective or noun."}, {"id": "School vocabulary::Have drawn a blank", "cat": "School vocabulary", "w": "Have drawn a blank", "p": "jav dr\u00f3n a blank", "me": [{"m": "Have failed to remember or find an answer \u2014 Haberse quedado en blanco.", "e": "I have drawn a blank on his name."}, {"m": "Have found nothing after searching \u2014 No haber encontrado nada.", "e": "Investigators have drawn a blank so far."}], "n": "Present-perfect form of draw a blank; draw, drew, drawn."}, {"id": "School vocabulary::Burglars", "cat": "School vocabulary", "w": "Burglars", "p": "b\u00e9rglerz", "me": [{"m": "People who illegally enter buildings to steal \u2014 Ladrones / asaltantes de viviendas.", "e": "Burglars broke into the house at night."}], "n": "Plural of burglar; burglary is the crime."}, {"id": "School vocabulary::Catch somebody red-handed", "cat": "School vocabulary", "w": "Catch somebody red-handed", "p": "kach s\u00e1mbadi red-j\u00e1ndid", "me": [{"m": "Catch someone while committing an offense \u2014 Atrapar a alguien con las manos en la masa.", "e": "The police caught the burglar red-handed."}], "n": "Corrected punctuation; red-handed is hyphenated."}, {"id": "School vocabulary::Hassle", "cat": "School vocabulary", "w": "Hassle", "p": "j\u00e1sol", "me": [{"m": "Annoying difficulty or inconvenience \u2014 Molestia / l\u00edo.", "e": "Parking downtown is a hassle."}, {"m": "Bother or pressure someone \u2014 Molestar / acosar.", "e": "Stop hassling me about the deadline."}], "n": "Can be a noun or verb; informal."}, {"id": "School vocabulary::Nuisance", "cat": "School vocabulary", "w": "Nuisance", "p": "n\u00fausans", "me": [{"m": "Annoying person, thing, or situation \u2014 Molestia / fastidio.", "e": "The constant noise is a nuisance."}, {"m": "Something causing inconvenience or harm \u2014 Problema / estorbo.", "e": "Mosquitoes are a serious nuisance here."}], "n": "Corrected from Nulsance; common phrase: a nuisance to someone."}, {"id": "School vocabulary::Powertrain", "cat": "School vocabulary", "w": "Powertrain", "p": "p\u00e1uertr\u00e9in", "me": [{"m": "Parts that produce and deliver power in a vehicle \u2014 Tren motriz.", "e": "The electric car has a quiet powertrain."}], "n": "Usually includes the engine or motor, transmission, and drivetrain components."}, {"id": "School vocabulary::Note", "cat": "School vocabulary", "w": "Note", "p": "n\u00f3ut", "me": [{"m": "Short written record \u2014 Nota / apunte.", "e": "She wrote a note to her teacher."}, {"m": "Notice or pay attention to \u2014 Notar / observar.", "e": "Please note the change in schedule."}, {"m": "Musical sound or symbol \u2014 Nota musical.", "e": "He played the wrong note."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Bill", "cat": "School vocabulary", "w": "Bill", "p": "bil", "me": [{"m": "Request for payment \u2014 Factura / cuenta.", "e": "The waiter brought the bill."}, {"m": "Proposed law \u2014 Proyecto de ley.", "e": "Congress debated the new bill."}, {"m": "Paper money, American English \u2014 Billete.", "e": "She paid with a twenty-dollar bill."}], "n": "Can also mean a bird's beak or the brim of a cap."}, {"id": "School vocabulary::Harm", "cat": "School vocabulary", "w": "Harm", "p": "jarm", "me": [{"m": "Physical or emotional damage \u2014 Da\u00f1o / perjuicio.", "e": "The chemical can cause serious harm."}, {"m": "Damage or injure \u2014 Da\u00f1ar / perjudicar.", "e": "Pollution harms wildlife."}, {"m": "Wrongdoing or negative effect \u2014 Mal / efecto negativo.", "e": "There is no harm in asking."}], "n": "Can be a noun or verb; common patterns: cause harm, do harm, and harmful to."}, {"id": "School vocabulary::Likelihood", "cat": "School vocabulary", "w": "Likelihood", "p": "l\u00e1iklihud", "me": [{"m": "Probability that something will happen \u2014 Probabilidad.", "e": "There is a high likelihood of rain."}, {"m": "Chance or possibility \u2014 Posibilidad.", "e": "The treatment increases the likelihood of recovery."}], "n": "Usually followed by of plus a noun or -ing form, or by a that-clause."}, {"id": "School vocabulary::Decay", "cat": "School vocabulary", "w": "Decay", "p": "dik\u00e9i", "me": [{"m": "Gradual rotting or deterioration \u2014 Descomposici\u00f3n / deterioro.", "e": "Tooth decay can cause pain."}, {"m": "Rot or deteriorate gradually \u2014 Descomponerse / deteriorarse.", "e": "Dead leaves decay on the forest floor."}, {"m": "Gradual decline \u2014 Decadencia.", "e": "The building fell into decay."}], "n": "Can be a noun or verb; regular verb: decayed."}, {"id": "School vocabulary::Decaying", "cat": "School vocabulary", "w": "Decaying", "p": "dik\u00e9iing", "me": [{"m": "Rotting or decomposing \u2014 En descomposici\u00f3n.", "e": "The forest floor was covered with decaying leaves."}, {"m": "Gradually deteriorating \u2014 Deterior\u00e1ndose.", "e": "They repaired the decaying wooden structure."}], "n": "Present participle or adjective from decay."}, {"id": "School vocabulary::Harbor", "cat": "School vocabulary", "w": "Harbor", "p": "j\u00e1rbor", "me": [{"m": "Sheltered place for boats \u2014 Puerto / bah\u00eda protegida.", "e": "The fishing boats returned to the harbor."}, {"m": "Keep or hide a feeling or thought \u2014 Albergar.", "e": "She still harbors doubts about the plan."}, {"m": "Give shelter or protection \u2014 Refugiar / proteger.", "e": "The cave harbored several animals."}], "n": "Can be a noun or verb. British spelling: harbour."}, {"id": "School vocabulary::Heirloom", "cat": "School vocabulary", "w": "Heirloom", "p": "\u00e9rlum", "me": [{"m": "Valuable object passed through a family \u2014 Reliquia familiar.", "e": "This ring
