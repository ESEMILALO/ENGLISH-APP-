  // Picks LEARNSET_SIZE words from a topic and locks them in, so the same
  // set comes back every session until each one is mastered. Words already
  // mastered are skipped when choosing; if a topic has fewer unmastered
  // words left than that, the set is just smaller.
  function buildLearnSet(cat){
    const pool = sortByPriority(WORDS.filter(w=>w.cat===cat && statusOf(w.id)!=='mastered'));
    const picks = pool.slice(0, LEARNSET_SIZE);
    learnSets[cat] = { wordIds: picks.map(w=>w.id), startedAt: new Date().toISOString() };
    saveLearnSets();
    return picks;
  }

  // Learn-a-set walks each word through the same three stages: meet it in
  // Recognize, prove you can produce it in Type it, then use it in context
  // with Sentence. Checked in order, so a missed word (step back to 0)
  // drops to Recognize for a rep before climbing again, while a word that
  // has already been typed once never repeats that stage.
  const LEARN_STAGES = { recognize:'Recognize', typed:'Type it', sentence:'Sentence' };
  function learnStageFor(w){
    const p = progress[w.id];
    if(!p || !p.seen || !p.step) return 'recognize';
    if(!p.typedOnce) return 'typed';
    return 'sentence';
  }
  function learnStageRank(w){
    const stage = learnStageFor(w);
    return stage==='recognize' ? 0 : (stage==='typed' ? 1 : 2);
  }

  // Returns the stored set as word objects, dropping any id that no longer
  // exists (e.g. the word was renamed in the spreadsheet). Null when the
  // topic has no set yet.
  function getLearnSet(cat){
    const info = learnSets[cat];
    if(!info || !info.wordIds || !info.wordIds.length) return null;
    const words = info.wordIds.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);
    return words.length ? words : null;
  }

  function todayStr(d){
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function friendlyDate(dateStr){
    const today = todayStr();
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    const yesterday = todayStr(yd);
    if(dateStr===today) return 'Today';
    if(dateStr===yesterday) return 'Yesterday';
    const parts = dateStr.split('-').map(Number);
    const dt = new Date(parts[0], parts[1]-1, parts[2]);
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }

  function recordSession(kind, label, total, correct){
    const today = todayStr();
    meta.history.unshift({date:today, kind:kind, mode:label, total:total, correct:correct});
    if(meta.history.length>300) meta.history = meta.history.slice(0,300);

    if(meta.streak.lastDate !== today){
      const yd = new Date(); yd.setDate(yd.getDate()-1);
      if(meta.streak.lastDate === todayStr(yd)){
        meta.streak.current = (meta.streak.current||0)+1;
      } else {
        meta.streak.current = 1;
      }
      meta.streak.lastDate = today;
    }
    meta.streak.longest = Math.max(meta.streak.longest||0, meta.streak.current);
    saveMeta();
  }

  function statusOf(id){ const p = progress[id]; return p ? p.status : 'new'; }

  function computeStats(list){
    let good=0, warn=0, neu=0;
    list.forEach(w=>{
      const s = statusOf(w.id);
      if(s==='mastered') good++; else if(s==='learning') warn++; else neu++;
    });
    return {good, warn, neu, total:list.length};
  }

  function wordPercent(id){
    const p = progress[id];
    if(!p || !p.seen) return null; // never attempted -- distinct from a low score
    return Math.round((p.correct / p.seen) * 100);
  }

  // Lower score = more urgent to study next. Sessions sort ascending and take
  // the front of the list, so: never-seen words sort first (always worth
  // introducing), then whatever has the lowest accuracy so far -- your
  // weakest words lead, gradually scaling up toward the words you already
  // know well. A word answered in the last few minutes is pushed to the
  // very back regardless, so it cannot immediately repeat within the same
  // short study burst. This governs which words get pulled into a session
  // and in what order; SRS_STEP_MINUTES/p.due still separately govern when
  // a word counts as genuinely mastered (see recordResult).
  function priorityScore(w){
    // Speech Coach tracks a different skill (pronunciation of the example
    // sentence), so its "weakest first" uses its own scores: never-spoken
    // words lead, then lowest best-score.
    if(interactionMode==='coach'){
      const s = speechScores[w.id];
      return s===undefined ? -Infinity : s;
    }
    const p = progress[w.id];
    if(!p || !p.seen) return -Infinity;
    if(p.lastSeen){
      const minsAgo = (Date.now() - new Date(p.lastSeen).getTime()) / 60000;
      if(minsAgo >= 0 && minsAgo < 8) return Infinity;
    }
    return p.correct / p.seen;
  }

  function sortByPriority(list){
    return list.slice().sort((a,b)=> priorityScore(a)-priorityScore(b) || (Math.random()-0.5));
  }

  // Interleaves already priority-sorted per-category lists round-robin, so a
  // mixed session still front-loads new/weak words overall (each category
  // contributes its weakest first) without clumping into category-sized
  // blocks -- cards from different topics keep mixing together.
  function interleaveByCategory(words){
    const byCat = {};
    const order = [];
    words.forEach(w=>{
      if(!byCat[w.cat]){ byCat[w.cat] = []; order.push(w.cat); }
      byCat[w.cat].push(w);
    });
    const result = [];
    let remaining = true;
    while(remaining){
      remaining = false;
      order.forEach(c=>{
        if(byCat[c].length){ result.push(byCat[c].shift()); remaining = true; }
      });
    }
    return result;
  }

  function speak(text){
    if(!canSpeak) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function escapeRegExp(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Finds a meaning whose stored example sentence literally contains the
  // headword (case-insensitive), and returns that sentence with the word
  // blanked out. Many examples use an inflected form instead ("wrote" for
  // "Write down"), which will not match here -- that is intentional: rather
  // than guess at word forms, those words simply are not offered as a
  // sentence-completion card, and the session falls back to Type it for them.
  function findClozeExample(w){
    for(let i=0;i<w.me.length;i++){
      const m = w.me[i];
      if(!m.e) continue;
      const re = new RegExp('\\b'+escapeRegExp(w.w)+'\\b', 'i');
      if(re.test(m.e)){
        return { meaning: m, blanked: m.e.replace(re, '_____') };
      }
    }
    return null;
  }

  function speechErrorMessage(code){
    if(code==='not-allowed' || code==='service-not-allowed') return 'Microphone access is blocked. Allow it in your browser settings, or switch to Type it.';
    if(code==='no-speech') return 'Did not catch that -- tap the mic and try again.';
    if(code==='audio-capture') return 'No microphone found on this device.';
    return 'Could not use the microphone right now. Try again, or switch to Type it.';
  }

  // --- Speech Coach: full-phrase speaking practice ---

  function scNormalizeWord(w){
    // Strips apostrophes too, not just punctuation -- speech recognition is
    // inconsistent about contractions (it may transcribe "I'm" as "im"),
    // and the phrase bank is full of them ("I'm", "I'd", "doesn't"...), so
    // keeping the apostrophe would unfairly mark correctly spoken words as missed.
    return w.toLowerCase().replace(/[^a-z0-9]/g, '');
  }
  function scTokenize(text){
    return text.split(/\s+/).filter(Boolean);
  }

  // Longest-common-subsequence alignment between the target phrase and what
  // was actually heard, so a skipped or reordered word costs only that word
  // instead of failing the whole phrase -- partial credit, not exact match.
  function scAlignPhrase(targetWords, spokenWords){
    const t = targetWords.map(scNormalizeWord);
    const s = spokenWords.map(scNormalizeWord);
    const n = t.length, m = s.length;
    const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
    for(let i=1;i<=n;i++){
      for(let j=1;j<=m;j++){
        if(t[i-1] && t[i-1]===s[j-1]) dp[i][j] = dp[i-1][j-1]+1;
        else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
    const matched = new Array(n).fill(false);
    let i=n, j=m;
    while(i>0 && j>0){
      if(t[i-1] && t[i-1]===s[j-1]){ matched[i-1]=true; i--; j--; }
      else if(dp[i-1][j] >= dp[i][j-1]) i--;
      else j--;
    }
    return { matched, matchCount: dp[n][m] };
  }

  // Speech Coach phrases come from your own vocabulary's example sentences
  // instead of a fixed script, grouped by the app's existing categories --
  // every word already has a stored example (confirmed clean in an earlier
  // data check), so no filtering-out is needed beyond "does it have one".
  function getSpeechPhraseForWord(w){
    for(let i=0;i<w.me.length;i++){
      if(w.me[i].e) return w.me[i].e;
    }
    return null;
  }

  // A word with no stored example still gets a card: you just say the word.
  function coachPhraseFor(w){
    return getSpeechPhraseForWord(w) || w.w;
  }

  function scScorePhrase(phrase, transcript){
    const targetWords = scTokenize(phrase);
    const spokenWords = scTokenize(transcript);
    const { matched, matchCount } = scAlignPhrase(targetWords, spokenWords);
    const score = targetWords.length ? Math.round((matchCount/targetWords.length)*100) : 0;
    const diffHtml = targetWords.map((word,idx)=>
      '<span class="'+(matched[idx]?'ok':'miss')+'">'+esc(word)+'</span>'
    ).join(' ');
    return { score, diffHtml, transcript };
  }

  function scResetCard(){
    scStopListening();
    scStatus = null;
    scResult = null;
  }

  function scStopListening(){
    if(scActiveRecognition){
      try{ scActiveRecognition.abort(); }catch(e){}
      scActiveRecognition = null;
    }
    scRecognizing = false;
  }

  // Runs inside a normal practice session: scores the current card's
  // sentence and records it both as the word's best speech score and in
  // this session's coachResults for the end-of-session summary.
  function scStartListening(){
    if(!canListen) return;
    const w = session[sIndex];
    const phrase = coachPhraseFor(w);
    scStopListening();
    scStatus = null;
    scResult = null;
    scRecognizing = true;
    renderSession();

    const recognition = new SpeechRecognitionCtor();
    scActiveRecognition = recognition;
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    // Same guard as the earlier single-word mode needed: a late callback
    // from a previous card's recognition must not clobber this one.
    recognition.onresult = (e)=>{
      if(scActiveRecognition !== recognition) return;
      const transcript = e.results[0][0].transcript;
      scActiveRecognition = null;
      scRecognizing = false;
      scResult = scScorePhrase(phrase, transcript);
      saveSpeechScore(w.id, scResult.score);
      coachResults = coachResults.filter(r=>r.id!==w.id);
      coachResults.push({ id:w.id, w:w.w, phrase, score:scResult.score });
      renderSession();
    };
    recognition.onerror = (e)=>{
      if(scActiveRecognition !== recognition) return;
      scActiveRecognition = null;
      scRecognizing = false;
      scStatus = speechErrorMessage(e.error || 'error');
      renderSession();
    };
    recognition.onend = ()=>{
      if(scActiveRecognition !== recognition) return;
      if(scRecognizing){
        scActiveRecognition = null;
        scRecognizing = false;
        scStatus = speechErrorMessage('no-speech');
        renderSession();
      }
    };
    // Give the mic a moment to release from the previous card (see the
    // Android note in the earlier fix); the Listening state already shows.
    setTimeout(()=>{
      if(scActiveRecognition !== recognition) return;
      try{ recognition.start(); }catch(e){
        scActiveRecognition = null;
        scRecognizing = false;
        scStatus = speechErrorMessage('error');
        renderSession();
      }
    }, 300);
  }

  function buildMixedSession(size){
    if(size === 'all'){
      return interleaveByCategory(sortByPriority(WORDS));
    }
    const byCat = {};
    CATEGORIES.forEach(c=>byCat[c]=sortByPriority(WORDS.filter(w=>w.cat===c)));
    const perCat = Math.max(1, Math.floor(size/CATEGORIES.length));
    let picks = [];
    CATEGORIES.forEach(c=>{
      picks = picks.concat(byCat[c].slice(0, perCat));
    });
    if(picks.length < size){
      const rest = sortByPriority(WORDS.filter(w=>!picks.includes(w)));
      picks = picks.concat(rest.slice(0, size-picks.length));
    }
    return interleaveByCategory(picks.slice(0,size));
  }

  function buildCategorySession(cat, size){
    const catWords = WORDS.filter(w=>w.cat===cat);
    if(size === 'all'){
      return sortByPriority(catWords);
    }
    return sortByPriority(catWords).slice(0, Math.min(size, catWords.length));
  }

  // Tracks progress through a Complete-length session that may span multiple
  // sittings (exit, come back hours later). Kept separate per scope ('Mixed'
  // or a category name) in meta.passes, independent of word-mastery progress.
  function buildCompletePass(scope, allWords){
    if(!meta.passes) meta.passes = {};
    const info = meta.passes[scope];
    const hasIncomplete = info && info.covered && info.covered.length > 0 && info.covered.length < allWords.length;
    if(hasIncomplete){
      const coveredSet = {};
      info.covered.forEach(id => coveredSet[id] = true);
      const remaining = allWords.filter(w => !coveredSet[w.id]);
      return { words: interleaveByCategory(sortByPriority(remaining)), continuing: true };
    }
    meta.passes[scope] = {covered: []};
    saveMeta();
    return { words: interleaveByCategory(sortByPriority(allWords)), continuing: false };
  }

  function markPassCovered(scope, wordId){
    if(!scope) return;
    if(!meta.passes) meta.passes = {};
    if(!meta.passes[scope]) meta.passes[scope] = {covered: []};
    if(meta.passes[scope].covered.indexOf(wordId) === -1){
      meta.passes[scope].covered.push(wordId);
      saveMeta();
    }
  }

  function buildTestSession(size){
    const arr = WORDS.slice();
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr.slice(0, Math.min(size, arr.length));
  }

  function startSession(list, label, learn){
    session = list; sIndex = 0; revealed = false; typedChecked = false; results = [];
    sessionRetryCounts = {};
    coachResults = []; scResetCard();
    learnMode = !!learn;
    sessionKind = 'practice';
    sessionLabel = label;
    activeMode = learnMode ? learnStageFor(list[0]) : interactionMode;
    fastPhase = 'front'; fastPaused = false; clearFastTimer();
    returnTo = null;
    activePassScope = null;
    renderSession();
  }

  function startTest(){
    session = buildTestSession(20); sIndex = 0; revealed = false; typedChecked = false; results = [];
    sessionRetryCounts = {};
    learnMode = false;
    sessionKind = 'test';
    sessionLabel = 'Test';
    activeMode = 'typed';
    fastPhase = 'front'; fastPaused = false; clearFastTimer();
    returnTo = null;
    activePassScope = null;
    renderSession();
  }

  function normalizeAnswer(s){
    return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
  }

  function checkTyped(){
    const input = el('#type-input');
    if(!input) return;
    const w = session[sIndex];
    const correct = normalizeAnswer(input.value) === normalizeAnswer(w.w);
    lastCheckCorrect = correct;
    typedChecked = true;
    recordResult(correct);
    renderSession();
  }

  function recordResult(correct){
    const w = session[sIndex];
    const p = progress[w.id] || {status:'new', seen:0, correct:0, step:0, typedOnce:false};
    p.seen = (p.seen||0)+1;
    // Recognize mode is self-rated -- "Got it" is honest but not proof you
    // could actually produce the word. Typing it or completing it in a
    // sentence demands real recall (and Test shares the typed UI), so a
    // word can only reach the top, fully-mastered step once one of those
    // has happened at least once; until then, correct Recognize answers
    // can carry it right up to one step below mastered, but no further.
    // Math.max keeps this from ever demoting a step reached before this
    // rule existed.
    if((activeMode==='typed' || activeMode==='sentence') && correct) p.typedOnce = true;
    if(correct){
      p.correct = (p.correct||0)+1;
      const ceiling = p.typedOnce ? SRS_MASTER_STEP : SRS_MASTER_STEP - 1;
      p.step = Math.max(p.step||0, Math.min((p.step||0)+1, ceiling));
    } else {
      p.step = 0;
    }
    p.status = (p.step>=SRS_MASTER_STEP) ? 'mastered' : 'learning';
    p.due = new Date(Date.now() + SRS_STEP_MINUTES[p.step]*60000).toISOString();
    p.lastSeen = new Date().toISOString();
    progress[w.id]=p;
    results.push({id:w.id, w:w.w, correct});
    saveProgress();

    if(!correct && sessionKind!=='test'){
      const n = sessionRetryCounts[w.id] || 0;
      if(n < MAX_RETRY_REINSERTS){
        sessionRetryCounts[w.id] = n+1;
        const gap = 3 + n; // space it a little further out each repeat miss
        session.splice(Math.min(sIndex+gap, session.length), 0, w);
      }
    }
  }

  // Summary stats use each word's LATEST result this session, not every
  // attempt -- a word missed once but nailed on a same-session retry should
  // read as learned, not linger in the follow-up list from its first slip.
  function latestResults(){
    const byId = new Map();
    results.forEach(r=> byId.set(r.id, r));
    return Array.from(byId.values());
  }

  function advance(){
    if(activePassScope){ markPassCovered(activePassScope, session[sIndex].id); }
    scResetCard();
    sIndex++; revealed=false; typedChecked=false; fastPhase='front';
    if(sIndex>=session.length){
      clearFastTimer();
      let correctCount;
      if(activeMode==='fast') correctCount = null;
      else if(activeMode==='coach') correctCount = coachResults.filter(r=>r.score>=60).length;
      else correctCount = latestResults().filter(r=>r.correct).length;
      recordSession(sessionKind, sessionLabel, session.length, correctCount);
      renderSummary();
    } else {
      renderSession();
    }
  }

  function clearFastTimer(){
    if(fastTimerHandle){ clearTimeout(fastTimerHandle); fastTimerHandle = null; }
  }

  function scheduleFastStep(){
    clearFastTimer();
    if(fastPaused) return;
    const dur = FAST_TIMINGS[fastSpeed][fastPhase];
    fastTimerHandle = setTimeout(()=>{
      fastTimerHandle = null;
      if(fastPaused) return;
      if(fastPhase==='front'){
        fastPhase = 'back';
        renderSession();
      } else {
        advance();
      }
    }, dur);
  }

  function toggleFastPause(){
    fastPaused = !fastPaused;
    if(fastPaused){ clearFastTimer(); } else { scheduleFastStep(); }
    renderSession();
  }

  function exitSession(){
    clearFastTimer();
    scResetCard();
    renderHome();
  }

  function skipFastCard(){
    clearFastTimer();
    advance();
  }

  function animateFastBar(){
    const bar = el('#fast-bar-fill');
    if(!bar || fastPaused) return;
    const dur = FAST_TIMINGS[fastSpeed][fastPhase];
    requestAnimationFrame(()=>{
      bar.style.transition = 'width '+dur+'ms linear';
      bar.style.width = '100%';
    });
  }

  function askAboutWord(w){
    const meaningsText = w.me.map(m=>m.m).join(' / ');
    const msg = 'Can we go over "'+w.w+'" together? I keep struggling with it ('+meaningsText+'). Can you give me a couple more example sentences and quiz me on it?';
    if(window.sendPrompt) window.sendPrompt(msg);
  }

  function reviewMissedInChat(){
    const missed = latestResults().filter(r=>!r.correct);
    if(missed.length===0){
      const msg = 'I just finished a vocabulary session and got everything right! Can you give me a few harder practice sentences mixing these words: '+session.map(w=>w.w).join(', ')+'?';
      if(window.sendPrompt) window.sendPrompt(msg);
      return;
    }
    const list = missed.map(r=>r.w).join(', ');
    const msg = 'Review these with me in chat, I marked them needs practice in my session: '+list+'. Can you quiz me on them one at a time?';
    if(window.sendPrompt) window.sendPrompt(msg);
  }

  function renderHome(){
    const stats = computeStats(WORDS);
    const catRows = CATEGORIES.map(c=>{
      const list = WORDS.filter(w=>w.cat===c);
      const s = computeStats(list);
      const pct = Math.round((s.good/list.length)*100);
      return '<button class="cat-row" data-cat="'+esc(c)+'">'
        + '<div class="cat-row-top"><span class="cat-name">'+esc(c)+'</span><span class="cat-arrow">&rarr;</span></div>'
        + '<div class="cat-row-meta">'+list.length+' words &middot; '+s.good+' operational</div>'
        + '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '</button>';
    }).join('');

    const lens = [[15,'Quick'],[25,'Standard'],[40,'Deep'],['all','Complete']];
    const lenHtml = lens.map(([val,label])=>
      '<button class="len-btn '+(sessionLength===val?'active':'')+'" data-len="'+val+'">'+label+'<small>'+(val==='all'?'no cap':val+' cards')+'</small></button>'
    ).join('');

    const modes = [['recognize','Recognize'],['typed','Type it'],['sentence','Sentence']];
    if(canListen) modes.push(['coach','Speech Coach']);
    modes.push(['fast','Fast']);
    const modeHtml = modes.map(([val,label])=>
      '<button class="len-btn '+(interactionMode===val?'active':'')+'" data-mode="'+val+'">'+label+'</button>'
    ).join('');

    const speeds = [['relaxed','Relaxed'],['normal','Normal'],['rapid','Rapid']];
    const speedHtml = interactionMode==='fast' ? (
      '<div class="length-toggle">' + speeds.map(([val,label])=>
        '<button class="len-btn '+(fastSpeed===val?'active':'')+'" data-speed="'+val+'">'+label+'</button>'
      ).join('') + '</div>'
    ) : '';

    const streakHtml = meta.streak.current > 0
      ? '<div class="streak-row">'+ICON_FLAME+' '+meta.streak.current+'-day streak <span class="streak-best">&middot; best '+meta.streak.longest+'</span></div>'
      : '<div class="streak-row" style="color:var(--text-soft);">'+ICON_FLAME+' Start a streak today</div>';

    const mixedHint = sessionLength==='all'
      ? 'No cap: every word across all 5 lists, in whichever mode is selected above.'
      : 'Pulled evenly across all 5 lists, new and in-progress words come first.';

    // Headline action. If a set is already underway it doubles as "carry on
    // where you left off", jumping straight back into that topic's set --
    // most recently started first when several topics have one going.
    let heroHtml, heroTarget = null;
    const openSets = CATEGORIES.map(c=>{
      const set = getLearnSet(c);
      if(!set) return null;
      const done = set.filter(w=>statusOf(w.id)==='mastered').length;
      return done < set.length
        ? { cat:c, done:done, total:set.length, startedAt:(learnSets[c]||{}).startedAt || '' }
        : null;
    }).filter(Boolean).sort((a,b)=> (b.startedAt||'').localeCompare(a.startedAt||''));

    if(openSets.length){
      const s = openSets[0];
      heroTarget = s.cat;
      const pct = Math.round((s.done/s.total)*100);
      heroHtml = '<button class="btn-hero" id="learn-set">Keep learning &middot; '+esc(s.cat)
        + '<small>'+s.done+' of '+s.total+' mastered &middot; recognize, then type it, then use it in a sentence</small>'
        + '<div class="hero-bar"><span style="width:'+pct+'%"></span></div>'
        + '</button>';
    } else {
      heroHtml = '<button class="btn-hero" id="learn-set">Learn a set of '+LEARNSET_SIZE
        + '<small>Pick a topic and the app takes '+LEARNSET_SIZE+' words all the way to mastered, choosing the method for you.</small>'
        + '</button>';
    }

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Vocabulary &middot; '+WORDS.length+' words</div>'
      + '<h1 class="title">Word Log</h1>'
      + '<p class="subtitle">Every word from your spreadsheet, tracked as you go.</p>'
      + '<input type="text" class="field-input" id="home-search" placeholder="Search a word or meaning..." autocomplete="off" style="margin-bottom:18px;">'
      + streakHtml
      + heroHtml
      + '<div class="stat-row">'
        + '<div class="stat"><span class="dot dot-good"></span>'+stats.good+'<small>operational</small></div>'
        + '<div class="stat"><span class="dot dot-warn"></span>'+stats.warn+'<small>in progress</small></div>'
        + '<div class="stat"><span class="dot dot-new"></span>'+stats.neu+'<small>not started</small></div>'
      + '</div>'
      + '<div class="length-toggle">'+lenHtml+'</div>'
      + '<div class="length-toggle">'+modeHtml+'</div>'
      + speedHtml
      + '<button class="btn-primary" id="start-mixed">Start mixed session</button>'
      + '<p class="hint">'+mixedHint+'</p>'
      + '<button class="btn-secondary" id="start-test">Take a test &middot; 20 words, scored</button>'
      + '<div class="divider"><span>or work one list</span></div>'
      + '<p class="hint" style="margin:0 0 10px;">Tip: pick Complete above, then tap a list below, to run every word in just that topic.</p>'
      + '<div class="cat-list">'+catRows+'</div>'
      + '<button class="reset-link" id="view-history">View session history &rarr;</button>'
      + '<button class="reset-link" id="browse-topics">Browse words by topic &rarr;</button>'
      + '<button class="reset-link" id="my-list">Study my list &middot; '+myList.length+'/'+MYLIST_MAX+' &rarr;</button>'
      + '<button class="reset-link" id="add-word">+ Add a new word &rarr;</button>'
      + '<button class="reset-link" id="reset-progress">Reset progress</button>'
      + '</div>';

    const homeSearch = el('#home-search');
    homeSearch.addEventListener('input', ()=> renderSearch(homeSearch.value) );
    homeSearch.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); renderSearch(homeSearch.value); } });
    el('#my-list').addEventListener('click', ()=>renderMyList(''));
    el('#add-word').addEventListener('click', renderAddWord);
    el('#start-mixed').addEventListener('click', ()=>{
      if(sessionLength==='all'){
        const result = buildCompletePass('Mixed', WORDS);
        startSession(result.words, result.continuing ? 'Mixed (remaining)' : 'Mixed');
        activePassScope = 'Mixed';
      } else {
        startSession(buildMixedSession(sessionLength), 'Mixed');
      }
    });
    el('#start-test').addEventListener('click', startTest);
    el('#learn-set').addEventListener('click', ()=> heroTarget ? renderLearnSet(heroTarget) : renderLearnPicker() );
    el('#view-history').addEventListener('click', renderHistory);
    el('#browse-topics').addEventListener('click', renderTopicPicker);
    root.querySelectorAll('.len-btn[data-len]').forEach(b=>{
      b.addEventListener('click', ()=>{ sessionLength = (b.dataset.len==='all') ? 'all' : parseInt(b.dataset.len,10); renderHome(); });
    });
    root.querySelectorAll('.len-btn[data-mode]').forEach(b=>{
      b.addEventListener('click', ()=>{ interactionMode = b.dataset.mode; renderHome(); });
    });
    root.querySelectorAll('.len-btn[data-speed]').forEach(b=>{
      b.addEventListener('click', ()=>{ fastSpeed = b.dataset.speed; renderHome(); });
    });
    root.querySelectorAll('.cat-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const cat = b.dataset.cat;
        if(sessionLength==='all'){
          const catWords = WORDS.filter(w=>w.cat===cat);
          const result = buildCompletePass(cat, catWords);
          startSession(result.words, result.continuing ? (cat+' (remaining)') : cat);
          activePassScope = cat;
        } else {
          startSession(buildCategorySession(cat, sessionLength), cat);
        }
      });
    });
    el('#reset-progress').addEventListener('click', ()=>{
      if(confirm('Clear all saved progress? This cannot be undone.')){
        progress = {}; saveProgress(); renderHome();
      }
    });
  }

  function renderMeanings(w){
    const rows = w.me.map((m,i)=>{
      const exampleHtml = m.e ? (
        '<div class="meaning-example">"'+esc(m.e)+'"'
        + (canSpeak ? '<button class="mini-speak example-speak" data-text="'+esc(m.e)+'" aria-label="Listen to example">'+ICON_SPEAKER+'</button>' : '')
        + '</div>'
      ) : '';
      return '<div class="meaning-row"><span class="meaning-num">'+(i+1)+'</span>'
        + '<div class="meaning-body"><div class="meaning-text">'+esc(m.m)+'</div>'+exampleHtml+'</div></div>';
    }).join('');
    const notes = w.n ? '<div class="note-box"><span class="note-label">Note</span>'+esc(w.n)+'</div>' : '';
    return '<div class="meanings">'+rows+'</div>'+notes;
  }

  function renderTypedPrompt(w){
    const rows = w.me.map((m,i)=>
      '<div class="meaning-row"><span class="meaning-num">'+(i+1)+'</span>'
      + '<div class="meaning-body"><div class="meaning-text">'+esc(m.m)+'</div></div></div>'
    ).join('');
    return '<div class="prompt-label">Type the English word</div>'
      + '<div class="meanings">'+rows+'</div>'
      + '<input type="text" class="type-input" id="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here, then Enter">';
  }

  function renderTypedResult(w){
    const badge = lastCheckCorrect
      ? '<div class="result-badge result-good">'+ICON_CHECK+'Correct</div>'
      : '<div class="result-badge result-bad">'+ICON_X+'Not quite</div>';
    return badge
      + '<div class="card-word">'+esc(w.w)+'</div>'
      + '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'
      + (canSpeak ? '<button class="speak-btn" id="speak-word" aria-label="Listen to pronunciation">'+ICON_SPEAKER+'</button>' : '')
      + '</div>'
      + renderMeanings(w);
  }

  function renderSentencePrompt(w, cloze){
    return '<div class="prompt-label">Complete the sentence</div>'
      + '<div class="meaning-text" style="margin-bottom:14px;">'+esc(cloze.meaning.m)+'</div>'
      + '<div class="cloze-sentence">&ldquo;'+esc(cloze.blanked)+'&rdquo;</div>'
      + '<input type="text" class="type-input" id="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the missing word, then Enter">';
  }

  function renderSentenceResult(w, cloze){
    const badge = lastCheckCorrect
      ? '<div class="result-badge result-good">'+ICON_CHECK+'Correct</div>'
      : '<div class="result-badge result-bad">'+ICON_X+'Not quite</div>';
    const filled = esc(cloze.blanked).replace('_____', '<strong>'+esc(w.w)+'</strong>');
    return badge
      + '<div class="card-word">'+esc(w.w)+'</div>'
      + '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'

      + '</div>'
      + '<div class="cloze-sentence" style="margin-top:14px;">&ldquo;'+filled+'&rdquo;</div>'
      + renderMeanings(w);

  function renderSession(){
    const w = session[sIndex];
    // In a Learn-a-set session the mode is per card, not per session, so it
    // is recomputed here each time a card comes up (including when a card
    // is re-shown after a miss, which may have dropped it back a stage).
    if(learnMode) activeMode = learnStageFor(w);
    const pct = Math.round((sIndex/session.length)*100);
    const isLast = (sIndex+1 >= session.length);
    let cardBody, belowCard;

    if(activeMode==='typed' || activeMode==='sentence'){
      const cloze = activeMode==='sentence' ? findClozeExample(w) : null;
      if(!typedChecked){
        cardBody = cloze ? renderSentencePrompt(w, cloze) : renderTypedPrompt(w);
        belowCard = '<button class="btn-oncard" id="check-btn">Check</button>';
      } else {
        cardBody = cloze ? renderSentenceResult(w, cloze) : renderTypedResult(w);
        belowCard = '<button class="btn-primary" id="next-btn" style="margin-top:16px;">'+(isLast?'See results':'Next card')+' &rarr;</button>'
          + '<p class="hint" style="text-align:center;">Press Enter</p>'
          + (sessionKind!=='test' ? '<button class="ask-link" id="ask-claude">Stuck on this word? Ask Claude &rarr;</button>' : '');
      }
    } else if(activeMode==='coach'){
      const phrase = coachPhraseFor(w);
      const micLabel = scRecognizing ? 'Listening&hellip;' : (scResult ? 'Try again' : 'Tap to speak');
      let resultHtml = '';
      if(scResult){
        const color = scResult.score>=85 ? 'var(--good)' : (scResult.score>=60 ? 'var(--amber-deep)' : 'var(--warn)');
        const label = scResult.score>=85 ? 'Excellent pronunciation!' : (scResult.score>=60 ? 'Good, keep practicing' : 'Try again, a bit slower');
        resultHtml = '<div class="sc-score-row"><span class="sc-score-value" style="color:'+color+';">'+scResult.score+'%</span><span class="sc-score-label">'+label+'</span></div>'
          + '<div class="sc-diff">'+scResult.diffHtml+'</div>'
          + '<p class="sc-transcript">Heard: &ldquo;'+esc(scResult.transcript)+'&rdquo;</p>';
      }
      cardBody = '<div class="prompt-label">'+esc(w.w)+'</div>'
        + '<div class="sc-phrase">'+esc(phrase)+'</div>'
        + (canSpeak ? '<button class="speak-btn" id="sc-listen-word" aria-label="Listen to phrase" style="margin-top:12px;">'+ICON_SPEAKER+'</button>' : '')
        + '<button class="listen-btn'+(scRecognizing?' is-listening':'')+'" id="sc-mic-btn" style="margin-top:18px;">'+ICON_MIC+micLabel+'</button>'
        + (scStatus ? '<p class="listen-error">'+esc(scStatus)+'</p>' : '')
        + resultHtml;
      belowCard = '<button class="'+(scResult?'btn-primary':'btn-secondary')+'" id="next-btn" style="margin-top:16px;">'+(isLast?'See results':'Next card')+' &rarr;</button>'
        + '<p class="hint" style="text-align:center;">'+(scResult ? 'Press Enter for the next card' : 'Space to speak &middot; Enter to skip')+'</p>';
    } else if(activeMode==='fast'){
      const pronRow = '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'
        + (canSpeak ? '<button class="speak-btn" id="speak-word" aria-label="Listen to pronunciation">'+ICON_SPEAKER+'</button>' : '')
        + '</div>';
      const timingBar = '<div class="fast-bar-track"><div class="fast-bar-fill" id="fast-bar-fill"></div></div>';
      cardBody = '<div class="card-word">'+esc(w.w)+'</div>'+pronRow+timingBar
        + (fastPhase==='back' ? renderMeanings(w) : '');
      belowCard = '<div class="fast-controls">'
          + '<button class="fast-pause-btn" id="fast-pause" aria-label="'+(fastPaused?'Resume':'Pause')+'">'+(fastPaused?ICON_PLAY:ICON_PAUSE)+'</button>'
          + '<button class="fast-pause-btn" id="fast-skip" aria-label="Next word">'+ICON_SKIP+'</button>'
        + '</div>'
        + '<p class="hint" style="text-align:center;">Space to pause &middot; Enter to skip</p>';
    } else {
      const pronRow = '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'
        + (canSpeak ? '<button class="speak-btn" id="speak-word" aria-label="Listen to pronunciation">'+ICON_SPEAKER+'</button>' : '')
        + '</div>';
      if(!revealed){
        cardBody = '<div class="card-word">'+esc(w.w)+'</div>'+pronRow+'<button class="btn-oncard" id="reveal-btn">Reveal meaning</button>';
        belowCard = '<p class="hint" style="text-align:center;">Press Enter</p>';
      } else {
        cardBody = '<div class="card-word">'+esc(w.w)+'</div>'+pronRow+renderMeanings(w);
        belowCard = '<div class="rate-row">'
            + '<button class="tag-btn tag-warn" id="rate-warn">'+ICON_WRENCH+'Needs practice</button>'
            + '<button class="tag-btn tag-good" id="rate-good">'+ICON_CHECK+'Got it</button>'
          + '</div>'
          + '<p class="hint" style="text-align:center;">&larr; Needs practice &middot; Got it &rarr;</p>'
          + '<button class="ask-link" id="ask-claude">Stuck on this word? Ask Claude &rarr;</button>';
      }
    }

    const retryTag = (sessionRetryCounts[w.id]||0) > 0
      ? '<div class="hint" style="text-align:center; color:var(--warn);">Missed earlier &middot; one more time</div>' : '';

    root.innerHTML = '<div class="view">'
      + '<div class="sess-top">'
        + '<button class="sess-back" id="session-back">'+ICON_BACK+'Menu</button>'
        + '<span>'+(sessionKind==='test'?'Test ':'Card ')+String(sIndex+1).padStart(2,'0')+' / '+session.length+'</span>'
        + '<span class="cat-tag">'+(sessionKind==='test' ? 'Test' : esc(CAT_ABBR[w.cat]||w.cat))+'</span></div>'
      + '<div class="bar bar-session"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
      + retryTag
      + '<div class="card"><div class="hole"></div>'+cardBody+'</div>'
      + belowCard
      + '</div>';

    el('#session-back').addEventListener('click', exitSession);

    if(activeMode==='typed' || activeMode==='sentence'){
      if(!typedChecked){
        const inp = el('#type-input');
        inp.focus();
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.stopPropagation(); checkTyped(); } });
        el('#check-btn').addEventListener('click', checkTyped);
      } else {
        if(canSpeak){
          el('#speak-word').addEventListener('click', ()=>speak(w.w));
          if(lastAutoSpokenId !== w.id){ speak(w.w); lastAutoSpokenId = w.id; }
        }
        el('#next-btn').addEventListener('click', advance);
        const ac = el('#ask-claude'); if(ac) ac.addEventListener('click', ()=>askAboutWord(w));
        root.querySelectorAll('.example-speak').forEach(btn=>{
          btn.addEventListener('click', ()=> speak(btn.dataset.text) );
        });
      }
    } else if(activeMode==='coach'){
      if(canSpeak){
        const lw = el('#sc-listen-word'); if(lw) lw.addEventListener('click', ()=>speak(coachPhraseFor(w)));
      }
      el('#sc-mic-btn').addEventListener('click', scStartListening);
      el('#next-btn').addEventListener('click', advance);
    } else if(activeMode==='fast'){
      if(canSpeak){
        const sb = el('#speak-word'); if(sb) sb.addEventListener('click', (e)=>{ e.stopPropagation(); speak(w.w); });
        if(lastAutoSpokenId !== w.id){ speak(w.w); lastAutoSpokenId = w.id; }
      }
      el('#fast-pause').addEventListener('click', (e)=>{ e.stopPropagation(); toggleFastPause(); });
      el('#fast-skip').addEventListener('click', (e)=>{ e.stopPropagation(); skipFastCard(); });
      const cardEl = root.querySelector('.card');
      if(cardEl){
        cardEl.classList.add('fast-tap');
        cardEl.addEventListener('click', toggleFastPause);
      }
      animateFastBar();
      scheduleFastStep();
    } else {
      if(canSpeak){ el('#speak-word').addEventListener('click', ()=>speak(w.w)); }
      if(!revealed){
        if(canSpeak && lastAutoSpokenId !== w.id){ speak(w.w); lastAutoSpokenId = w.id; }
        el('#reveal-btn').addEventListener('click', ()=>{ revealed = true; renderSession(); });
      } else {
        el('#rate-warn').addEventListener('click', ()=>{ recordResult(false); advance(); });
        el('#rate-good').addEventListener('click', ()=>{ recordResult(true); advance(); });
        el('#ask-claude').addEventListener('click', ()=>askAboutWord(w));
        root.querySelectorAll('.example-speak').forEach(btn=>{
          btn.addEventListener('click', ()=> speak(btn.dataset.text) );
        });
      }
    }
  }

  function renderSummary(){

    const backLabel = returnTo ? returnTo.label : 'Back to home';

    if(activeMode==='coach'){
      const spoken = coachResults.length;
      const avg = spoken ? Math.round(coachResults.reduce((a,r)=>a+r.score,0)/spoken) : 0;
      const weak = coachResults.filter(r=>r.score<60);
      const weakHtml = weak.length ? weak.map(r=>
        '<div class="follow-row"><span class="follow-word">'+esc(r.w)+'</span><span class="follow-gloss">'+r.score+'% &middot; '+esc(r.phrase)+'</span></div>'
      ).join('') : '<p class="hint">'+(spoken ? 'Every phrase landed at 60% or better. Nice work.' : 'No phrases were scored this session.')+'</p>';
      root.innerHTML = '<div class="view">'
        + '<div class="eyebrow">Speech Coach &middot; '+session.length+' cards</div>'
        + '<h1 class="title">'+(spoken ? avg+'%' : 'Session closed')+'</h1>'
        + (spoken ? '<p class="subtitle">Average pronunciation across '+spoken+' phrase'+(spoken===1?'':'s')+' in '+esc(sessionLabel)+'.</p>' : '')
        + '<div class="divider"><span>keep working on</span></div>'
        + '<div class="follow-list">'+weakHtml+'</div>'

        + '</div>';
      el('#new-session').addEventListener('click', backAction);

    }

    if(activeMode==='fast'){
      root.innerHTML = '<div class="view">'
        + '<div class="eyebrow">Fast review complete &middot; '+session.length+' words</div>'
        + '<h1 class="title">Nice pace.</h1>'
        + '<p class="subtitle">You cruised through '+session.length+' words in '+esc(sessionLabel)+'. Switch to Recognize or Type it when you want to test yourself on these.</p>'
        + '<button class="btn-primary" id="new-session" style="margin-top:8px;">'+backLabel+'</button>'
        + '</div>';
      el('#new-session').addEventListener('click', backAction);
      return;
    }

    const finalResults = latestResults();
    const good = finalResults.filter(r=>r.correct).length;
    const warn = finalResults.filter(r=>!r.correct).length;
    const missed = finalResults.filter(r=>!r.correct);
    const pct = Math.round((good/finalResults.length)*100);

    const missedHtml = missed.length ? missed.map(r=>{
      const w = WORDS.find(x=>x.id===r.id);
      const gloss = (w && w.me[0]) ? w.me[0].m : '';
      return '<div class="follow-row"><span class="follow-word">'+esc(r.w)+'</span><span class="follow-gloss">'+esc(gloss)+'</span></div>';
    }).join('') : '<p class="hint">Everything landed. Nice work.</p>';

    let eyebrowText = 'Session closed &middot; '+session.length+' cards';
    let titleText = 'Nice work.';
    let scoreHtml = '';

    if(sessionKind==='test'){
      eyebrowText = 'Test complete &middot; '+session.length+' words';
      titleText = pct+'%';
      let label = 'Good baseline, these need more reps.';
      if(pct>=90) label = 'Excellent, this set is locked in.';
      else if(pct>=70) label = 'Solid. A few more rounds and these are locked in.';
      else if(pct>=50) label = 'Good start. Keep at these ones.';
      scoreHtml = '<p class="subtitle">'+good+' of '+session.length+' correct. '+label+'</p>';
    }

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+eyebrowText+'</div>'
      + '<h1 class="title">'+titleText+'</h1>'
      + scoreHtml
      + '<div class="stat-row">'
        + '<div class="stat"><span class="dot dot-good"></span>'+good+'<small>got it</small></div>'
        + '<div class="stat"><span class="dot dot-warn"></span>'+warn+'<small>need practice</small></div>'
      + '</div>'
      + '<div class="divider"><span>follow-up list</span></div>'
      + '<div class="follow-list">'+missedHtml+'</div>'
      + '<button class="btn-primary" id="review-chat" style="margin-top:18px;">Review in chat &rarr;</button>'
      + '<button class="btn-secondary" id="new-session">'+backLabel+'</button>'
      + '</div>';

    el('#review-chat').addEventListener('click', reviewMissedInChat);
    el('#new-session').addEventListener('click', backAction);
  }

  function searchWords(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const starts = [], contains = [];
    WORDS.forEach(w=>{
      const wl = w.w.toLowerCase();
      const inMeaning = w.me.some(m=> m.m.toLowerCase().indexOf(q) !== -1);
      if(wl.indexOf(q)===0) starts.push(w);
      else if(wl.indexOf(q)!==-1 || inMeaning) contains.push(w);
    });
    return starts.concat(contains).slice(0,60);
  }

  function renderSearch(query){
    query = query || '';
    const matches = searchWords(query);
    const rows = matches.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');
    const body = query.trim()
      ? (matches.length ? '<div class="word-list">'+rows+'</div>' : '<p class="hint">Nothing matches yet. Try a shorter word or part of a meaning.</p>')
      : '<p class="hint">Type a word or part of a meaning to find it.</p>';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Search</div>'
      + '<h1 class="title">Find a word</h1>'
      + '<input type="text" class="field-input" id="search-input" placeholder="Search word or meaning..." autocomplete="off">'
      + '<div style="margin-top:14px;">'+body+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    const inp = el('#search-input');
    inp.value = query;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', ()=> renderSearch(inp.value) );
    root.querySelectorAll('.word-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const word = matches.find(w=>String(w.id)===b.dataset.id);
        if(!word) return;
        const currentQuery = inp.value;
        startSession([word], word.cat);
        returnTo = { run: ()=>renderSearch(currentQuery), label:'Back to search' };
      });
    });
    el('#back-home').addEventListener('click', renderHome);
  }

      + '<input type="text" class="field-input" id="new-e'+i+'" placeholder="Example sentence (optional)" style="margin-top:6px;">'

      + '<h1 class="title">Add a word</h1>'

  function saveNewWord(){
    const wordVal = el('#new-word').value.trim();
    const pronVal = el('#new-pron').value.trim();
    const catVal = el('#new-cat').value;
    const meanings = [1,2,3].map(i=>({
      m: el('#new-m'+i).value.trim(),
      e: el('#new-e'+i).value.trim()
    })).filter(m=>m.m);
    const noteVal = el('#new-note').value.trim();
    const errEl = el('#add-word-error');

    if(!wordVal){ errEl.textContent = 'Enter the word itself first.'; return; }
    if(meanings.length===0){ errEl.textContent = 'Add at least one meaning.'; return; }

    const id = makeWordId(catVal, wordVal);
    const entry = { id:id, cat:catVal, w:wordVal, p:pronVal, me:meanings, n:noteVal };
    WORDS.push(entry);
    customWords.push(entry);
    saveCustomWords();
    renderHome();
  }

  function renderLearnPicker(){
    const rows = CATEGORIES.map(c=>{
      const set = getLearnSet(c);
      let meta;
      if(set){
        const done = set.filter(w=>statusOf(w.id)==='mastered').length;
        meta = 'Set in progress &middot; '+done+' of '+set.length+' mastered';
      } else {
        const left = WORDS.filter(w=>w.cat===c && statusOf(w.id)!=='mastered').length;
        meta = left ? left+' words still to learn' : 'Every word here is mastered';
      }
      const list = WORDS.filter(w=>w.cat===c);
      const s = computeStats(list);
      const pct = Math.round((s.good/list.length)*100);
      return '<button class="cat-row" data-cat="'+esc(c)+'">'
        + '<div class="cat-row-top"><span class="cat-name">'+esc(c)+'</span><span class="cat-arrow">&rarr;</span></div>'
        + '<div class="cat-row-meta">'+meta+'</div>'
        + '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Learn a set</div>'
      + '<h1 class="title">Which topic?</h1>'
      + '<p class="subtitle">Pick a topic and the app locks in '+LEARNSET_SIZE+' words from it, then keeps working that same set until you have mastered every one.</p>'
      + '<div class="cat-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    root.querySelectorAll('.cat-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const cat = b.dataset.cat;
        if(!getLearnSet(cat)) buildLearnSet(cat);
        renderLearnSet(cat);
      });
    });
    el('#back-home').addEventListener('click', renderHome);
  }

  function renderLearnSet(cat){
    const set = getLearnSet(cat) || buildLearnSet(cat);
    const mastered = set.filter(w=>statusOf(w.id)==='mastered');
    // Stage order first, so a round meets the new words before drilling the
    // ones already in progress; weakest-first within each stage.
    const remaining = sortByPriority(set.filter(w=>statusOf(w.id)!=='mastered'))
      .sort((a,b)=> learnStageRank(a)-learnStageRank(b));
    const pct = set.length ? Math.round((mastered.length/set.length)*100) : 0;
    const complete = remaining.length===0;

    const rows = set.map(w=>{
      const isMastered = statusOf(w.id)==='mastered';
      const label = isMastered ? 'Mastered' : LEARN_STAGES[learnStageFor(w)];
      const color = isMastered ? 'var(--good)'
        : (learnStageFor(w)==='recognize' ? 'var(--new)' : 'var(--amber)');
      return '<div class="follow-row"><span class="follow-word">'+esc(w.w)+'</span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span></div>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+esc(cat)+'</div>'
      + '<h1 class="title">'+mastered.length+' of '+set.length+' mastered</h1>'
      + '<p class="subtitle">'+(complete
          ? 'This set is done. Start a fresh '+LEARNSET_SIZE+' from this topic whenever you are ready.'
          : 'The app picks the method for you: recognize each word first, then type it from memory, then use it in a sentence. Only what you have not finished comes up next.')+'</p>'
      + '<div class="bar bar-session"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
      + (complete
          ? '<button class="btn-primary" id="new-set">Start a new set of '+LEARNSET_SIZE+'</button>'
          : '<button class="btn-primary" id="start-set">Practice '+remaining.length+' left &rarr;</button>')
      + '<div class="divider"><span>this set</span></div>'
      + '<div class="follow-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="change-topic" style="margin-top:16px;">&larr; Pick another topic</button>'
      + '</div>';

    const startBtn = el('#start-set');
    if(startBtn){
      startBtn.addEventListener('click', ()=>{
        startSession(remaining, cat+' set', true);
        returnTo = { run: ()=>renderLearnSet(cat), label:'Back to the set' };
      });
    }
    const newBtn = el('#new-set');
    if(newBtn){
      newBtn.addEventListener('click', ()=>{ buildLearnSet(cat); renderLearnSet(cat); });
    }
    el('#change-topic').addEventListener('click', renderLearnPicker);
  }

  function renderMyList(query){
    query = query || '';
    const listWords = myList.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);

    const listRows = listWords.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<div class="follow-row"><span class="follow-word">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span style="display:flex; align-items:center; gap:12px;">'
        + '<span style="font-family:var(--mono); font-weight:600; font-size:.85rem; color:'+color+';">'+label+'</span>'
        + '<button class="mini-speak" data-remove="'+esc(String(w.id))+'" aria-label="Remove from list" style="color:var(--warn);">'+ICON_X+'</button>'
        + '</span></div>';
    }).join('');

    const listSection = listWords.length
      ? '<div class="follow-list">'+listRows+'</div>'
      : '<p class="hint">No words yet. Search below and tap one to add it, up to '+MYLIST_MAX+'.</p>';

    const matches = query.trim() ? searchWords(query) : [];
    const searchRows = matches.map(w=>{
      const already = myList.indexOf(w.id) !== -1;
      const full = !already && myList.length >= MYLIST_MAX;
      const label = already ? 'Added' : (full ? 'List full' : '+ Add');
      const color = already ? 'var(--good)' : (full ? 'var(--text-soft)' : 'var(--amber)');
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');
    const searchBody = query.trim()
      ? (matches.length ? '<div class="word-list">'+searchRows+'</div>' : '<p class="hint">No words match.</p>')
      : '';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">My list &middot; '+listWords.length+'/'+MYLIST_MAX+'</div>'
      + '<h1 class="title">Study my list</h1>'
      + '<p class="subtitle">Pick your own words below, then study just this set in whichever mode is selected at home, until every one is mastered.</p>'
      + listSection
      + (listWords.length ? '<button class="btn-primary" id="start-mylist" style="margin-top:14px;">Start studying</button>' : '')
      + '<div class="divider"><span>add words</span></div>'
      + '<input type="text" class="field-input" id="mylist-search" placeholder="Search a word or meaning..." autocomplete="off">'
      + '<div style="margin-top:14px;">'+searchBody+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    const inp = el('#mylist-search');
    inp.value = query;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', ()=> renderMyList(inp.value) );

    root.querySelectorAll('[data-remove]').forEach(b=>{
      b.addEventListener('click', ()=>{
        toggleMyListWord(b.dataset.remove);
        renderMyList(inp.value);
      });
    });
    root.querySelectorAll('.word-row[data-id]').forEach(b=>{
      b.addEventListener('click', ()=>{
        toggleMyListWord(b.dataset.id);
        renderMyList(inp.value);
      });
    });
    const startBtn = el('#start-mylist');
    if(startBtn){
      startBtn.addEventListener('click', ()=>{
        const words = sortByPriority(myList.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean));
        if(!words.length) return;
        startSession(words, 'My list');
        returnTo = { run: ()=>renderMyList(''), label:'Back to my list' };
      });
    }
    el('#back-home').addEventListener('click', renderHome);
  }

  function renderTopicPicker(){
    const rows = CATEGORIES.map(c=>{
      const list = WORDS.filter(w=>w.cat===c);
      const s = computeStats(list);
      const pct = Math.round((s.good/list.length)*100);
      return '<button class="cat-row" data-cat="'+esc(c)+'">'
        + '<div class="cat-row-top"><span class="cat-name">'+esc(c)+'</span><span class="cat-arrow">&rarr;</span></div>'
        + '<div class="cat-row-meta">'+list.length+' words &middot; '+s.good+' operational</div>'
        + '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Browse by topic</div>'
      + '<h1 class="title">Pick a topic</h1>'
      + '<p class="subtitle">See every word with its real accuracy, then tap any single one to practice just that word.</p>'
      + '<div class="cat-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back</button>'
      + '</div>';

    root.querySelectorAll('.cat-row').forEach(b=>{
      b.addEventListener('click', ()=> renderWordList(b.dataset.cat) );
    });
    el('#back-home').addEventListener('click', renderHome);
  }

  function renderWordList(cat){
    const words = WORDS.filter(w=>w.cat===cat).slice();
    words.sort((a,b)=>{
      const pa = wordPercent(a.id), pb = wordPercent(b.id);
      if(pa===null && pb===null) return 0;
      if(pa===null) return -1; // never-attempted words need attention first
      if(pb===null) return 1;
      return pa - pb; // weakest first
    });

    const rows = words.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+'</span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+esc(cat)+'</div>'
      + '<h1 class="title">Word list</h1>'
      + '<p class="subtitle">Weakest first. Tap any word to practice just that one, in whichever mode is selected at home.</p>'
      + '<div class="word-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-topics" style="margin-top:16px;">&larr; Back to topics</button>'
      + '</div>';

    root.querySelectorAll('.word-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const word = words.find(w=>String(w.id)===b.dataset.id);
        if(!word) return;
        startSession([word], cat);
        returnTo = { run: ()=>renderWordList(cat), label:'Back to word list' };
      });
    });
    el('#back-topics').addEventListener('click', renderTopicPicker);
  }

  function handleGlobalKeydown(e){
    const inSession = root.querySelector('.sess-top');
    if(!inSession) return; // shortcuts only apply during an active card session

    if(activeMode==='fast'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        toggleFastPause();
      } else if(e.key==='Enter'){
        e.preventDefault();
        skipFastCard();
      }
      return;
    }

    if(activeMode==='typed' || activeMode==='sentence'){
      // pre-check Enter is handled by the input's own listener (which stops
      // propagation); this only covers "Enter again to move on" after checking
      if(e.key==='Enter' && typedChecked){
        e.preventDefault();
        advance();
      }
      return;
    }

    if(activeMode==='coach'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        if(!scRecognizing) scStartListening();
      } else if(e.key==='Enter'){
        e.preventDefault();
        advance();
      }
      return;
    }


    // recognize mode: Enter reveals the meaning; once revealed, arrow keys rate
    if(e.key==='Enter' && !revealed){
      e.preventDefault();
      revealed = true;
      renderSession();
    } else if(revealed && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
      e.preventDefault();
      recordResult(e.key==='ArrowRight');
      advance();
    }
  }
  document.addEventListener('keydown', handleGlobalKeydown);

  async function init(){
    loadProgress();
    loadMeta();
    loadCustomWords();
    loadMyList();
    loadSpeechScores();
    loadLearnSets();
    renderHome();
  }
  init().catch(()=>{ root.innerHTML = '<p class="loading">Something went wrong loading the app. Refreshing might help.</p>'; });
})();
</script>
</body>
