 is a family heirloom."}, {"m": "Traditional plant variety passed down over time \u2014 Variedad tradicional.", "e": "They grow heirloom tomatoes in the garden."}], "n": "Usually refers to something kept for generations."}, {"id": "School vocabulary::Toast", "cat": "School vocabulary", "w": "Toast", "p": "t\u00f3ust", "me": [{"m": "Bread browned by heat \u2014 Pan tostado / tostada.", "e": "I had toast for breakfast."}, {"m": "Drink honoring someone \u2014 Brindis.", "e": "We raised a toast to the couple."}, {"m": "Brown bread or honor with a drink \u2014 Tostar / brindar.", "e": "Let's toast their success."}], "n": "Can be a noun or verb; be toast means be in serious trouble, informally."}, {"id": "School vocabulary::Weeds", "cat": "School vocabulary", "w": "Weeds", "p": "u\u00edidz", "me": [{"m": "Unwanted wild plants \u2014 Maleza / malas hierbas.", "e": "Weeds grew around the flowers."}, {"m": "Removes unwanted plants \u2014 Deshierba / quita la maleza.", "e": "She weeds the garden every Saturday."}], "n": "Plural noun or third-person form of weed."}, {"id": "School vocabulary::Wrongdoing", "cat": "School vocabulary", "w": "Wrongdoing", "p": "r\u00f3ng-d\u00faing", "me": [{"m": "Illegal or immoral behavior \u2014 Mala conducta / acto indebido.", "e": "The investigation found evidence of wrongdoing."}], "n": "Usually uncountable; a specific act can be called a wrong."}, {"id": "School vocabulary::Harness", "cat": "School vocabulary", "w": "Harness", "p": "j\u00e1rnes", "me": [{"m": "Straps used to control or secure an animal \u2014 Arneses / arn\u00e9s.", "e": "The horse wore a leather harness."}, {"m": "Control and use energy or power \u2014 Aprovechar.", "e": "Solar panels harness energy from the sun."}, {"m": "Safety equipment that holds a person \u2014 Arn\u00e9s de seguridad.", "e": "The climber checked her safety harness."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Barn", "cat": "School vocabulary", "w": "Barn", "p": "barn", "me": [{"m": "Farm building for animals or crops \u2014 Granero / establo.", "e": "The cows sleep in the barn."}, {"m": "Large simple building \u2014 Edificio grande y sencillo.", "e": "The old barn was used for community events."}], "n": "A barn stores crops or shelters farm animals; usually countable."}, {"id": "School vocabulary::Knitted", "cat": "School vocabulary", "w": "Knitted", "p": "n\u00edtid", "me": [{"m": "Made by joining loops of yarn \u2014 Tejido/a.", "e": "She wore a knitted sweater."}, {"m": "Made something by knitting \u2014 Teji\u00f3.", "e": "My grandmother knitted this scarf."}, {"m": "Joined closely together \u2014 Unido/a estrechamente.", "e": "The community was closely knitted together."}], "n": "Past tense and past participle of knit; knit is also common as the past form."}, {"id": "School vocabulary::Scarf", "cat": "School vocabulary", "w": "Scarf", "p": "skarf", "me": [{"m": "Long cloth worn around the neck \u2014 Bufanda.", "e": "She wrapped a scarf around her neck."}, {"m": "Eat quickly, informal \u2014 Engullir / devorar.", "e": "He scarfed down his lunch."}], "n": "Plural: scarves or scarfs; the verb meaning is informal."}, {"id": "School vocabulary::Amusing", "cat": "School vocabulary", "w": "Amusing", "p": "ami\u00fazing", "me": [{"m": "Funny or entertaining \u2014 Divertido/a.", "e": "The movie was amusing."}, {"m": "Causing mild interest or pleasure \u2014 Entretenido/a.", "e": "We heard an amusing story."}], "n": "Usually describes something that makes people smile or laugh."}, {"id": "School vocabulary::Coaled", "cat": "School vocabulary", "w": "Coaled", "p": "k\u00f3uld", "me": [{"m": "Loaded or supplied with coal \u2014 Abasteci\u00f3 de carb\u00f3n / cargado con carb\u00f3n.", "e": "The steamship coaled at the harbor."}, {"m": "Burned coal as fuel \u2014 Us\u00f3 carb\u00f3n como combustible.", "e": "The old ship coaled throughout the voyage."}], "n": "Past tense and past participle of coal; uncommon in modern everyday English."}, {"id": "School vocabulary::Steamship", "cat": "School vocabulary", "w": "Steamship", "p": "st\u00edim-ship", "me": [{"m": "Large ship powered by steam \u2014 Buque de vapor.", "e": "The steamship crossed the Atlantic."}, {"m": "Passenger or cargo ship using a steam engine \u2014 Barco de vapor.", "e": "The old steamship carried mail and passengers."}], "n": "Historical term; steamship is usually written as one word."}, {"id": "School vocabulary::Goods", "cat": "School vocabulary", "w": "Goods", "p": "gudz", "me": [{"m": "Products for sale \u2014 Bienes / mercanc\u00edas.", "e": "The store sells imported goods."}, {"m": "Possessions or items being transported \u2014 Pertenencias / carga.", "e": "The train carried goods across the country."}, {"m": "Things that are useful or valuable \u2014 Bienes.", "e": "Education is considered a public good."}], "n": "Goods is plural; the singular good has different uses."}, {"id": "School vocabulary::Good", "cat": "School vocabulary", "w": "Good", "p": "gud", "me": [{"m": "Of high quality or pleasant \u2014 Bueno/a.", "e": "This is a good book."}, {"m": "Kind or morally right \u2014 Bondadoso/a / correcto/a.", "e": "She is a good person."}, {"m": "Benefit or useful purpose, noun \u2014 Bien / beneficio.", "e": "Exercise does you good."}], "n": "Irregular comparison: good, better, best. Usually an adjective; well is commonly the adverb."}, {"id": "School vocabulary::Damp", "cat": "School vocabulary", "w": "Damp", "p": "damp", "me": [{"m": "Slightly wet \u2014 H\u00famedo/a.", "e": "The towel is still damp."}, {"m": "Moisture in a building \u2014 Humedad.", "e": "Damp appeared on the basement wall."}, {"m": "Make something less strong \u2014 Apagar / disminuir.", "e": "The rain damped the fire."}], "n": "Can be an adjective, noun, or verb; damp means slightly wet, not completely soaked."}, {"id": "School vocabulary::Bale of hay", "cat": "School vocabulary", "w": "Bale of hay", "p": "b\u00e9il ov j\u00e9i", "me": [{"m": "Large bundle of dried grass \u2014 Fardo / paca de heno.", "e": "The farmer stacked a bale of hay in the barn."}], "n": "Hay is uncountable; use a bale of hay to count one compressed bundle."}, {"id": "School vocabulary::Gambling", "cat": "School vocabulary", "w": "Gambling", "p": "g\u00e1mbling", "me": [{"m": "Risking money on games or uncertain results \u2014 Apuestas / juego de azar.", "e": "Gambling can lead to serious debt."}, {"m": "Taking a risky action \u2014 Arriesgarse.", "e": "Investing without research is like gambling."}], "n": "Usually uncountable; it is the gerund of gamble."}, {"id": "School vocabulary::Vise", "cat": "School vocabulary", "w": "Vise", "p": "v\u00e1is", "me": [{"m": "Tool that holds an object firmly \u2014 Tornillo de banco.", "e": "The mechanic secured the pipe in a vise."}, {"m": "Strong grip or pressure \u2014 Agarre / presi\u00f3n fuerte.", "e": "Fear held him in a vise."}], "n": "American spelling: vise. British spelling: vice for the tool."}, {"id": "School vocabulary::Sorrow", "cat": "School vocabulary", "w": "Sorrow", "p": "s\u00e1rou", "me": [{"m": "Deep sadness \u2014 Tristeza / pena.", "e": "She felt great sorrow after the loss."}, {"m": "Cause of sadness \u2014 Motivo de pena.", "e": "His departure was a sorrow to the family."}, {"m": "Feel or express sadness, literary \u2014 Lamentarse.", "e": "They sorrowed over the bad news."}], "n": "Usually a noun; the verb use is literary or formal."}, {"id": "School vocabulary::Archaic", "cat": "School vocabulary", "w": "Archaic", "p": "ark\u00e9ik", "me": [{"m": "Very old and no longer commonly used \u2014 Arcaico/a.", "e": "Thou is an archaic English word."}, {"m": "Old-fashioned and outdated \u2014 Anticuado/a.", "e": "The company replaced its archaic system."}, {"m": "Related to an early historical period \u2014 De una \u00e9poca antigua.", "e": "They studied archaic Greek art."}], "n": "Often used for old words, customs, systems, or historical periods."}, {"id": "School vocabulary::Stamps", "cat": "School vocabulary", "w": "Stamps", "p": "stamps", "me": [{"m": "Postage labels \u2014 Sellos postales.", "e": "I put two stamps on the envelope."}, {"m": "Marks made by pressing \u2014 Marcas / estampados.", "e": "The passport has several stamps."}, {"m": "Steps heavily \u2014 Pisa fuerte.", "e": "He stamps his feet when angry."}], "n": "Plural of stamp or third-person verb."}, {"id": "School vocabulary::Crowd", "cat": "School vocabulary", "w": "Crowd", "p": "kr\u00e1ud", "me": [{"m": "Large group of people \u2014 Multitud.", "e": "A crowd gathered outside."}, {"m": "Fill a place closely \u2014 Abarrotar.", "e": "Fans crowded the stadium."}, {"m": "Pressure someone \u2014 Presionar.", "e": "Do not crowd me while I decide."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Crack", "cat": "School vocabulary", "w": "Crack", "p": "krak", "me": [{"m": "Narrow break \u2014 Grieta.", "e": "There is a crack in the wall."}, {"m": "Break slightly \u2014 Agrietar / quebrar.", "e": "Do not crack the screen."}, {"m": "Solve something difficult \u2014 Resolver.", "e": "They cracked the code."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Tamer", "cat": "School vocabulary", "w": "Tamer", "p": "t\u00e9imer", "me": [{"m": "Person who trains wild animals \u2014 Domador/a.", "e": "The lion tamer entered the cage."}, {"m": "More controlled or less wild \u2014 M\u00e1s manso/a.", "e": "This horse is tamer than the other one."}], "n": "Can be a noun or the comparative form of tame."}, {"id": "School vocabulary::Breaking/cracking", "cat": "School vocabulary", "w": "Breaking/cracking", "p": "br\u00e9iking / kr\u00e1king", "me": [{"m": "Damaging by separating into pieces \u2014 Rompiendo.", "e": "The child is breaking the toy."}, {"m": "Forming or causing a narrow split \u2014 Agrietando.", "e": "The dry ground is cracking."}, {"m": "Making a sharp sound \u2014 Crujiendo / chasqueando.", "e": "The ice was cracking under our feet."}], "n": "Breaking is general; cracking often means forming a narrow break or sharp sound."}, {"id": "School vocabulary::Whip", "cat": "School vocabulary", "w": "Whip", "p": "uip", "me": [{"m": "Long flexible tool used to strike or guide \u2014 L\u00e1tigo.", "e": "The rider carried a whip."}, {"m": "Beat or mix quickly \u2014 Batir.", "e": "Whip the cream until thick."}, {"m": "Move or pull suddenly \u2014 Mover / sacar r\u00e1pidamente.", "e": "She whipped out her phone."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Cross", "cat": "School vocabulary", "w": "Cross", "p": "kros", "me": [{"m": "Go from one side to another \u2014 Cruzar.", "e": "We crossed the street carefully."}, {"m": "Angry or annoyed \u2014 Enojado/a.", "e": "She was cross with me."}, {"m": "Symbol of two intersecting lines \u2014 Cruz.", "e": "Mark the answer with a cross."}], "n": "Can be a verb, adjective, or noun."}, {"id": "School vocabulary::Cross your fingers", "cat": "School vocabulary", "w": "Cross your fingers", "p": "kros yor f\u00edngers", "me": [{"m": "Hope for good luck \u2014 Cruzar los dedos.", "e": "Cross your fingers that we pass."}, {"m": "Make a crossed-finger gesture \u2014 Cruzar los dedos.", "e": "She crossed her fingers before the result."}], "n": "Corrected from Cross fingers; often used as an expression of hope."}, {"id": "School vocabulary::Balloon", "cat": "School vocabulary", "w": "Balloon", "p": "bal\u00faun", "me": [{"m": "Inflatable rubber bag \u2014 Globo.", "e": "The child held a red balloon."}, {"m": "Increase rapidly \u2014 Dispararse / aumentar.", "e": "The project costs ballooned."}, {"m": "Travel in a balloon \u2014 Viajar en globo.", "e": "They ballooned over the valley."}], "n": "Corrected from Ballon."}, {"id": "School vocabulary::Hot-air balloon", "cat": "School vocabulary", "w": "Hot-air balloon", "p": "jat-\u00e9r bal\u00faun", "me": [{"m": "Aircraft lifted by heated air \u2014 Globo aerost\u00e1tico.", "e": "The hot-air balloon floated above the fields."}], "n": "Corrected from Hot air ballon; hot-air is hyphenated before balloon."}, {"id": "School vocabulary::Tame", "cat": "School vocabulary", "w": "Tame", "p": "t\u00e9im", "me": [{"m": "Not wild or dangerous \u2014 Manso/a.", "e": "The fox became tame."}, {"m": "Train or control an animal \u2014 Domesticar / amansar.", "e": "They tamed the young horse."}, {"m": "Control something difficult \u2014 Dominar.", "e": "She learned to tame her fear."}], "n": "Can be an adjective or verb."}, {"id": "School vocabulary::Frontier", "cat": "School vocabulary", "w": "Frontier", "p": "frant\u00edr", "me": [{"m": "Edge of settled or known land \u2014 Frontera.", "e": "Settlers moved toward the frontier."}, {"m": "Limit of a new field of knowledge \u2014 Frontera / l\u00edmite.", "e": "Space research is a scientific frontier."}], "n": "Often used for exploration, settlement, or new knowledge."}, {"id": "School vocabulary::Boarder", "cat": "School vocabulary", "w": "Boarder", "p": "b\u00f3rder", "me": [{"m": "Person who pays to live and eat in a home \u2014 Hu\u00e9sped / pensionista.", "e": "The family rented a room to a boarder."}, {"m": "Student living at school \u2014 Alumno/a interno/a.", "e": "The school has both boarders and day students."}], "n": "Do not confuse boarder with border."}, {"id": "School vocabulary::Roads", "cat": "School vocabulary", "w": "Roads", "p": "r\u00f3udz", "me": [{"m": "Routes for vehicles \u2014 Carreteras / caminos.", "e": "The storm blocked several roads."}, {"m": "Ways of reaching a result \u2014 Caminos / v\u00edas.", "e": "Education opens roads to opportunity."}], "n": "Plural of road."}, {"id": "School vocabulary::Flats", "cat": "School vocabulary", "w": "Flats", "p": "flats", "me": [{"m": "Apartments, British English \u2014 Pisos / apartamentos.", "e": "They rent two flats in London."}, {"m": "Shoes without high heels \u2014 Zapatos planos.", "e": "She wore black flats to work."}, {"m": "Flat areas of land \u2014 Llanuras / zonas planas.", "e": "They crossed the salt flats."}], "n": "Plural of flat; meaning depends on context."}, {"id": "School vocabulary::Draw#2", "cat": "School vocabulary", "w": "Draw", "p": "dr\u00f3", "me": [{"m": "Make a picture \u2014 Dibujar.", "e": "She drew a flower."}, {"m": "Pull something \u2014 Tirar de / correr.", "e": "Draw the curtain closed."}, {"m": "End with equal scores \u2014 Empatar.", "e": "The teams drew 1\u20131."}], "n": "Irregular: draw, drew, drawn."}, {"id": "School vocabulary::Counter", "cat": "School vocabulary", "w": "Counter", "p": "k\u00e1unter", "me": [{"m": "Long surface in a shop or kitchen \u2014 Mostrador / encimera.", "e": "Leave the package on the counter."}, {"m": "Oppose with an answer or action \u2014 Contrarrestar / refutar.", "e": "She countered his argument."}, {"m": "Device or person that counts \u2014 Contador/a.", "e": "The counter recorded every visitor."}], "n": "Can be a noun, verb, adjective, or adverb."}, {"id": "School vocabulary::Cabinets", "cat": "School vocabulary", "w": "Cabinets", "p": "k\u00e1binets", "me": [{"m": "Storage cupboards \u2014 Gabinetes / armarios.", "e": "The dishes are in the kitchen cabinets."}, {"m": "Group of senior government advisers \u2014 Gabinete.", "e": "The president met with the cabinet."}], "n": "Plural of cabinet; the government meaning is often singular."}, {"id": "School vocabulary::Countertop", "cat": "School vocabulary", "w": "Countertop", "p": "k\u00e1untertap", "me": [{"m": "Flat work surface in a kitchen \u2014 Encimera.", "e": "She placed the bowl on the countertop."}], "n": "Corrected from Counter top; countertop is normally one word."}, {"id": "School vocabulary::Crave", "cat": "School vocabulary", "w": "Crave", "p": "kr\u00e9iv", "me": [{"m": "Want something very strongly \u2014 Anhelar / desear mucho.", "e": "I crave something sweet after dinner."}, {"m": "Need or strongly seek \u2014 Ans\u00edar.", "e": "Children crave attention."}], "n": "Common pattern: crave something; usually not crave for."}, {"id": "School vocabulary::Craving", "cat": "School vocabulary", "w": "Craving", "p": "kr\u00e9iving", "me": [{"m": "Strong desire \u2014 Antojo / deseo intenso.", "e": "She had a craving for chocolate."}, {"m": "Wanting something strongly \u2014 Deseando intensamente.", "e": "He is craving a quiet weekend."}], "n": "Noun or present participle of crave; often followed by for as a noun."}, {"id": "School vocabulary::Wristband", "cat": "School vocabulary", "w": "Wristband", "p": "r\u00edst-band", "me": [{"m": "Band worn around the wrist \u2014 Pulsera / brazalete.", "e": "The event staff gave me a wristband."}, {"m": "Band used for support or identification \u2014 Mu\u00f1equera / pulsera identificativa.", "e": "The patient wore a hospital wristband."}], "n": "Corrected from Wrist band; wristband is normally one word."}, {"id": "School vocabulary::Leash", "cat": "School vocabulary", "w": "Leash", "p": "l\u00edish", "me": [{"m": "Strap used to control an animal \u2014 Correa.", "e": "Keep the dog on a leash."}, {"m": "Control or restraint \u2014 Control / restricci\u00f3n.", "e": "The rules put a leash on spending."}, {"m": "Attach an animal to a leash \u2014 Poner la correa.", "e": "She leashed the dog before leaving."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::To be on a leash", "cat": "School vocabulary", "w": "To be on a leash", "p": "tu bi on a l\u00edish", "me": [{"m": "Be attached to and controlled by a leash \u2014 Estar con correa.", "e": "Dogs must be on a leash in the park."}, {"m": "Be under strict control \u2014 Estar muy controlado/a.", "e": "The project is on a tight leash."}], "n": "Literal or figurative expression."}, {"id": "School vocabulary::Cop", "cat": "School vocabulary", "w": "Cop", "p": "kap", "me": [{"m": "Police officer, informal \u2014 Polic\u00eda / agente.", "e": "A cop directed traffic."}, {"m": "Get or obtain, slang \u2014 Conseguir.", "e": "He copped a ticket for the concert."}, {"m": "Receive punishment or blame, informal \u2014 Recibir / cargar con.", "e": "She copped the blame."}], "n": "Informal; police officer is more neutral."}, {"id": "School vocabulary::Police dog", "cat": "School vocabulary", "w": "Police dog", "p": "pol\u00eds dog", "me": [{"m": "Dog trained to help police \u2014 Perro polic\u00eda.", "e": "The police dog found the missing bag."}], "n": "Corrected from Cop dog; police dog is the natural term."}, {"id": "School vocabulary::Dog harness", "cat": "School vocabulary", "w": "Dog harness", "p": "dog j\u00e1rnes", "me": [{"m": "Straps fitted around a dog for control or support \u2014 Arn\u00e9s para perro.", "e": "Attach the leash to the dog harness."}], "n": "A harness distributes pressure across the body rather than the neck."}, {"id": "School vocabulary::Feed", "cat": "School vocabulary", "w": "Feed", "p": "f\u00edid", "me": [{"m": "Give food to a person or animal \u2014 Alimentar / dar de comer.", "e": "Please feed the dog."}, {"m": "Food for farm animals \u2014 Alimento / pienso.", "e": "The farmer bought chicken feed."}, {"m": "Supply information or material \u2014 Suministrar / introducir.", "e": "The sensor feeds data into the system."}], "n": "Irregular: feed, fed, fed."}, {"id": "School vocabulary::Food", "cat": "School vocabulary", "w": "Food", "p": "f\u00faud", "me": [{"m": "Something eaten for nourishment \u2014 Comida / alimento.", "e": "We bought food for dinner."}, {"m": "Material that helps something grow or develop \u2014 Alimento.", "e": "Books are food for thought."}], "n": "Usually uncountable; foods refers to different types."}, {"id": "School vocabulary::Bengal", "cat": "School vocabulary", "w": "Bengal", "p": "beng\u00f3l", "me": [{"m": "Region in South Asia \u2014 Bengala.", "e": "Bengal has a rich cultural history."}, {"m": "Breed of spotted domestic cat \u2014 Gato bengal\u00ed.", "e": "They adopted a Bengal cat."}, {"m": "Related to the Bengal tiger \u2014 De Bengala.", "e": "The Bengal tiger has dark stripes."}], "n": "Corrected from Vengal; proper noun, so capitalize it."}, {"id": "School vocabulary::Firecrackers", "cat": "School vocabulary", "w": "Firecrackers", "p": "f\u00e1ier-kr\u00e1kers", "me": [{"m": "Small explosives that make loud bangs \u2014 Petardos.", "e": "Firecrackers exploded in the street."}], "n": "Plural of firecracker; different from larger visual fireworks."}, {"id": "School vocabulary::Fireworks", "cat": "School vocabulary", "w": "Fireworks", "p": "f\u00e1ier-u\u00e9rks", "me": [{"m": "Explosive displays of light and color \u2014 Fuegos artificiales.", "e": "We watched the fireworks after sunset."}, {"m": "Excitement or strong conflict, figurative \u2014 Emoci\u00f3n / conflicto intenso.", "e": "There were fireworks during the debate."}], "n": "Usually plural."}, {"id": "School vocabulary::Poppers", "cat": "School vocabulary", "w": "Poppers", "p": "p\u00e1pers", "me": [{"m": "Small devices that make a popping sound \u2014 Petardos peque\u00f1os / juguetes explosivos.", "e": "The children used party poppers."}, {"m": "Party devices that release paper pieces \u2014 Lanzaconfeti.", "e": "We opened the party poppers at midnight."}, {"m": "Inhalant drugs, slang \u2014 Drogas inhalantes.", "e": "Poppers can be dangerous when misused."}], "n": "Usually plural; meaning depends strongly on context."}, {"id": "School vocabulary::Match", "cat": "School vocabulary", "w": "Match", "p": "mach", "me": [{"m": "Contest between people or teams \u2014 Partido / combate.", "e": "We watched a soccer match."}, {"m": "Small stick used to start a fire \u2014 Cerilla / f\u00f3sforo.", "e": "He lit the candle with a match."}, {"m": "Be equal or suitable together \u2014 Combinar / coincidir.", "e": "Your shoes match your jacket."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Noisy", "cat": "School vocabulary", "w": "Noisy", "p": "n\u00f3izi", "me": [{"m": "Making a lot of sound \u2014 Ruidoso/a.", "e": "The classroom was noisy."}, {"m": "Full of obvious or distracting detail \u2014 Recargado/a.", "e": "The design looks too noisy."}], "n": "Comparative: noisier; superlative: noisiest."}, {"id": "School vocabulary::Pot", "cat": "School vocabulary", "w": "Pot", "p": "pat", "me": [{"m": "Container used for cooking \u2014 Olla / cacerola.", "e": "The soup is cooking in a large pot."}, {"m": "Marijuana, informal \u2014 Marihuana.", "e": "They found a small amount of pot."}, {"m": "Total money bet in a game \u2014 Bote / pozo.", "e": "She won the entire pot."}], "n": "Meaning depends strongly on context."}, {"id": "School vocabulary::THC cookies", "cat": "School vocabulary", "w": "THC cookies", "p": "t\u00ed-eich-s\u00ed k\u00fakis", "me": [{"m": "Cookies containing THC \u2014 Galletas con THC.", "e": "The package contained THC cookies."}], "n": "Edible cannabis products can have delayed and long-lasting effects; keep away from children and pets."}, {"id": "School vocabulary::THC gummies", "cat": "School vocabulary", "w": "THC gummies", "p": "t\u00ed-eich-s\u00ed g\u00e1mis", "me": [{"m": "Gummy candies containing THC \u2014 Gomitas con THC.", "e": "The label clearly identified the THC gummies."}], "n": "Corrected from THC goomys. Effects may be delayed; keep away from children and pets."}, {"id": "School vocabulary::Make the water still", "cat": "School vocabulary", "w": "Make the water still", "p": "m\u00e9ik da u\u00f3ter stil", "me": [{"m": "Cause the water to stop moving \u2014 Hacer que el agua quede quieta.", "e": "Wait for the wind to make the water still."}], "n": "Still means calm and without movement here."}, {"id": "School vocabulary::Throb", "cat": "School vocabulary", "w": "Throb", "p": "thrab", "me": [{"m": "Beat or pulse strongly and regularly \u2014 Latir / palpitar.", "e": "My injured finger began to throb."}, {"m": "Be full of strong activity \u2014 Vibrar / estar lleno de actividad.", "e": "The club throbbed with music."}], "n": "Corrected from Trob; the th is pronounced as in three."}, {"id": "School vocabulary::Throbbing", "cat": "School vocabulary", "w": "Throbbing", "p": "thr\u00e1bing", "me": [{"m": "Beating with strong regular pain \u2014 Palpitante / latiendo.", "e": "I have a throbbing headache."}, {"m": "Pulsing strongly \u2014 Vibrando / palpitando.", "e": "The music was throbbing through the walls."}], "n": "Corrected from Trobing; present participle or adjective from throb."}, {"id": "School vocabulary::Punch", "cat": "School vocabulary", "w": "Punch", "p": "panch", "me": [{"m": "Hit with a closed fist \u2014 Golpear con el pu\u00f1o.", "e": "He punched the bag."}, {"m": "Tool for making holes \u2014 Perforadora / punz\u00f3n.", "e": "Use the punch to make a hole."}, {"m": "Mixed drink, often served at parties \u2014 Ponche.", "e": "They served fruit punch."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Jump someone", "cat": "School vocabulary", "w": "Jump someone", "p": "yamp s\u00e1muan", "me": [{"m": "Attack someone suddenly \u2014 Atacar a alguien por sorpresa.", "e": "Two men jumped him near the station."}, {"m": "Surprise or startle someone \u2014 Sobresaltar a alguien.", "e": "The loud noise jumped me."}], "n": "The attack meaning is informal; startle is more natural for the second meaning."}, {"id": "School vocabulary::Vermin", "cat": "School vocabulary", "w": "Vermin", "p": "v\u00e9rmin", "me": [{"m": "Harmful or unwanted animals \u2014 Alima\u00f1as / plagas.", "e": "The building was infested with vermin."}, {"m": "Despicable people, insulting \u2014 Gentuza.", "e": "He called the criminals vermin."}], "n": "Corrected from Vermim; usually uncountable and insulting when used for people."}, {"id": "School vocabulary::Plague", "cat": "School vocabulary", "w": "Plague", "p": "pl\u00e9ig", "me": [{"m": "Serious infectious disease spreading widely \u2014 Peste / epidemia.", "e": "The plague killed many people."}, {"m": "Cause repeated trouble \u2014 Atormentar / acosar.", "e": "Technical problems plagued the project."}, {"m": "Large harmful infestation \u2014 Plaga.", "e": "A plague of insects damaged the crops."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Carnivorous plants", "cat": "School vocabulary", "w": "Carnivorous plants", "p": "karn\u00edvoras plants", "me": [{"m": "Plants that trap and digest insects or small animals \u2014 Plantas carn\u00edvoras.", "e": "Venus flytraps are carnivorous plants."}], "n": "Corrected from Carnival plants; carnivorous means meat-eating."}, {"id": "School vocabulary::Shape", "cat": "School vocabulary", "w": "Shape", "p": "sh\u00e9ip", "me": [{"m": "Form or outline \u2014 Forma.", "e": "The table has a round shape."}, {"m": "Physical condition \u2014 Condici\u00f3n f\u00edsica.", "e": "She is in excellent shape."}, {"m": "Form or influence something \u2014 Dar forma / moldear.", "e": "Experience shapes our decisions."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Snatch", "cat": "School vocabulary", "w": "Snatch", "p": "snach", "me": [{"m": "Take something quickly or suddenly \u2014 Arrebatar / agarrar.", "e": "Someone snatched her phone."}, {"m": "Brief amount of time or sound \u2014 Momento / fragmento.", "e": "I heard a snatch of conversation."}, {"m": "Kidnap, informal \u2014 Secuestrar.", "e": "The criminals planned to snatch the witness."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Dye", "cat": "School vocabulary", "w": "Dye", "p": "d\u00e1i", "me": [{"m": "Substance used to change color \u2014 Tinte.", "e": "She bought blue fabric dye."}, {"m": "Change color using dye \u2014 Te\u00f1ir.", "e": "He dyed his hair black."}], "n": "Can be a noun or verb; past: dyed. Do not confuse with die."}, {"id": "School vocabulary::Coat", "cat": "School vocabulary", "w": "Coat", "p": "k\u00f3ut", "me": [{"m": "Outer garment \u2014 Abrigo.", "e": "She wore a warm coat."}, {"m": "Thin covering or layer \u2014 Capa.", "e": "The table has a coat of paint."}, {"m": "Cover with a layer \u2014 Cubrir / recubrir.", "e": "Coat the vegetables with oil."}], "n": "Can be a noun or verb."}, {"id": "School vocabulary::Upholstery", "cat": "School vocabulary", "w": "Upholstery", "p": "apj\u00f3lsteri", "me": [{"m": "Fabric and padding covering furniture \u2014 Tapicer\u00eda.", "e": "The sofa has leather upholstery."}, {"m": "Work of covering furniture \u2014 Trabajo de tapicer\u00eda.", "e": "He learned upholstery at a trade school."}], "n": "Usually uncountable; upholster is the verb."}, {"id": "School vocabulary::Take down", "cat": "School vocabulary", "w": "Take down", "p": "t\u00e9ik d\u00e1un", "me": [{"m": "Remove something from a higher place \u2014 Bajar / quitar.", "e": "Please take down the box from the shelf."}, {"m": "Write or record information \u2014 Anotar.", "e": "She took down his phone number."}, {"m": "Defeat or dismantle \u2014 Derribar / desmantelar.", "e": "The police took down the criminal network."}], "n": "Separable: take something down. Irregular forms: take, took, taken."}, {"id": "School vocabulary::Outer space", "cat": "School vocabulary", "w": "Outer space", "p": "\u00e1uter sp\u00e9is", "me": [{"m": "The region beyond Earth\u2019s atmosphere \u2014 Espacio exterior.", "e": "Satellites travel through outer space."}], "n": "Usually uncountable; space can also mean an empty area."}, {"id": "School vocabulary::Elderly", "cat": "School vocabulary", "w": "Elderly", "p": "\u00e9lderli", "me": [{"m": "Old or advanced in age \u2014 Anciano/a / de edad avanzada.", "e": "The program helps elderly residents."}, {"m": "Older people as a group \u2014 Personas mayores.", "e": "The elderly may need extra support."}], "n": "Elderly can sound impersonal; older adult is often more respectful."}, {"id": "School vocabulary::Cul-de-sac", "cat": "School vocabulary", "w": "Cul-de-sac", "p": "kal-de-s\u00e1k", "me": [{"m": "A street closed at one end \u2014 Calle sin salida.", "e": "They live in a quiet cul-de-sac."}, {"m": "A situation with no progress \u2014 Callej\u00f3n sin salida.", "e": "The negotiations reached a cul-de-sac."}], "n": "Plural: cul-de-sacs; dead end is more common figuratively."}, {"id": "School vocabulary::Dead end", "cat": "School vocabulary", "w": "Dead end", "p": "ded end", "me": [{"m": "A road with no exit \u2014 Calle sin salida.", "e": "This street is a dead end."}, {"m": "A situation offering no progress \u2014 Callej\u00f3n sin salida.", "e": "The investigation reached a dead end."}], "n": "Hyphenate before a noun: a dead-end street."}, {"id": "School vocabulary::Sue", "cat": "School vocabulary", "w": "Sue", "p": "s\u00fau", "me": [{"m": "Take legal action against someone \u2014 Demandar.", "e": "She sued the company for damages."}, {"m": "Make a legal claim for something \u2014 Reclamar judicialmente.", "e": "They sued for compensation."}], "n": "Common patterns: sue someone and sue for damages."}, {"id": "School vocabulary::Lawsuit", "cat": "School vocabulary", "w": "Lawsuit", "p": "l\u00f3sut", "me": [{"m": "A case brought before a court \u2014 Demanda judicial.", "e": "The employee filed a lawsuit."}], "n": "Common verbs: file, bring, face, or settle a lawsuit."}, {"id": "School vocabulary::Loud", "cat": "School vocabulary", "w": "Loud", "p": "l\u00e1ud", "me": [{"m": "Making a lot of noise \u2014 Fuerte / ruidoso/a.", "e": "The music is too loud."}, {"m": "Visually bright or attention-getting \u2014 Llamativo/a.", "e": "He wore a loud shirt."}, {"m": "Forceful or emphatic \u2014 En\u00e9rgico/a.", "e": "She was loud in her criticism."}], "n": "Loud is an adjective; loudly is the usual adverb."}, {"id": "School vocabulary::Retarded", "cat": "School vocabulary", "w": "Retarded", "p": "rit\u00e1rdid", "me": [{"m": "Delayed or slowed \u2014 Retrasado/a.", "e": "Cold weather retarded the crop\u2019s growth."}, {"m": "Former term for intellectual disability \u2014 T\u00e9rmino antiguo para discapacidad intelectual.", "e": "The outdated label appeared in the old record."}], "n": "Offensive when used for a person; use person with an intellectual disability."}, {"id": "School vocabulary::Latecomer", "cat": "School vocabulary", "w": "Latecomer", "p": "l\u00e9it-k\u00e1mer", "me": [{"m": "A person who arrives late \u2014 Persona que llega tarde.", "e": "The latecomer entered quietly."}, {"m": "A recent participant or arrival \u2014 Reci\u00e9n llegado/a.", "e": "She was a latecomer to the industry."}], "n": "Countable noun; latecomer to is common."}, {"id": "School vocabulary::Salary", "cat": "School vocabulary", "w": "Salary", "p": "s\u00e1lari", "me": [{"m": "Fixed regular pay for work \u2014 Sueldo / salario.", "e": "Her annual salary increased."}], "n": "Usually paid monthly or yearly; compare wage."}, {"id": "School vocabulary::Wage", "cat": "School vocabulary", "w": "Wage", "p": "u\u00e9iy", "me": [{"m": "Pay based on hours or work completed \u2014 Salario / jornal.", "e": "The job pays a good hourly wage."}, {"m": "Carry on a campaign or conflict \u2014 Librar / emprender.", "e": "They waged a campaign for reform."}], "n": "Plural wages often means earnings; verb forms: wage, waged."}, {"id": "School vocabulary::Rare", "cat": "School vocabulary", "w": "Rare", "p": "rer", "me": [{"m": "Uncommon \u2014 Raro/a / poco com\u00fan.", "e": "Snow is rare in this region."}, {"m": "Cooked only slightly \u2014 Poco hecho/a.", "e": "He ordered the steak rare."}, {"m": "Thin or less dense \u2014 Enrarecido/a.", "e": "The air is rare at high altitude."}], "n": "Comparative: rarer; superlative: rarest."}, {"id": "School vocabulary::Sinking", "cat": "School vocabulary", "w": "Sinking", "p": "s\u00ednking", "me": [{"m": "Going below the surface \u2014 Hundi\u00e9ndose.", "e": "The boat is sinking."}, {"m": "Falling or becoming worse \u2014 Cayendo / deterior\u00e1ndose.", "e": "The company faced sinking sales."}, {"m": "Feeling sudden fear or disappointment \u2014 Sensaci\u00f3n de angustia.", "e": "I had a sinking feeling."}], "n": "Gerund or present participle of sink; past: sank, sunk."}, {"id": "School vocabulary::Figurative", "cat": "School vocabulary", "w": "Figurative", "p": "f\u00edguiurativ", "me": [{"m": "Not literal; using an image or comparison \u2014 Figurado/a.", "e": "The phrase has a figurative meaning."}, {"m": "Representing forms or figures in art \u2014 Figurativo/a.", "e": "The gallery displays figurative paintings."}], "n": "Opposite of literal in language; figuratively is the adverb."}, {"id": "School vocabulary::Flowerpot", "cat": "School vocabulary", "w": "Flowerpot", "p": "fl\u00e1uer-pat", "me": [{"m": "A container in which a plant is grown \u2014 Maceta / tiesto.", "e": "She planted basil in a flowerpot."}], "n": "Also written flower pot; plural: flowerpots."}, {"id": "School vocabulary::Water-based paint", "cat": "School vocabulary", "w": "Water-based paint", "p": "u\u00f3ter-b\u00e9ist p\u00e9int", "me": [{"m": "Paint that uses water as its main liquid \u2014 Pintura a base de agua.", "e": "We used water-based paint on the walls."}], "n": "Hyphenate water-based before a noun."}, {"id": "School vocabulary::Anointing", "cat": "School vocabulary", "w": "Anointing", "p": "an\u00f3inting", "me": [{"m": "Applying oil in a religious ceremony \u2014 Unci\u00f3n.", "e": "The ceremony included the anointing of the king."}, {"m": "Choosing someone for an important role \u2014 Designaci\u00f3n.", "e": "The party\u2019s anointing of its candidate drew criticism."}], "n": "Gerund or noun from anoint."}, {"id": "School vocabulary::Realize", "cat": "School vocabulary", "w": "Realize", "p": "r\u00edalaiz", "me": [{"m": "Become aware of something \u2014 Darse cuenta de.", "e": "I realized that I was late."}, {"m": "Achieve something planned \u2014 Realizar / hacer realidad.", "e": "She realized her dream of becoming a doctor."}, {"m": "Convert an asset into money or profit \u2014 Convertir en efectivo / obtener.", "e": "The sale realized a large profit."}], "n": "In everyday Spanish, realizar often means do, but realize usually means darse cuenta."}, {"id": "School vocabulary::Aware", "cat": "School vocabulary", "w": "Aware", "p": "au\u00e9r", "me": [{"m": "Knowing about something \u2014 Consciente / enterado/a.", "e": "Are you aware of the new rule?"}, {"m": "Noticing or understanding a situation \u2014 Al tanto.", "e": "She became aware that someone was watching."}], "n": "Usually used after be; common patterns: aware of and aware that."}, {"id": "School vocabulary::Know", "cat": "School vocabulary", "w": "Know", "p": "n\u00f3u", "me": [{"m": "Have information or understanding \u2014 Saber.", "e": "I know the answer."}, {"m": "Be familiar with a person or place \u2014 Conocer.", "e": "She knows Madrid well."}, {"m": "Recognize or distinguish \u2014 Reconocer.", "e": "I knew him by his voice."}], "n": "Irregular: know, knew, known."}, {"id": "School vocabulary::Cellar", "cat": "School vocabulary", "w": "Cellar", "p": "s\u00e9ler", "me": [{"m": "A room below ground level, often for storage \u2014 S\u00f3tano / bodega.", "e": "They store potatoes in the cellar."}], "n": "A basement may be used as living space; a cellar is mainly for storage."}, {"id": "School vocabulary::Wine cellar", "cat": "School vocabulary", "w": "Wine cellar", "p": "u\u00e1in s\u00e9ler", "me": [{"m": "A cool room where wine is stored \u2014 Bodega de vinos.", "e": "The restaurant has a large wine cellar."}, {"m": "A collection of stored wines \u2014 Cava / colecci\u00f3n de vinos.", "e": "Their wine cellar contains rare bottles."}], "n": "Write as two words."}, {"id": "School vocabulary::Roamed", "cat": "School vocabulary", "w": "Roamed", "p": "r\u00f3umd", "me": [{"m": "Moved around without a fixed route \u2014 Vag\u00f3 / recorri\u00f3.", "e": "We roamed through the old city."}, {"m": "Wandered freely over an area \u2014 Deambul\u00f3.", "e": "Wild horses roamed the plains."}], "n": "Past tense of roam; often followed by around, through, or across."}, {"id": "School vocabulary::Makeup", "cat": "School vocabulary", "w": "Makeup", "p": "m\u00e9ikap", "me": [{"m": "Cosmetics \u2014 Maquillaje.", "e": "She removed her makeup before bed."}, {"m": "The composition or structure of something \u2014 Composici\u00f3n.", "e": "The committee\u2019s makeup has changed."}, {"m": "An invented story or replacement arrangement \u2014 Invenci\u00f3n / recuperaci\u00f3n.", "e": "Friday is the makeup day for the missed exam."}], "n": "Usually one word as a noun; make up is a verb."}, {"id": "School vocabulary::Aged", "cat": "School vocabulary", "w": "Aged", "p": "\u00e9idyd", "me": [{"m": "Having reached a particular age \u2014 De edad.", "e": "The program is for children aged ten to twelve."}, {"m": "Old \u2014 Envejecido/a / anciano/a.", "e": "He cared for his aged parents."}, {"m": "Matured over time \u2014 A\u00f1ejado/a.", "e": "They served aged cheese."}], "n": "Pronounced \u00e9idyd as an adjective meaning old; often \u00e9iyd in has aged."}, {"id": "School vocabulary::Fell down", "cat": "School vocabulary", "w": "Fell down", "p": "fel d\u00e1un", "me": [{"m": "Dropped to the ground \u2014 Se cay\u00f3.", "e": "He slipped and fell down."}, {"m": "Failed or performed poorly \u2014 Fracas\u00f3.", "e": "The plan fell down because it lacked funding."}], "n": "Past of fall down; fall, fell, fallen."}, {"id": "School vocabulary::Well", "cat": "School vocabulary", "w": "Well", "p": "u\u00e9l", "me": [{"m": "In good health \u2014 Bien / sano/a.", "e": "She is well again."}, {"m": "In a good or satisfactory way \u2014 Bien.", "e": "He speaks English well."}, {"m": "A deep hole that supplies water \u2014 Pozo.", "e": "The farm gets water from a well."}], "n": "Can be an adjective, adverb, noun, or interjection."}, {"id": "School vocabulary::Blueprint", "cat": "School vocabulary", "w": "Blueprint", "p": "bl\u00faprint", "me": [{"m": "A detailed technical plan \u2014 Plano.", "e": "The architect showed us the blueprint."}, {"m": "A detailed plan for achieving something \u2014 Plan / modelo.", "e": "The report provides a blueprint for reform."}], "n": "Can also be a verb meaning design in detail."}, {"id": "School vocabulary::Exploded view", "cat": "School vocabulary", "w": "Exploded view", "p": "ekspl\u00f3udid vi\u00fa", "me": [{"m": "A diagram showing separated parts and how they fit \u2014 Vista explosionada.", "e": "The manual includes an exploded view of the engine."}], "n": "Common in engineering and assembly instructions."}, {"id": "School vocabulary::Back down", "cat": "School vocabulary", "w": "Back down", "p": "bak d\u00e1un", "me": [{"m": "Withdraw a demand or position \u2014 Ceder / retractarse.", "e": "She refused to back down."}, {"m": "Move backward and downward \u2014 Retroceder / bajar.", "e": "He backed down the ladder carefully."}], "n": "Inseparable when it means yield; often followed by from."}, {"id": "School vocabulary::Bundled up", "cat": "School vocabulary", "w": "Bundled up", "p": "b\u00e1ndold \u00e1p", "me": [{"m": "Dressed warmly \u2014 Bien abrigado/a.", "e": "The children bundled up before going outside."}, {"m": "Wrapped or gathered together \u2014 Empaquetado/a / agrupado/a.", "e": "The cables were bundled up neatly."}], "n": "Past of bundle up; separable with an object."}, {"id": "School vocabulary::Row", "cat": "School vocabulary", "w": "Row", "p": "r\u00f3u / r\u00e1u", "me": [{"m": "A line of people or things \u2014 Fila / hilera.", "e": "We sat in the front row."}, {"m": "A noisy argument \u2014 Discusi\u00f3n / pelea.", "e": "They had a row about money."}, {"m": "Move a boat with oars \u2014 Remar.", "e": "She rowed across the lake."}], "n": "Pronounced r\u00f3u for a line or boating; r\u00e1u for an argument."}, {"id": "School vocabulary::Damp#2", "cat": "School vocabulary", "w": "Damp", "p": "damp", "me": [{"m": "Slightly wet \u2014 H\u00famedo/a.", "e": "The towel is still damp."}, {"m": "Moisture in a building \u2014 Humedad.", "e": "Damp damaged the old wall."}, {"m": "Reduce energy or enthusiasm \u2014 Apagar / reducir.", "e": "The delay damped their enthusiasm."}], "n": "Damp usually suggests an unpleasant small amount of moisture."}, {"id": "School vocabulary::Humid#2", "cat": "School vocabulary", "w": "Humid", "p": "hi\u00famid", "me": [{"m": "Containing a lot of moisture in the air \u2014 H\u00famedo/a.", "e": "The weather is hot and humid."}], "n": "Humid describes air or weather; damp usually describes objects or places."}, {"id": "School vocabulary::Beau", "cat": "School vocabulary", "w": "Beau", "p": "b\u00f3u", "me": [{"m": "A boyfriend or male admirer \u2014 Novio / pretendiente.", "e": "She arrived with her new beau."}, {"m": "A fashionable man, old-fashioned \u2014 Gal\u00e1n / dandi.", "e": "The novel describes him as a wealthy beau."}], "n": "Plural: beaus or beaux."}, {"id": "School vocabulary::Queue", "cat": "School vocabulary", "w": "Queue", "p": "ki\u00fa", "me": [{"m": "A line of people or things waiting \u2014 Cola / fila.", "e": "We waited in the ticket queue."}, {"m": "A list of tasks or data awaiting processing \u2014 Cola.", "e": "The document is in the print queue."}, {"m": "Wait in a line \u2014 Hacer cola.", "e": "People queued outside the theater."}], "n": "The letters ueue are silent; pronounced like cue."}, {"id": "School vocabulary::Queue up", "cat": "School vocabulary", "w": "Queue up", "p": "ki\u00fa \u00e1p", "me": [{"m": "Form or join a line \u2014 Hacer fila / ponerse en cola.", "e": "Fans queued up for tickets."}, {"m": "Arrange items to happen next \u2014 Poner en cola.", "e": "She queued up three songs."}], "n": "Separable when arranging items: queue the songs up."}, {"id": "School vocabulary::Tuition", "cat": "School vocabulary", "w": "Tuition", "p": "tu\u00edshon", "me": [{"m": "Money paid for instruction \u2014 Matr\u00edcula / colegiatura.", "e": "College tuition has increased."}, {"m": "Teaching or instruction, formal \u2014 Ense\u00f1anza.", "e": "She received private tuition in music."}], "n": "In American English, tuition usually means the fee, not room or books."}, {"id": "School vocabulary::Private tutoring class", "cat": "School vocabulary", "w": "Private tutoring class", "p": "pr\u00e1ivit t\u00fatering klas", "me": [{"m": "A lesson taught individually or to a small group for payment \u2014 Clase particular.", "e": "He takes a private tutoring class after school."}], "n": "Private lesson or tutoring session is often more natural."}, {"id": "School vocabulary::Escalator", "cat": "School vocabulary", "w": "Escalator", "p": "\u00e9skal\u00e9itor", "me": [{"m": "Moving stairs carrying people between floors \u2014 Escalera mec\u00e1nica.", "e": "Take the escalator to the second floor."}], "n": "Do not confuse escalator with elevator."}, {"id": "School vocabulary::Tangible", "cat": "School vocabulary", "w": "Tangible", "p": "t\u00e1nyabol", "me": [{"m": "Able to be touched \u2014 Tangible / material.", "e": "The museum displays tangible objects."}, {"m": "Clear, real, or measurable \u2014 Concreto/a / palpable.", "e": "The project produced tangible benefits."}], "n": "Opposite: intangible."}, {"id": "School vocabulary::Intangible", "cat": "School vocabulary", "w": "Intangible", "p": "int\u00e1nyabol", "me": [{"m": "Unable to be touched \u2014 Intangible / inmaterial.", "e": "Trust is an intangible asset."}, {"m": "Difficult to define or measure \u2014 Impalpable / dif\u00edcil de medir.", "e": "The team had an intangible advantage."}], "n": "More standard than non-tangible; opposite: tangible."}, {"id": "School vocabulary::Riot", "cat": "School vocabulary", "w": "Riot", "p": "r\u00e1iat", "me": [{"m": "A violent public disturbance \u2014 Disturbio / mot\u00edn.", "e": "Police responded to the riot."}, {"m": "A very funny person or event, informal \u2014 Persona o situaci\u00f3n divertid\u00edsima.", "e": "The comedy show was a riot."}, {"m": "Take part in a violent disturbance \u2014 Amotinarse.", "e": "Crowds rioted after the match."}], "n": "Can be a noun or verb; the informal meaning is positive."}, {"id": "School vocabulary::Limb#2", "cat": "School vocabulary", "w": "Limb", "p": "lim", "me": [{"m": "An arm or leg \u2014 Extremidad.", "e": "The injury affected his lower limb."}, {"m": "A large branch of a tree \u2014 Rama principal.", "e": "The cat climbed onto a tree limb."}, {"m": "A projecting part or section \u2014 Brazo / ramal.", "e": "The spacecraft passed behind the moon\u2019s limb."}], "n": "The b is silent."}, {"id": "School vocabulary::Limp", "cat": "School vocabulary", "w": "Limp", "p": "limp", "me": [{"m": "Walk unevenly because of an injury \u2014 Cojear.", "e": "He limped home after the game."}, {"m": "An uneven walk \u2014 Cojera.", "e": "She walked with a slight limp."}, {"m": "Not firm or stiff \u2014 Fl\u00e1cido/a.", "e": "The leaves became limp without water."}], "n": "Can be a verb, noun, or adjective."}, {"id": "School vocabulary::Bureau", "cat": "School vocabulary", "w": "Bureau", "p": "bi\u00farou", "me": [{"m": "An office or government department \u2014 Oficina / agencia.", "e": "Contact the consumer protection bureau."}, {"m": "A chest of drawers \u2014 C\u00f3moda / cajonera.", "e": "She put the clothes in the bureau."}], "n": "Plural: bureaus or bureaux."}, {"id": "School vocabulary::Nightstand", "cat": "School vocabulary", "w": "Nightstand", "p": "n\u00e1itstand", "me": [{"m": "A small table beside a bed \u2014 Mesa de noche / mesita de noche.", "e": "The lamp is on the nightstand."}], "n": "Usually one word in American English; bedside table is also common."}, {"id": "School vocabulary::Brought out", "cat": "School vocabulary", "w": "Brought out", "p": "br\u00f3t \u00e1ut", "me": [{"m": "Produced or released something \u2014 Sac\u00f3 / lanz\u00f3.", "e": "The company brought out a new model."}, {"m": "Made a quality more noticeable \u2014 Resalt\u00f3.", "e": "The lighting brought out the colors."}, {"m": "Caused a reaction or behavior \u2014 Provoc\u00f3 / hizo surgir.", "e": "The challenge brought out the best in her."}], "n": "Past of bring out; separable: brought the book out."}, {"id": "School vocabulary::Polish", "cat": "School vocabulary", "w": "Polish", "p": "p\u00e1lish / p\u00f3ulish", "me": [{"m": "Make something smooth or shiny \u2014 Pulir / lustrar.", "e": "She polished the silver."}, {"m": "A substance used to create shine \u2014 Pulimento / bet\u00fan.", "e": "He bought shoe polish."}, {"m": "Related to Poland \u2014 Polaco/a.", "e": "She speaks Polish."}], "n": "Pronounced p\u00e1lish for shine; p\u00f3ulish for Poland."}, {"id": "School vocabulary::Praised", "cat": "School vocabulary", "w": "Praised", "p": "pr\u00e9izd", "me": [{"m": "Expressed approval or admiration \u2014 Elogi\u00f3 / alab\u00f3.", "e": "The teacher praised her work."}, {"m": "Was commended publicly \u2014 Fue elogiado/a.", "e": "The firefighter was praised for his courage."}], "n": "Past tense and past participle of praise; the s sounds like z."}, {"id": "School vocabulary::Ominously", "cat": "School vocabulary", "w": "Ominously", "p": "\u00e1minasli", "me": [{"m": "In a way suggesting something bad will happen \u2014 De manera ominosa / amenazante.", "e": "The sky darkened ominously."}], "n": "Adverb from ominous."}, {"id": "School vocabulary::Troublesome", "cat": "School vocabulary", "w": "Troublesome", "p": "tr\u00e1bolsam", "me": [{"m": "Causing difficulty or annoyance \u2014 Problem\u00e1tico/a / molesto/a.", "e": "The machine has a troublesome fault."}, {"m": "Likely to cause problems \u2014 Conflictivo/a.", "e": "They removed a troublesome clause from the contract."}], "n": "The middle e is silent in pronunciation."}, {"id": "School vocabulary::Beliefs", "cat": "School vocabulary", "w": "Beliefs", "p": "bil\u00edifs", "me": [{"m": "Ideas accepted as true \u2014 Creencias.", "e": "People have different religious beliefs."}, {"m": "Strong opinions or principles \u2014 Convicciones.", "e": "She defended her beliefs."}], "n": "Plural of belief; change f to v before adding -s."}, {"id": "504 Main words::Abandon", "cat": "504 Main words", "w": "Abandon", "p": "ab\u00e1ndon", "me": [{"m": "Leave permanently \u2014 Abandonar.", "e": "They abandoned the old building."}, {"m": "Stop an activity or plan \u2014 Renunciar a / abandonar.", "e": "We abandoned the project."}, {"m": "Complete freedom, noun \u2014 Desenfreno / libertad total.", "e": "The children danced with abandon."}], "n": "Usually a verb; with abandon is a less common noun phrase."}, {"id": "504 Main words::Keen", "cat": "504 Main words", "w": "Keen", "p": "k\u00edin", "me": [{"m": "Very interested or eager \u2014 Entusiasmado/a.", "e": "She is keen to learn English."}, {"m": "Sharp or strong \u2014 Agudo/a.", "e": "Dogs have a keen sense of smell."}, {"m": "Very good or skilled \u2014 H\u00e1bil / perspicaz.", "e": "He is a keen observer."}], "n": "Common patterns: keen on something and keen to do something."}, {"id": "504 Main words::Jealous", "cat": "504 Main words", "w": "Jealous", "p": "y\u00e9las", "me": [{"m": "Afraid of losing someone's affection \u2014 Celoso/a.", "e": "He felt jealous when she spoke to her friend."}, {"m": "Wanting what another person has \u2014 Envidioso/a.", "e": "She was jealous of his success."}, {"m": "Protective of something \u2014 Celoso/a de.", "e": "The artist is jealous of her privacy."}], "n": "Usually followed by of when the cause is named."}, {"id": "504 Main words::Tact", "cat": "504 Main words", "w": "Tact", "p": "takt", "me": [{"m": "Skill in avoiding offense \u2014 Tacto / diplomacia.", "e": "She handled the problem with tact."}], "n": "Usually uncountable. Tactful is the adjective."}, {"id": "504 Main words::Oath", "cat": "504 Main words", "w": "Oath", "p": "\u00f3uth", "me": [{"m": "Serious promise \u2014 Juramento.", "e": "The doctor took an oath to help patients."}, {"m": "Swear word \u2014 Maldici\u00f3n / palabrota.", "e": "He shouted an oath in anger."}], "n": "Plural: oaths, pronounced \u00f3udz."}, {"id": "504 Main words::Vacant", "cat": "504 Main words", "w": "Vacant", "p": "v\u00e9ikant", "me": [{"m": "Empty and available \u2014 Vacante / desocupado/a.", "e": "The apartment is vacant."}, {"m": "Available job or position \u2014 Vacante.", "e": "The company has a vacant position."}, {"m": "Showing no thought or interest \u2014 Vac\u00edo/a / inexpresivo/a.", "e": "She gave me a vacant look."}], "n": "Vacant describes places, positions, or expressions."}, {"id": "504 Main words::Hardship", "cat": "504 Main words", "w": "Hardship", "p": "j\u00e1rdship", "me": [{"m": "Serious difficulty or suffering \u2014 Dificultad / sufrimiento.", "e": "The family faced financial hardship."}, {"m": "A difficult condition \u2014 Penuria.", "e": "They survived many hardships."}], "n": "Can be countable or uncountable."}, {"id": "504 Main words::Gallant", "cat": "504 Main words", "w": "Gallant", "p": "g\u00e1lant", "me": [{"m": "Brave and honorable \u2014 Valiente / heroico/a.", "e": "The firefighter made a gallant rescue."}, {"m": "Polite and attentive \u2014 Galante / cort\u00e9s.", "e": "He was gallant toward his guests."}], "n": "Gallant has different stress in some accents, but g\u00e1lant is common in American English."}, {"id": "504 Main words::Data", "cat": "504 Main words", "w": "Data", "p": "d\u00e9ita", "me": [{"m": "Facts or information \u2014 Datos.", "e": "The study collected useful data."}, {"m": "Digital information \u2014 Datos digitales.", "e": "The app stores your data securely."}], "n": "Data can be treated as plural in formal writing or singular in everyday use."}, {"id": "504 Main words::Unaccustomed", "cat": "504 Main words", "w": "Unaccustomed", "p": "anak\u00e1stomd", "me": [{"m": "Not used to something \u2014 No acostumbrado/a.", "e": "She is unaccustomed to cold weather."}, {"m": "Unusual or unfamiliar \u2014 Poco habitual.", "e": "He spoke with unaccustomed confidence."}], "n": "Usually followed by to plus a noun or -ing verb."}, {"id": "504 Main words::Bachelor", "cat": "504 Main words", "w": "Bachelor", "p": "b\u00e1cholor", "me": [{"m": "Unmarried man \u2014 Soltero.", "e": "He remained a bachelor for many years."}, {"m": "University degree \u2014 Licenciatura / t\u00edtulo universitario.", "e": "She earned a bachelor's degree."}, {"m": "Male animal without a mate \u2014 Macho sin pareja.", "e": "The herd included several bachelor males."}], "n": "For the degree, use bachelor's degree with an apostrophe."}, {"id": "504 Main words::Qualify", "cat": "504 Main words", "w": "Qualify", "p": "ku\u00e1lif\u00e1i", "me": [{"m": "Meet the requirements \u2014 Calificar / cumplir los requisitos.", "e": "She qualified for the scholarship."}, {"m": "Advance in a competition \u2014 Clasificarse.", "e": "The team qualified for the final."}, {"m": "Limit or modify a statement \u2014 Matizar / condicionar.", "e": "He qualified his answer with a warning."}], "n": "Common patterns: qualify for something and qualify as a profession."}, {"id": "504 Main words::Corpse", "cat": "504 Main words", "w": "Corpse", "p": "korps", "me": [{"m": "Dead human body \u2014 Cad\u00e1ver.", "e": "Police found a corpse near the river."}], "n": "Usually refers to a human body; carcass is common for an animal."}, {"id": "504 Main words::Conceal", "cat": "504 Main words", "w": "Conceal", "p": "kans\u00edil", "me": [{"m": "Hide something \u2014 Ocultar / esconder.", "e": "She concealed the letter in a drawer."}, {"m": "Hide a fact or feeling \u2014 Disimular / encubrir.", "e": "He could not conceal his fear."}], "n": "Formal verb; conceal, concealed, concealed."}, {"id": "504 Main words::Dismal", "cat": "504 Main words", "w": "Dismal", "p": "d\u00edzmal", "me": [{"m": "Very bad or disappointing \u2014 P\u00e9simo/a.", "e": "The team had a dismal season."}, {"m": "Dark and depressing \u2014 Sombr\u00edo/a.", "e": "The room looked cold and dismal."}], "n": "Used for poor results, weather, places, or moods."}, {"id": "504 Main words::Frigid", "cat": "504 Main words", "w": "Frigid", "p": "fr\u00edyid", "me": [{"m": "Extremely cold \u   function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ progress = JSON.parse(raw); }
    }catch(e){ progress = {}; }
    migrateProgressToSRS();
  }

  // One-time upgrade for progress saved before spaced repetition existed.
  // Old entries have a status but no step/due; credit past mastery without
  // fully trusting it -- a mastered word starts one step below the top, and
  // since due is left unset it counts as due right away, so the very next
  // review re-confirms it under the new system instead of assuming forever.
  function migrateProgressToSRS(){
    let changed = false;
    Object.keys(progress).forEach(id=>{
      const p = progress[id];
      if(p && p.step === undefined){
        if(p.status==='mastered') p.step = SRS_MASTER_STEP - 1;
        else if(p.status==='learning') p.step = (p.correct>=1) ? 1 : 0;
        else p.step = 0;
        changed = true;
      }
    });
    if(changed) saveProgress();
  }
  function saveProgress(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
  }

  function loadCustomWords(){

  // Mirrors the id scheme build_word_log.py uses: category::word, with a
  // #2/#3 suffix if that exact word already exists in that category, so a
  // duplicate never collides with -- or scrambles progress on -- an existing id.
  function makeWordId(cat, word){
    const base = cat + '::' + word;
    let count = 0;
    WORDS.forEach(w=>{ if(w.id===base || w.id.indexOf(base+'#')===0) count++; });
    return count===0 ? base : base + '#' + (count+1);
  }

  // My list is a hand-picked, fixed set of up to MYLIST_MAX word ids the user
  // chose themselves. Unlike the old auto-picked batching, it never rotates
  // on its own -- the same words come up every time until the user removes
  // or swaps one, which is the point: study exactly this set until it sticks.
  function loadMyList(){
    try{
      const raw = localStorage.getItem(MYLIST_KEY);
      if(raw){ myList = JSON.parse(raw); }
    }catch(e){ myList = []; }

  function toggleMyListWord(id){
    const idx = myList.indexOf(id);
    if(idx !== -1){
      myList.splice(idx, 1);
    } else {
      if(myList.length >= MYLIST_MAX) return;
      myList.push(id);

  // Keyed by the word's own stable id (category::word), same scheme as
  // everywhere else -- so reordering the spreadsheet never scrambles a
  // speaking score, just like it never scrambles mastery progress.
  function saveSpeechScore(wordId, score){
    if(speechScores[wordId]===undefined || score>speechScores[wordId]){
      speechScores[wordId] = score;

  function loadLearnSets(){
