<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Opening Word Log&hellip;</title>
<meta http-equiv="refresh" content="0; url=http://localhost:8777/">
<style>
  html,body{ margin:0; height:100%; background:#1B2124; color:#E9E6DC;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .wrap{ min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:32px 20px; text-align:center; box-sizing:border-box; }
  h1{ font-size:1.3rem; font-weight:700; margin:0; letter-spacing:-.01em; }
  p{ margin:0; color:#96A0A6; font-size:.9rem; line-height:1.5; max-width:30rem; }
  a.go{ display:inline-block; background:#E39A3A; color:#241804; text-decoration:none;
    font-weight:700; font-size:1rem; padding:15px 28px; border-radius:10px; }
  a.go:hover{ filter:brightness(1.08); }
  code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; color:#96A0A6;
    background:#232B31; border:1px solid #3A4650; border-radius:7px; padding:8px 12px;
    display:inline-block; word-break:break-all; max-width:100%; box-sizing:border-box; }
  .note{ font-size:.8rem; color:#96A0A6; border-top:1px solid #3A4650; padding-top:16px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Opening Word Log&hellip;</h1>
  <a class="go" href="http://localhost:8777/">Open Word Log</a>
  <p>If nothing happened, tap the button.</p>
  <code>http://localhost:8777/</code>
  <p class="note">The app is served from this laptop. If it will not load, it is not
  running &mdash; double-click <b>start_word_log.cmd</b>.</p>
</div>
<script>
  // Replace rather than assign, so the back button does not bounce you
  // straight back to this page.
  location.replace("http://localhost:8777/");
</script>
</body>
</html>
