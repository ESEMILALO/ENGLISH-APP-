<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Word Log — Vocabulary Practice</title>
<!-- Installing as an app: these only take effect over https, which is what
     Tailscale is for. Opened as a plain file they are harmlessly ignored. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B2124">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Log">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2124;
    --panel:#232B31;
    --rule:#3A4650;
    --card:#EDE8DA;
    --card-ink:#211F1A;
    --card-ink-soft:#6B6255;
    --text:#E9E6DC;
    --text-soft:#96A0A6;
    --amber:#E39A3A;
    --amber-ink:#241804;
    --amber-deep:#B9741C;
    --good:#5CAE7C;
    --good-bg:rgba(78,154,108,.16);
    --warn:#D57C4E;
    --warn-bg:rgba(200,106,58,.18);
    --new:#8B959C;
    --new-bg:rgba(124,135,144,.14);
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --cond:'IBM Plex Sans Condensed',var(--sans);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #262F35 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:26px 16px 56px;
  }
  #app{ max-width:520px; margin:0 auto; }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  ::selection{ background:var(--amber); color:var(--amber-ink); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:4px; }

  .view{ animation:viewIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ .view,.card{ animation:none !important; } }

  .eyebrow{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.09em;
    color:var(--text-soft); text-transform:uppercase; margin-bottom:6px;
  }
  .title{ font-family:var(--cond); font-weight:700; font-size:clamp(1.8rem,7vw,2.4rem); margin:0 0 6px; letter-spacing:-.01em; }
  .subtitle{ color:var(--text-soft); margin:0 0 22px; font-size:.95rem; line-height:1.5; }
  .loading{ color:var(--text-soft); font-family:var(--mono); font-size:.85rem; padding:40px 0; text-align:center; }
  .hint{ color:var(--text-soft); font-size:.82rem; line-height:1.5; margin:8px 2px 0; }

  /* stats readout */
  .stat-row{ display:flex; gap:10px; margin-bottom:22px; }
  .stat{
    flex:1; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:12px 10px; text-align:center; font-family:var(--mono); font-size:1.35rem; font-weight:600;
    color:var(--text);
  }
  .stat small{ display:block; font-family:var(--sans); font-weight:400; font-size:.72rem; letter-spacing:.02em;
    color:var(--text-soft); margin-top:4px; text-transform:lowercase; }
  /* home counters: their own tile so the summary screens keep using .stat */
  .hstat{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--rule);
    border-radius:12px; padding:14px 16px; text-align:left; color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; gap:3px; font-family:var(--sans);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .hstat:hover{ background:#28313a; }
  .hstat:active{ transform:scale(.995); }
  .hstat:disabled{ cursor:default; opacity:.5; }
  .hstat:disabled:hover{ background:var(--panel); }
  .hstat-good{ border-left-color:var(--good); }
  .hstat-warn{ border-left-color:var(--warn); }
  .hstat-new{ border-left-color:var(--new); }
  .hstat-label{ font-family:var(--mono); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text-soft); }
  .hstat-num{ font-family:var(--mono); font-size:1.9rem; font-weight:600; line-height:1.05; }
  .hstat-sub{ font-size:.75rem; color:var(--text-soft); }
  /* hover-only affordance: hidden entirely on touch, where it would just
     be dead space in an already narrow tile */
  .hstat-go{ display:none; font-size:.72rem; color:var(--amber); opacity:0; transition:opacity .15s ease; }
  @media (hover:hover){
    .hstat-go{ display:block; }
    .hstat:hover .hstat-go{ opacity:1; }
    .hstat:disabled .hstat-go{ display:none; }
  }
  @media (max-width:430px){
    .hstat{ padding:12px 12px; }
    .hstat-label{ font-size:.62rem; letter-spacing:.06em; }
    .hstat-num{ font-size:1.6rem; }
    .hstat-sub{ font-size:.68rem; line-height:1.35; }
  }

  /* Home in two spaces: what to do on the left, how you are doing on the
     right. One space under the other on a phone, side by side once there
     is room -- and inside each one the bars still run its whole width. */
  .home-cols{ display:block; }
  .home-col-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.11em; text-transform:uppercase;
    color:var(--text-soft); margin:28px 2px 14px; padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }
  .home-col-head b{ color:var(--amber); font-weight:600; letter-spacing:.06em; }
  .home-col-head .home-col-hint{ text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:.76rem; }

  /* The recall check that meets you at the door. Lives on top of the app
     rather than replacing it, so answering it puts you back where you
     were instead of anywhere new. */
  .recall-scrim{
    position:fixed; inset:0; z-index:200; background:rgba(12,16,19,.82);
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:recallIn .22s ease both;
  }
  @keyframes recallIn{ from{ opacity:0; } to{ opacity:1; } }
  .recall-box{
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--rule); border-radius:16px;
    padding:20px 20px 18px; box-shadow:0 26px 60px rgba(0,0,0,.5);
    animation:recallRise .26s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes recallRise{ from{ transform:translateY(14px); } to{ transform:none; } }
  .recall-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-family:var(--mono); font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-soft); margin-bottom:4px;
  }
  .recall-title{
    font-family:var(--cond); font-weight:700; font-size:1.3rem; letter-spacing:-.01em;
    color:var(--text); margin:0 0 4px;
  }
  .recall-how{ font-size:.8rem; color:var(--amber); margin:0 0 14px; font-weight:600; }
  .recall-subject{
    font-family:var(--cond); font-weight:700; font-size:1.9rem; letter-spacing:-.015em;
    color:var(--text); line-height:1.1; margin:2px 0 4px;
  }
  .recall-pron{ font-family:var(--mono); font-size:.8rem; color:var(--text-soft); margin-bottom:12px; }
  .recall-prompt{ font-size:.95rem; line-height:1.5; color:var(--text); margin:0 0 14px; }
  .recall-ex{ font-size:.85rem; line-height:1.5; color:var(--text-soft); font-style:italic; margin:6px 0 14px; }
  .recall-input{
    width:100%; background:var(--bg); border:1px solid var(--rule); color:var(--text);
    border-radius:9px; padding:13px 14px; font-size:1rem; font-family:var(--sans);
    margin-bottom:12px; box-sizing:border-box;
  }
  .recall-input:focus{ outline:none; border-color:var(--amber); }
  .recall-btns{ display:flex; gap:9px; flex-wrap:wrap; }
  .recall-btns button{ flex:1; min-width:120px; }
  /* .btn-primary has no rule for an inline icon, so an unconstrained SVG
     stretches to fill the whole button. */
  .recall-box .btn-primary svg{
    width:15px; height:15px; vertical-align:-2px; margin-right:8px;
  }
  .recall-verdict{ font-weight:700; font-size:1rem; margin:0 0 8px; }
  .recall-answer{ font-size:.9rem; color:var(--text-soft); line-height:1.5; margin:0 0 14px; }
  .recall-dismiss{
    display:block; width:100%; background:none; border:none; color:var(--text-soft);
    font-family:var(--sans); font-size:.82rem; text-decoration:underline; cursor:pointer;
    margin-top:12px; padding:4px;
  }
  .recall-dismiss:hover{ color:var(--text); }
  .recall-dots{ display:flex; gap:5px; margin-top:14px; }
  .recall-dots span{ flex:1; height:3px; border-radius:2px; background:var(--rule); }
  .recall-dots span.ok{ background:var(--good); }
  .recall-dots span.miss{ background:var(--warn); }
  .recall-dots span.now{ background:var(--amber); }

  /* The one line that says whether this device and the laptop agree. */
  .sync-line{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:.78rem; color:var(--text-soft); margin:14px 2px 0;
  }
  .sync-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--rule); }
  .sync-dot.on{ background:var(--good); }
  .sync-dot.busy{ background:var(--amber); }
  .sync-dot.bad{ background:var(--warn); }
  .sync-line button{
    background:none; border:none; color:var(--amber); font-family:var(--sans);
    font-size:.78rem; text-decoration:underline; cursor:pointer; padding:0;
  }
  .sync-setup{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .sync-setup input{
    flex:1; min-width:140px; background:var(--bg); border:1px solid var(--rule);
    color:var(--text); border-radius:8px; padding:10px 12px; font-family:var(--mono);
    font-size:.9rem; letter-spacing:.06em;
  }
  .sync-setup input:focus{ outline:none; border-color:var(--amber); }
  .sync-setup button{
    background:var(--amber); color:var(--amber-ink); border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:.82rem; cursor:pointer;
    text-decoration:none; font-family:var(--sans);
  }

  /* Progress sits at the top of the home now, above the day's work. */
  .home-top{ margin-bottom:10px; }

  /* Topics and the odd corners of the app, folded away at the end so the
     screen is only what there is to do today. */
  .home-more{
    border:1px solid var(--rule); border-radius:12px; background:var(--panel);
    margin-top:26px; overflow:hidden;
  }
  .home-more summary{
    cursor:pointer; list-style:none; padding:14px 16px;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-soft); display:flex; align-items:center; gap:9px;
    transition:color .15s ease;
  }
  .home-more summary::-webkit-details-marker{ display:none; }
  .home-more summary::before{
    content:'+'; font-size:1rem; line-height:1; color:var(--amber); flex-shrink:0;
  }
  .home-more[open] summary::before{ content:'2'; }
  .home-more summary:hover{ color:var(--text); }
  .home-more-body{ padding:0 16px 14px; border-top:1px solid var(--rule); }

  /* Mastered words, shown one at a time and changing on their own, so a
     finished word still crosses your eyes now and then. */
  .fresh-block{
    background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--good);
    border-radius:12px; padding:14px 16px 12px; margin:0 0 20px;
  }
  .fresh-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    font-family:var(--mono); font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-soft); margin-bottom:9px;
  }
  .fresh-count{ letter-spacing:.04em; }
  .fresh-word{
    font-family:var(--cond); font-weight:700; font-size:1.35rem; letter-spacing:-.01em;
    color:var(--text); line-height:1.15;
  }
  .fresh-pron{ font-family:var(--mono); font-size:.78rem; color:var(--text-soft); margin-top:2px; }
  .fresh-mean{ font-size:.88rem; line-height:1.45; color:var(--text); margin-top:7px; }
  .fresh-ex{ font-size:.82rem; line-height:1.45; color:var(--text-soft); font-style:italic; margin-top:5px; }
  /* the sliver that runs down before the next word arrives */
  .fresh-tick{ height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin:11px 0 10px; }
  .fresh-tick span{ display:block; height:100%; width:0; background:var(--good); border-radius:2px; }
  .fresh-tick span.run{ animation:freshTick linear forwards; }
  @keyframes freshTick{ from{ width:0; } to{ width:100%; } }
  .fresh-actions{ display:flex; align-items:center; gap:7px; }
  .fresh-btn{
    background:transparent; border:1px solid var(--rule); color:var(--text-soft);
    width:30px; height:30px; border-radius:7px; cursor:pointer; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:.9rem; line-height:1;
    transition:border-color .15s ease, color .15s ease;
  }
  .fresh-btn:hover{ border-color:var(--text-soft); color:var(--text); }
  .fresh-btn svg{ width:12px; height:12px; }
  .fresh-practice{
    flex:1; background:transparent; border:1px solid var(--rule); color:var(--text);
    border-radius:7px; padding:0 12px; height:30px; cursor:pointer; text-align:center;
    font-family:var(--sans); font-size:.8rem; font-weight:600;
    transition:border-color .15s ease, background .15s ease;
  }
  .fresh-practice:hover{ border-color:var(--good); background:var(--good-bg); }
  @media (prefers-reduced-motion:reduce){
    .fresh-tick span.run{ animation:none; width:100%; }
  }

  /* section headings, so the page reads as groups instead of one long run */
  .section-label{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-soft); margin:26px 2px 10px;
  }

  /* overall progress + today's activity */
  .progress-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    font-size:.82rem; color:var(--text-soft); margin:0 2px 6px; }
  .progress-line b{ color:var(--text); font-family:var(--mono); font-weight:600; }
  .progress-wide{ height:8px; background:var(--panel); border:1px solid var(--rule); border-radius:5px;
    overflow:hidden; margin-bottom:20px; }
  .progress-wide span{ display:block; height:100%; background:var(--good); border-radius:5px; }
  .mode-note{ color:var(--text-soft); font-size:.84rem; line-height:1.5; margin:-4px 2px 14px; }
  .mode-note b{ color:var(--text); font-weight:600; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .dot-good{ background:var(--good); } .dot-warn{ background:var(--warn); } .dot-new{ background:var(--new); }

  /* buttons */
  .btn-hero{
    display:block; width:100%; text-align:left; background:var(--amber); color:var(--amber-ink);
    border:none; border-radius:12px; padding:20px 20px 18px; cursor:pointer; margin-bottom:22px;
    font-family:var(--cond); font-weight:700; font-size:clamp(1.25rem,5.2vw,1.5rem); letter-spacing:-.01em;
    box-shadow:0 12px 26px rgba(0,0,0,.30); transition:background .15s ease, transform .1s ease;
  }
  .btn-hero:hover{ background:var(--amber-deep); }
  .btn-hero:active{ transform:scale(.995); }
  .btn-hero small{
    display:block; font-family:var(--sans); font-weight:500; font-size:.84rem; letter-spacing:0;
    line-height:1.45; margin-top:6px; opacity:.82;
  }
  .hero-bar{ height:6px; background:rgba(36,24,4,.22); border-radius:3px; overflow:hidden; margin-top:12px; }
  .hero-bar span{ display:block; height:100%; background:var(--amber-ink); border-radius:3px; }

  /* reminder for finished words whose spaced-repetition slot came round */
  .recall-bar{
    display:block; width:100%; text-align:left; background:var(--panel); color:var(--text);
    border:1px solid var(--rule); border-left:4px solid var(--good); border-radius:10px;
    padding:13px 16px; cursor:pointer; margin:0 0 20px;
    font-family:var(--cond); font-weight:700; font-size:1.05rem; letter-spacing:-.01em;
    transition:border-color .15s ease, transform .1s ease;
  }
  .recall-bar:hover{ border-color:var(--good); }
  .recall-bar:active{ transform:scale(.995); }
  .recall-bar small{
    display:block; font-family:var(--sans); font-weight:500; font-size:.82rem; letter-spacing:0;
    line-height:1.45; margin-top:5px; color:var(--text-soft);
  }

  .btn-primary{
    display:block; width:100%; background:var(--amber); color:var(--amber-ink); border:none;
    font-weight:700; font-size:.92rem; letter-spacing:.03em; text-transform:uppercase;
    padding:15px 18px; border-radius:8px; cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background:var(--amber-deep); }
  .btn-primary:active{ transform:scale(.99); }
  .btn-secondary{
    display:block; width:100%; background:transparent; color:var(--text); border:1px solid var(--rule);
    font-weight:600; font-size:.88rem; padding:14px 18px; border-radius:8px; cursor:pointer; margin-top:10px;
  }
  .btn-secondary:hover{ border-color:var(--text-soft); }
  .btn-oncard{
    display:block; width:100%; background:var(--card-ink); color:var(--card); border:none;
    font-weight:700; font-size:.85rem; letter-spacing:.03em; text-transform:uppercase;
    padding:13px 16px; border-radius:7px; cursor:pointer; margin-top:22px;
  }
  .btn-oncard:hover{ opacity:.88; }

  /* session length toggle */
  .length-toggle{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .len-btn{
    flex:1 1 84px; background:var(--panel); border:1px solid var(--rule); color:var(--text-soft);
    border-radius:8px; padding:9px 6px; cursor:pointer; font-size:.82rem; font-weight:600;
  }
  .len-btn small{ display:block; font-family:var(--mono); font-weight:400; font-size:.72rem; margin-top:2px; opacity:.85; }
  .len-btn:hover{ border-color:var(--text-soft); color:var(--text); }
  .len-btn.active{
    background:rgba(227,154,58,.16); border-color:var(--amber); color:var(--amber);
    box-shadow:inset 0 0 0 1px var(--amber);
  }
  .len-btn.active:hover{ color:var(--amber); }

  .divider{ display:flex; align-items:center; gap:10px; margin:26px 0 14px; color:var(--text-soft);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--rule); }

  /* category list */
  .cat-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .cat-row{
    text-align:left; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:13px 14px; cursor:pointer; color:var(--text); width:100%;
  }
  .cat-row:hover{ border-color:var(--text-soft); background:#28313a; }
  .cat-row-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .cat-name{ font-weight:600; font-size:.95rem; }
  .cat-pct{ font-family:var(--mono); font-size:.8rem; font-weight:600; flex-shrink:0; }
  .cat-arrow{ color:var(--amber); font-family:var(--mono); }
  .cat-row-meta{ font-family:var(--mono); font-size:.74rem; color:var(--text-soft); margin:5px 0 8px; }
  .bar{ height:6px; background:var(--rule); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--good); border-radius:3px; }
  .bar-session{ margin:10px 0 22px; }
  .bar-session .bar-fill{ background:var(--amber); }

  .reset-link{
    display:block; margin:26px auto 0; background:none; border:none; color:var(--text-soft);
    font-size:.76rem; text-decoration:underline; cursor:pointer; padding:8px;
  }

  /* session header */
  .sess-top{ display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:.76rem; color:var(--text-soft); letter-spacing:.04em; }
  .sess-back{
    background:none; border:none; color:var(--text-soft); cursor:pointer; padding:4px 6px 4px 0;
    display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:.76rem; letter-spacing:.04em;
  }
  .sess-back:hover{ color:var(--text); }
  .sess-back svg{ width:14px; height:14px; flex-shrink:0; }
  .cat-tag{ background:var(--panel); border:1px solid var(--rule); padding:3px 8px; border-radius:5px; text-transform:uppercase; }

  /* flashcard */
  .card{
    position:relative; background:var(--card); color:var(--card-ink); border-radius:16px;
    padding:34px 24px 26px; text-align:center; box-shadow:0 22px 44px rgba(0,0,0,.38), 0 2px 0 rgba(0,0,0,.05);
    transform:rotate(-.4deg); animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .hole{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:16px; height:16px;
    border-radius:50%; background:var(--bg); box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
  }
  .card-word{ font-family:var(--cond); font-weight:700; font-size:clamp(2.1rem,9vw,2.9rem); letter-spacing:-.01em; line-height:1.05; word-break:break-word; }
  .card-pron{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
  .pron-text{ font-family:var(--mono); font-size:.95rem; color:var(--card-ink-soft); }
  .speak-btn{
    background:var(--amber); color:var(--amber-ink); border:none; width:30px; height:30px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .speak-btn:hover{ background:var(--amber-deep); }
  .speak-btn svg{ width:14px; height:14px; }

  .meanings{ text-align:left; margin-top:24px; display:flex; flex-direction:column; gap:16px; }
  .meaning-row{ display:flex; gap:10px; }
  .meaning-num{ font-family:var(--mono); font-weight:600; color:var(--amber-deep); font-size:.9rem; flex-shrink:0; width:16px; }
  .meaning-text{ font-weight:500; font-size:1rem; line-height:1.4; }
  .meaning-example{ color:var(--card-ink-soft); font-style:italic; font-size:.9rem; margin-top:4px; line-height:1.4; display:flex; align-items:center; gap:6px; }
  .mini-speak{
    background:none; border:none; color:var(--card-ink-soft); cursor:pointer; padding:2px; flex-shrink:0;
    display:inline-flex; align-items:center;
  }
  .mini-speak:hover{ color:var(--amber-deep); }
  .mini-speak svg{ width:12px; height:12px; }

  .note-box{
    text-align:left; margin-top:18px; padding:10px 12px; border-left:3px solid var(--amber);
    background:rgba(33,31,26,.05); font-size:.85rem; line-height:1.5; font-style:italic; color:var(--card-ink-soft);
  }
  .note-label{ font-family:var(--mono); font-style:normal; font-weight:600; font-size:.68rem; color:var(--amber-deep);
    letter-spacing:.06em; margin-right:6px; }

  .rate-row{ display:flex; gap:10px; margin-top:20px; }
  .tag-btn{
    flex:1; border:none; border-radius:9px; padding:14px 8px; font-weight:700; font-size:.85rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; min-height:48px;
  }
  .tag-btn svg{ width:15px; height:15px; flex-shrink:0; }
  .tag-warn{ background:var(--warn-bg); color:var(--warn); border:1px solid rgba(213,124,78,.4); }
  .tag-warn:hover{ background:rgba(213,124,78,.26); }
  .tag-good{ background:var(--good-bg); color:var(--good); border:1px solid rgba(92,174,124,.4); }
  .tag-good:hover{ background:rgba(92,174,124,.26); }

  .ask-link{
    display:block; margin:14px auto 0; background:none; border:none; color:var(--text-soft);
    font-size:.82rem; cursor:pointer; padding:6px;
  }
  .ask-link:hover{ color:var(--amber); }

  /* summary */
  .follow-list{ display:flex; flex-direction:column; gap:1px; background:var(--rule); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .follow-row{ background:var(--panel); padding:12px 14px; display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .follow-word{ font-weight:600; font-size:.92rem; flex-shrink:0; }
  .follow-gloss{ color:var(--text-soft); font-size:.8rem; text-align:right; }

  .word-list{ display:flex; flex-direction:column; gap:1px; background:var(--rule); border-radius:10px;
    overflow-y:auto; max-height:56vh; margin-bottom:8px; }
  .word-row{ background:var(--panel); border:none; padding:12px 14px; display:flex; justify-content:space-between;
    align-items:center; cursor:pointer; width:100%; text-align:left; color:var(--text); }
  .word-row-name{ font-weight:600; font-size:.92rem; }
  .word-row-pct{ font-family:var(--mono); font-weight:600; font-size:.85rem; flex-shrink:0; margin-left:10px; }
  .history-row-score{ font-family:var(--mono); font-weight:600; flex-shrink:0; }

  /* search + add-word form fields */
  .field{ margin-bottom:14px; }
  .field-label{ display:block; font-family:var(--mono); font-size:.72rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--text-soft); margin-bottom:6px; }
  .field-input{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--rule);
    background:var(--panel); color:var(--text); font-family:var(--sans); font-size:.95rem; }
  .field-input:focus{ outline:none; border-color:var(--amber); }
  select.field-input{ appearance:none; -webkit-appearance:none; }
  .field-error{ color:var(--warn); font-size:.82rem; margin:2px 2px 12px; min-height:1.2em; }

  /* streak */
  .streak-row{ display:flex; align-items:center; gap:6px; margin-bottom:18px; color:var(--amber); font-size:.85rem; font-weight:600; }
  .streak-row svg{ width:15px; height:15px; flex-shrink:0; }
  .streak-row .streak-best{ color:var(--text-soft); font-weight:400; font-family:var(--mono); font-size:.72rem; }

  /* typed-answer mode */
  .prompt-label{ font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--card-ink-soft); margin-bottom:14px; }
  .type-input{
    width:100%; margin-top:20px; padding:13px 14px; border-radius:8px; border:1.5px solid rgba(33,31,26,.25);
    background:rgba(33,31,26,.04); color:var(--card-ink); font-family:var(--sans); font-size:1.05rem; font-weight:500;
    text-align:center;
  }
  .type-input:focus{ outline:none; border-color:var(--amber-deep); background:#fff; }
  .result-badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px;
    font-family:var(--mono); font-size:.72rem; font-weight:600; text-transform:uppercase; margin-bottom:10px;
  }
  .result-badge svg{ width:11px; height:11px; }
  .result-good{ background:var(--good-bg); color:var(--good); }
  .result-bad{ background:var(--warn-bg); color:var(--warn); }

  /* sentence-completion mode */
  .cloze-sentence{ font-style:italic; font-size:1rem; line-height:1.5; color:var(--card-ink); margin:4px 0; }
  .cloze-sentence strong{ font-style:normal; color:var(--amber-deep); }

  /* speech coach mic button */
  .listen-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--card-ink); color:var(--card); border:none; font-weight:700; font-size:.85rem;
    letter-spacing:.03em; text-transform:uppercase; padding:15px 16px; border-radius:7px; cursor:pointer; margin-top:22px;
  }
  .listen-btn:hover{ opacity:.88; }
  .listen-btn.is-listening{ background:var(--warn); color:var(--amber-ink); }
  .listen-btn svg{ width:16px; height:16px; flex-shrink:0; }
  .listen-error{ color:var(--warn); font-size:.85rem; margin-top:10px; }

  /* speech coach */
  .sc-phrase{ font-family:var(--cond); font-weight:700; font-size:clamp(1.3rem,5.5vw,1.7rem); line-height:1.3; }
  .sc-score-row{ display:flex; align-items:baseline; gap:10px; margin:16px 0 10px; }
  .sc-score-value{ font-family:var(--mono); font-weight:700; font-size:1.8rem; }
  .sc-score-label{ font-size:.88rem; color:var(--card-ink-soft); }
  .sc-diff{ font-size:1.05rem; line-height:1.7; margin:6px 0 14px; text-align:left; }
  .sc-diff .ok{ color:var(--good); font-weight:600; }
  .sc-diff .miss{ color:var(--warn); text-decoration:underline; text-decoration-style:wavy; text-decoration-color:rgba(213,124,78,.5); }
  .sc-transcript{ color:var(--card-ink-soft); font-size:.85rem; font-style:italic; text-align:left; }

  /* fast mode */
  .fast-bar-track{ height:4px; background:rgba(0,0,0,.15); border-radius:2px; overflow:hidden; margin:22px 0 0; }
  .fast-bar-fill{ height:100%; width:0%; background:var(--amber-deep); border-radius:2px; }
  .fast-controls{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; }
  .fast-pause-btn{
    background:var(--panel); border:1px solid var(--rule); color:var(--text); width:44px; height:44px;
    border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .fast-pause-btn svg{ width:16px; height:16px; }
  .card.fast-tap{ cursor:pointer; }

  @media (max-width:380px){
    .rate-row{ flex-direction:column; }
    .stat{ font-size:1.15rem; }
  }

  /* Desktop: the home opens into its two spaces, and inside each one
     everything is still a bar running the column's full width. */
  @media (min-width:900px){
    body{ padding:30px 28px 44px; }
    #app{ max-width:1400px; }

    .home-cols{
      display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:0 36px; align-items:start;
    }
    /* a rule down the middle, so the two spaces read as two */
    .home-col-see{ border-left:1px solid var(--rule); padding-left:36px; }
    .home-col-head{ margin-top:0; }
    /* first heading inside a space should not push off from the column head */
    .home-col > .section-label:first-of-type{ margin-top:24px; }

    /* bars span the width, but stay compact -- widen without bulking up */
    .btn-hero{ padding:16px 20px 15px; font-size:1.2rem; margin-bottom:16px; }
    .btn-hero small{ font-size:.82rem; margin-top:4px; }
    .hero-bar{ height:5px; margin-top:9px; }
    .btn-primary{ padding:14px 20px; font-size:.92rem; }
    .btn-secondary{ padding:12px 20px; font-size:.88rem; }
    .stat{ padding:12px 12px; font-size:1.35rem; }
    .hstat{ padding:12px 16px; gap:2px; border-left-width:3px; }
    .hstat-label{ font-size:.68rem; }
    .hstat-num{ font-size:1.7rem; }
    .hstat-sub{ font-size:.74rem; }
    .hstat-go{ font-size:.72rem; }
    .stat-row{ margin-bottom:16px; }
    .section-label{ font-size:.7rem; margin:22px 2px 9px; }
    .cat-pct{ font-size:.82rem; }
    .len-btn{ padding:10px 10px; font-size:.84rem; }
    .len-btn small{ font-size:.72rem; }
    .cat-row{ padding:11px 18px; }
    .cat-name{ font-size:.98rem; }
    .cat-row-meta{ font-size:.75rem; margin:3px 0 6px; }
    .cat-list{ gap:7px; }
    .word-row{ padding:11px 18px; }
    .follow-row{ padding:11px 18px; }
    .word-list{ max-height:64vh; }
    .field-input{ padding:11px 14px; font-size:.95rem; }
    .progress-wide{ margin-bottom:14px; }
    .divider{ margin:20px 0 12px; }
    /* footer links flow as a row instead of a tall stack of full-width
       buttons -- that stack alone was costing ~150px of scroll */
    .reset-link{ display:inline-block; width:auto; margin:12px 20px 0 0; padding:2px 0; }

    /* the card is a bar too, but hold the text to a readable measure */
    .card{ padding:30px 26px 24px; }
    .meanings, .cloze-sentence, .sc-diff, .sc-transcript, .note-box{
      max-width:820px; margin-left:auto; margin-right:auto;
    }
    .type-input{ max-width:560px; margin-left:auto; margin-right:auto; }
    .listen-btn, .btn-oncard{ max-width:560px; margin-left:auto; margin-right:auto; }
  }
</style>
