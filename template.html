<body>
<div id="app"><p class="loading">Loading your progress…</p></div>

<script>
(function(){
  const WORDS = [];

  const CATEGORIES = ['School vocabulary','504 Main words','504 Secondary','School books','Series'];
  const CAT_ABBR = {
    'School vocabulary':'School vocab',
    '504 Main words':'504 · Main',
    '504 Secondary':'504 · Secondary',
    'School books':'School books',
    'Series':'Series'
  };

  const ICON_SPEAKER ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="currentColor" stroke="none"></polygon><path d="M16 8a5 5 0 0 1 0 8"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"></polyline></svg>';
  const ICON_WRENCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2z"></path></svg>';
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';
  const ICON_FLAME = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 23c-4 0-7-3-7-7 0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8 1 3 4 5 4 9 0-1 1-2 1-3 2 2 3 4 3 6 0 4-3 7-7 7z"></path></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"></polygon></svg>';
  const ICON_SKIP = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,4 15,12 5,20"></polygon><rect x="17" y="4" width="3" height="16" rx="1"></rect></svg>';
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,5 8,12 15,19"></polyline></svg>';
  const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>';

  const STORAGE_KEY = 'wordlog_progress';
  const META_KEY = 'wordlog_meta';
  const CUSTOM_KEY = 'wordlog_custom_words';
  const MYLIST_KEY = 'wordlog_my_list';
  const MYLIST_MAX = 10;
  const SPEECH_KEY = 'wordlog_speech_scores';
  const LEARNSET_KEY = 'wordlog_learn_sets';
  const LEARNSET_SIZE = 10;
  // Two from each of the five lists, which is what makes 10. Kept as its
  // own number so the arithmetic is stated rather than implied.
  const PER_TOPIC = 2;
  // Spaced-repetition ladder, in minutes until the next review: just seen,
  // 10 min, 1 hour, 1 day, 3 days, 7 days. A correct answer promotes a word
  // one step; a miss drops it back to step 0. "Mastered" means it survived
  // the full climb to the last step, not just two lucky answers in a row --
  // and if it resurfaces after that week-long gap and gets missed, it drops
  // back to learning, since that means it was not actually retained.
  const SRS_STEP_MINUTES = [0, 10, 60, 1440, 4320, 10080];
  const SRS_MASTER_STEP = SRS_STEP_MINUTES.length - 1;
  const canSpeak = ('speechSynthesis' in window);
  let lastAutoSpokenId = null;

  let customWords = []; // words added in-app, same shape as spreadsheet words; also pushed into WORDS
  let myList = []; // word ids hand-picked to study as a fixed set, up to MYLIST_MAX
  let speechScores = {}; // word id -> best pronunciation score reached for that word's example sentence
  let coachResults = []; // this session's Speech Coach scores: {id, w, phrase, score}
  let learnSets = {}; // category -> {wordIds:[...], startedAt} -- a locked set worked until all are mastered
  let scRecognizing = false; // Speech Coach's mic state
  let scRecognizer = null;   // one recognizer, reused for every card
  let scToken = 0;           // bumped whenever a card is left or restarted
  let scStatus = null; // transient status text shown under the phrase card
  let scResult = null; // {score, diffHtml, transcript} for the current card, or null
  let progress = {};
  let meta = {history:[], streak:{current:0, longest:0, lastDate:null}};
  let sessionLength = 25;
  let interactionMode = 'recognize'; // home toggle: 'recognize' | 'typed'
  let session = [];
  let sIndex = 0;
  let sessionKind = 'practice'; // 'practice' | 'test'
  let sessionLabel = '';
  let activeMode = 'recognize'; // mode actually running this session
  let returnTo = null; // {run, label} set when a session was started from the word browser or search, so summary can return there
  let activePassScope = null; // set to 'Mixed' or a category name during a Complete-length session, for resume tracking
  let learnMode = false; // Learn-a-set sessions pick each card's mode themselves instead of using the home toggle
  let learnCardMode = null; // the stage chosen for the card on screen, held steady while it is shown
  let revealed = false;
  let typedChecked = false;
  let lastCheckCorrect = false;
  let results = [];
  // A miss requeues the word a few cards later in the same session instead
  // of repeating it back-to-back -- spaced repetition works even within one
  // sitting, unlike massed drilling which mostly just tests short-term
  // memory. Tracks how many times each word has already been requeued this
  // session, so a stubborn word gets extra spaced chances (capped) while an
  // easy slip only costs one.
  const MAX_RETRY_REINSERTS = 4;
  let sessionRetryCounts = {};

  // fast mode
  const FAST_TIMINGS = {
    relaxed: {front:2200, back:4200},
    normal:  {front:1500, back:3000},
    rapid:   {front:1000, back:2000}
  };
  let fastSpeed = 'normal';
  let fastPhase = 'front'; // 'front' | 'back'
  let fastPaused = false;
  let fastTimerHandle = null;

  // Shared speech-recognition feature detection, used by Speech Coach --
  // only exposed where the browser actually supports it (Chrome desktop
  // and Android both do).
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canListen = !!SpeechRecognitionCtor;

  // --- Microphone permission: asked once, not once per word --------------
  // The Web Speech API's own prompt is per-use, so every new recognizer
  // could bring it back. getUserMedia is the one that asks for a lasting
  // grant, so the first speaking card goes through it, releases the mic
  // straight away, and every card after that starts listening in silence.
  // The stored flag only skips the check -- the browser stays the real
  // authority, and a refusal clears it again.
  const MIC_KEY = 'wordlog_mic_ok';
  let micGranted = false;
  try{ micGranted = localStorage.getItem(MIC_KEY) === '1'; }catch(e){}
  let micRequest = null; // in flight, so two quick taps cannot ask twice

  // file:// and plain http have nowhere to remember a grant, so there the
  // browser will keep asking whatever we do. Worth saying out loud.
  const micCanPersist = window.isSecureContext === true;

  function setMicGranted(ok){
    micGranted = ok;
    try{
      if(ok) localStorage.setItem(MIC_KEY, '1');
      else localStorage.removeItem(MIC_KEY);
    }catch(e){}
  }

  function ensureMic(){
    if(micGranted) return Promise.resolve(true);
    if(micRequest) return micRequest;
    const media = navigator.mediaDevices;
    if(!media || !media.getUserMedia){
      // Nothing to pre-ask with; let the speech API handle it as before.
      micGranted = true;
      return Promise.resolve(true);
    }
    const asked = (navigator.permissions && navigator.permissions.query)
      ? navigator.permissions.query({name:'microphone'}).catch(()=>null)
      : Promise.resolve(null);
    micRequest = asked
      .then(status=>{
        // Already allowed from a previous visit: no prompt at all.
        if(status && status.state === 'granted') return null;
        return media.getUserMedia({audio:true});
      })
      .then(stream=>{
        if(stream) stream.getTracks().forEach(t=>t.stop()); // only wanted the grant
        setMicGranted(true);
        micRequest = null;
        return true;
      })
      .catch(()=>{ micRequest = null; return false; });
    return micRequest;
  }

  const root = document.getElementById('app');
  const el = sel => root.querySelector(sel);

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ progress = JSON.parse(raw); }
    }catch(e){ progress = {}; }
    migrateProgressToSRS();
  }

  // One-time upgrade for progress saved before spaced repetition existed.
  // Old entries have a status but no step/due; credit past mastery without
  // fully trusting it -- a mastered word starts one step below the top, and
  // since due is left unset it counts as due right away, so the very next
  // review re-confirms it under the new system instead of assuming forever.
  function migrateProgressToSRS(){
    let changed = false;
    Object.keys(progress).forEach(id=>{
      const p = progress[id];
      if(p && p.step === undefined){
        if(p.status==='mastered') p.step = SRS_MASTER_STEP - 1;
        else if(p.status==='learning') p.step = (p.correct>=1) ? 1 : 0;
        else p.step = 0;
        changed = true;
      }
    });
    if(changed) saveProgress();
  }
  // Anything written locally should make its way over shortly after.
  function saveProgress(){
    syncSoon();
    saveProgressLocal();
  }

  function saveProgressLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
  }

  function loadMeta(){
    try{
      const raw = localStorage.getItem(META_KEY);
      if(raw){ meta = JSON.parse(raw); }
    }catch(e){}
    if(!meta.history) meta.history = [];
    if(!meta.streak) meta.streak = {current:0, longest:0, lastDate:null};
    if(!meta.passes) meta.passes = {};
  }
  function saveMeta(){
    try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){}
  }

  // Words added in-app live in their own storage key, kept separate from
  // the spreadsheet-derived WORDS array at rest, but merged into WORDS in
  // memory so every existing feature (search, sessions, stats, word lists)
  // picks them up automatically without special-casing.
  function loadCustomWords(){
    try{
      const raw = localStorage.getItem(CUSTOM_KEY);
      if(raw){ customWords = JSON.parse(raw); }
    }catch(e){ customWords = []; }
    if(customWords.length){ WORDS.push.apply(WORDS, customWords); }
  }
  function saveCustomWords(){
    try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(customWords)); }catch(e){}
  }
  function saveSpeechScores(){
    try{ localStorage.setItem(SPEECH_KEY, JSON.stringify(speechScores)); }catch(e){}
  }

  // Mirrors the id scheme build_word_log.py uses: category::word, with a
  // #2/#3 suffix if that exact word already exists in that category, so a
  // duplicate never collides with -- or scrambles progress on -- an existing id.
  function makeWordId(cat, word){
    const base = cat + '::' + word;
    let count = 0;
    WORDS.forEach(w=>{ if(w.id===base || w.id.indexOf(base+'#')===0) count++; });
    return count===0 ? base : base + '#' + (count+1);
  }

  // My list is a hand-picked, fixed set of up to MYLIST_MAX word ids the user
  // chose themselves. Unlike the old auto-picked batching, it never rotates
  // on its own -- the same words come up every time until the user removes
  // or swaps one, which is the point: study exactly this set until it sticks.
  function loadMyList(){
    try{
      const raw = localStorage.getItem(MYLIST_KEY);
      if(raw){ myList = JSON.parse(raw); }
    }catch(e){ myList = []; }
  }
  function saveMyList(){
    try{ localStorage.setItem(MYLIST_KEY, JSON.stringify(myList)); }catch(e){}
  }
  function toggleMyListWord(id){
    const idx = myList.indexOf(id);
    if(idx !== -1){
      myList.splice(idx, 1);
    } else {
      if(myList.length >= MYLIST_MAX) return;
      myList.push(id);
    }
    saveMyList();
  }

  function loadSpeechScores(){
    try{
      const raw = localStorage.getItem(SPEECH_KEY);
      if(raw){ speechScores = JSON.parse(raw); }
    }catch(e){ speechScores = {}; }
  }
  // Keyed by the word's own stable id (category::word), same scheme as
  // everywhere else -- so reordering the spreadsheet never scrambles a
  // speaking score, just like it never scrambles mastery progress.
  function saveSpeechScore(wordId, score){
    if(speechScores[wordId]===undefined || score>speechScores[wordId]){
      speechScores[wordId] = score;
      try{ localStorage.setItem(SPEECH_KEY, JSON.stringify(speechScores)); }catch(e){}
    }
  }

  function loadLearnSets(){
    try{
      const raw = localStorage.getItem(LEARNSET_KEY);
      if(raw){ learnSets = JSON.parse(raw); }
    }catch(e){ learnSets = {}; }
  }
  function saveLearnSets(){
    try{ localStorage.setItem(LEARNSET_KEY, JSON.stringify(learnSets)); }catch(e){}
  }

  // Today's set. There is no topic to choose any more: every day the app
  // puts LEARNSET_SIZE words in front of you, PER_TOPIC from each list,
  // so every list moves forward together instead of one racing ahead.
  //
  // Anything you did not finish yesterday comes first, so a word is never
  // quietly abandoned half-learnt, and the rest is topped up. The set
  // stays LEARNSET_SIZE either way -- carrying leftovers forward *and*
  // adding a full batch would grow it without end.
  //
  // Carried words already occupy slots, so the top-up goes to whichever
  // list has the fewest words in today's set, over and over. That keeps
  // the balance as even as the leftovers allow, and a list that has run
  // out simply yields its slots to the others rather than shrinking the
  // set.
  function buildDailySet(){
    const carried = (getDailySet() || []).filter(w=>statusOf(w.id)!=='mastered');
    const picks = carried.slice();

    const taken = {};
    picks.forEach(w=>{ taken[w.id] = true; });

    const inSet = {};
    CATEGORIES.forEach(c=>{ inSet[c] = 0; });
    picks.forEach(w=>{ if(inSet[w.cat] !== undefined) inSet[w.cat]++; });

    // weakest-first within each list, so the top-up takes the words most
    // in need from whichever list is behind
    const pools = {};
    CATEGORIES.forEach(c=>{
      pools[c] = sortByPriority(WORDS.filter(w=>
        w.cat === c && !taken[w.id] && statusOf(w.id) !== 'mastered'));
    });

    while(picks.length < LEARNSET_SIZE){
      // the list with the least representation so far that still has words
      let next = null;
      CATEGORIES.forEach(c=>{
        if(!pools[c].length) return;
        if(next === null || inSet[c] < inSet[next]) next = c;
      });
      if(next === null) break; // every list exhausted
      const w = pools[next].shift();
      picks.push(w);
      taken[w.id] = true;
      inSet[next]++;
    }
    learnSets.daily = {
      wordIds: picks.map(w=>w.id),
      day: todayStr(),
      startedAt: new Date().toISOString()
    };
    saveLearnSets();
    return picks;
  }

  // Today's set as word objects, or null when today has none yet. A set
  // built on an earlier day is still returned -- todaysSet() decides when
  // to roll it over, so the words stay visible until that happens.
  function getDailySet(){
    const info = learnSets.daily;
    if(!info || !info.wordIds || !info.wordIds.length) return null;
    const words = info.wordIds.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);
    return words.length ? words : null;
  }

  function dailySetDay(){
    return (learnSets.daily && learnSets.daily.day) || null;
  }

  // The set to work on right now, rolled over when the date has changed.
  function todaysSet(){
    if(dailySetDay() !== todayStr()) return buildDailySet();
    return getDailySet() || buildDailySet();
  }

  // Learn-a-set walks each word through the same stages: meet it in
  // Recognize, produce it from memory in Type it, use it in context with
  // Sentence, then say it out loud in Speech Coach. Checked in order, so a
  // missed word (step back to 0) drops to Recognize for a rep before
  // climbing again, while a stage already passed is never repeated.
  // Reaching mastered takes five correct answers in a row, so every stage
  // is met on the way up. Speaking is skipped where the browser has no
  // speech recognition, rather than leaving the word stuck there.
  const LEARN_STAGES = {
    recognize:'Recognize', typed:'Type it', sentence:'Sentence', coach:'Say it'
  };
  const LEARN_ORDER = ['recognize', 'typed', 'sentence', 'coach'];
  function learnStageFor(w){
    const p = progress[w.id];
    if(!p || !p.seen || !p.step) return 'recognize';
    if(!p.typedOnce) return 'typed';
    if(!p.sentOnce) return 'sentence';
    if(canListen && !p.spokeOnce) return 'coach';
    return 'sentence'; // keep using it in context for the remaining reps
  }

  // Every stage a word must clear before it can be called mastered.
  // Speaking is part of it now, except where the browser cannot listen at
  // all -- there it is dropped rather than leaving the word unmasterable.
  function stagesCleared(p){
    if(!p) return false;
    if(!p.typedOnce || !p.sentOnce) return false;
    return canListen ? !!p.spokeOnce : true;
  }
  function learnStageRank(w){
    return LEARN_ORDER.indexOf(learnStageFor(w));
  }

  // Words already taken to mastered whose spaced-repetition interval has
  // come round again. Moving on to a new set should not mean forgetting the
  // last one, so these are offered for review and, being mastered, are
  // handed the later practice stages automatically.
  function dueForReview(list, limit){
    const now = Date.now();
    const due = list.filter(w=>{
      const p = progress[w.id];
      if(!p || !p.seen || statusOf(w.id)!=='mastered') return false;
      return p.due ? new Date(p.due).getTime() <= now : true;
    });
    due.sort((a,b)=>{
      const da = progress[a.id].due ? new Date(progress[a.id].due).getTime() : 0;
      const db = progress[b.id].due ? new Date(progress[b.id].due).getTime() : 0;
      return da - db; // longest overdue first
    });
    return limit ? due.slice(0, limit) : due;
  }

  // The reminder: one line that only appears when finished words have come
  // due again. Tapping it starts them in learn mode, so learnStageFor hands
  // each word the stage it needs -- type it, sentence or say it -- and
  // there is nothing to choose.
  function recallHtml(due){
    if(!due.length) return '';
    const names = due.slice(0,3).map(w=>w.w).join(', ');
    const more = due.length>3 ? ' and '+(due.length-3)+' more' : '';
    return '<button class="recall-bar" id="recall-due">'
      + 'Don&rsquo;t forget &middot; '+due.length+' word'+(due.length===1?'':'s')+' to refresh'
      + '<small>'+esc(names)+more+'. You mastered these earlier and they are due again. '
      + 'The app picks the method for each one.</small>'
      + '</button>';
  }
  function wireRecall(due, label, back){
    const btn = el('#recall-due');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      startSession(due, label, true);
      returnTo = back;
    });
  }

  function todayStr(d){
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function friendlyDate(dateStr){
    const today = todayStr();
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    const yesterday = todayStr(yd);
    if(dateStr===today) return 'Today';
    if(dateStr===yesterday) return 'Yesterday';
    const parts = dateStr.split('-').map(Number);
    const dt = new Date(parts[0], parts[1]-1, parts[2]);
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }

  function recordSession(kind, label, total, correct){
    const today = todayStr();
    meta.history.unshift({date:today, kind:kind, mode:label, total:total, correct:correct});
    if(meta.history.length>300) meta.history = meta.history.slice(0,300);

    if(meta.streak.lastDate !== today){
      const yd = new Date(); yd.setDate(yd.getDate()-1);
      if(meta.streak.lastDate === todayStr(yd)){
        meta.streak.current = (meta.streak.current||0)+1;
      } else {
        meta.streak.current = 1;
      }
      meta.streak.lastDate = today;
    }
    meta.streak.longest = Math.max(meta.streak.longest||0, meta.streak.current);
    saveMeta();
  }

  function statusOf(id){ const p = progress[id]; return p ? p.status : 'new'; }

  function computeStats(list){
    let good=0, warn=0, neu=0;
    list.forEach(w=>{
      const s = statusOf(w.id);
      if(s==='mastered') good++; else if(s==='learning') warn++; else neu++;
    });
    return {good, warn, neu, total:list.length};
  }

  function wordPercent(id){
    const p = progress[id];
    if(!p || !p.seen) return null; // never attempted -- distinct from a low score
    return Math.round((p.correct / p.seen) * 100);
  }

  // Lower score = more urgent to study next. Sessions sort ascending and take
  // the front of the list, so: never-seen words sort first (always worth
  // introducing), then whatever has the lowest accuracy so far -- your
  // weakest words lead, gradually scaling up toward the words you already
  // know well. A word answered in the last few minutes is pushed to the
  // very back regardless, so it cannot immediately repeat within the same
  // short study burst. This governs which words get pulled into a session
  // and in what order; SRS_STEP_MINUTES/p.due still separately govern when
  // a word counts as genuinely mastered (see recordResult).
  function priorityScore(w){
    // Speech Coach tracks a different skill (pronunciation of the example
    // sentence), so its "weakest first" uses its own scores: never-spoken
    // words lead, then lowest best-score.
    if(interactionMode==='coach'){
      const s = speechScores[w.id];
      return s===undefined ? -Infinity : s;
    }
    const p = progress[w.id];
    if(!p || !p.seen) return -Infinity;
    if(p.lastSeen){
      const minsAgo = (Date.now() - new Date(p.lastSeen).getTime()) / 60000;
      if(minsAgo >= 0 && minsAgo < 8) return Infinity;
    }
    return p.correct / p.seen;
  }

  function sortByPriority(list){
    return list.slice().sort((a,b)=> priorityScore(a)-priorityScore(b) || (Math.random()-0.5));
  }

  // Interleaves already priority-sorted per-category lists round-robin, so a
  // mixed session still front-loads new/weak words overall (each category
  // contributes its weakest first) without clumping into category-sized
  // blocks -- cards from different topics keep mixing together.
  function interleaveByCategory(words){
    const byCat = {};
    const order = [];
    words.forEach(w=>{
      if(!byCat[w.cat]){ byCat[w.cat] = []; order.push(w.cat); }
      byCat[w.cat].push(w);
    });
    const result = [];
    let remaining = true;
    while(remaining){
      remaining = false;
      order.forEach(c=>{
        if(byCat[c].length){ result.push(byCat[c].shift()); remaining = true; }
      });
    }
    return result;
  }

  function speak(text){
    if(!canSpeak) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function escapeRegExp(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Finds a meaning whose stored example sentence literally contains the
  // headword (case-insensitive), and returns that sentence with the word
  // blanked out. Many examples use an inflected form instead ("wrote" for
  // "Write down"), which will not match here -- that is intentional: rather
  // than guess at word forms, those words simply are not offered as a
  // sentence-completion card, and the session falls back to Type it for them.
  // The example does not always spell the word the same way the headword
  // does -- "Endanger" appears as "endangers", "To hatch" as "hatch". The
  // build step ships those variants in w.alt, so a card can still be made;
  // the form actually blanked out is returned so the answer check can
  // accept it as well as the headword.
  function findClozeExample(w){
    const candidates = [w.w].concat(w.alt || []);
    for(let i=0;i<w.me.length;i++){
      const m = w.me[i];
      if(!m.e) continue;
      for(let c=0;c<candidates.length;c++){
        const re = new RegExp('\\b'+escapeRegExp(candidates[c])+'\\b', 'i');
        const hit = m.e.match(re);
        if(hit){
          return { meaning: m, blanked: m.e.replace(re, '_____'), answer: hit[0] };
        }
      }
    }
    return null;
  }

  function speechErrorMessage(code){
    if(code==='not-allowed' || code==='service-not-allowed') return 'Microphone blocked. Tap the padlock in the address bar, set Microphone to Allow, then reload -- it will not ask again after that.';
    if(code==='no-speech') return 'Did not catch that -- tap the mic and try again.';
    if(code==='audio-capture') return 'No microphone found on this device.';
    return 'Could not use the microphone right now. Try again, or switch to Type it.';
  }

  // --- Speech Coach: full-phrase speaking practice ---

  function scNormalizeWord(w){
    // Strips apostrophes too, not just punctuation -- speech recognition is
    // inconsistent about contractions (it may transcribe "I'm" as "im"),
    // and the phrase bank is full of them ("I'm", "I'd", "doesn't"...), so
    // keeping the apostrophe would unfairly mark correctly spoken words as missed.
    return w.toLowerCase().replace(/[^a-z0-9]/g, '');
  }
  function scTokenize(text){
    return text.split(/\s+/).filter(Boolean);
  }

  // Longest-common-subsequence alignment between the target phrase and what
  // was actually heard, so a skipped or reordered word costs only that word
  // instead of failing the whole phrase -- partial credit, not exact match.
  function scAlignPhrase(targetWords, spokenWords){
    const t = targetWords.map(scNormalizeWord);
    const s = spokenWords.map(scNormalizeWord);
    const n = t.length, m = s.length;
    const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
    for(let i=1;i<=n;i++){
      for(let j=1;j<=m;j++){
        if(t[i-1] && t[i-1]===s[j-1]) dp[i][j] = dp[i-1][j-1]+1;
        else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
    const matched = new Array(n).fill(false);
    let i=n, j=m;
    while(i>0 && j>0){
      if(t[i-1] && t[i-1]===s[j-1]){ matched[i-1]=true; i--; j--; }
      else if(dp[i-1][j] >= dp[i][j-1]) i--;
      else j--;
    }
    return { matched, matchCount: dp[n][m] };
  }

  // Speech Coach phrases come from your own vocabulary's example sentences
  // instead of a fixed script, grouped by the app's existing categories --
  // every word already has a stored example (confirmed clean in an earlier
  // data check), so no filtering-out is needed beyond "does it have one".
  function getSpeechPhraseForWord(w){
    for(let i=0;i<w.me.length;i++){
      if(w.me[i].e) return w.me[i].e;
    }
    return null;
  }

  // A word with no stored example still gets a card: you just say the word.
  function coachPhraseFor(w){
    return getSpeechPhraseForWord(w) || w.w;
  }

  function scScorePhrase(phrase, transcript){
    const targetWords = scTokenize(phrase);
    const spokenWords = scTokenize(transcript);
    const { matched, matchCount } = scAlignPhrase(targetWords, spokenWords);
    const score = targetWords.length ? Math.round((matchCount/targetWords.length)*100) : 0;
    const diffHtml = targetWords.map((word,idx)=>
      '<span class="'+(matched[idx]?'ok':'miss')+'">'+esc(word)+'</span>'
    ).join(' ');
    return { score, diffHtml, transcript };
  }

  function scResetCard(){
    scStopListening();
    scStatus = null;
    scResult = null;
  }

  function scStopListening(){
    scToken++; // anything still in flight belongs to a card we have left
    if(scRecognizer && scRecognizing){
      try{ scRecognizer.abort(); }catch(e){}
    }
    scRecognizing = false;
  }

  // One recognizer for the whole app, built the first time it is needed and
  // reused card after card. A new instance per card is what made Chrome
  // re-arm its microphone bubble every word; scToken now does the job the
  // old per-card identity check did, so a late callback from a card you
  // have already left is still ignored.
  function scGetRecognizer(){
    if(!scRecognizer){
      scRecognizer = new SpeechRecognitionCtor();
      scRecognizer.lang = 'en-US';
      scRecognizer.interimResults = false;
      scRecognizer.maxAlternatives = 1;
    }
    return scRecognizer;
  }

  // Runs inside a normal practice session: scores the current card's
  // sentence and records it both as the word's best speech score and in
  // this session's coachResults for the end-of-session summary.
  function scStartListening(){
    if(!canListen) return;
    const w = session[sIndex];
    const phrase = coachPhraseFor(w);
    scStopListening();
    scResult = null;
    scRecognizing = true;
    const token = ++scToken;
    // Only the very first card can stall here, and only long enough to
    // answer the browser once.
    scStatus = micGranted ? null : 'Allow the microphone once and it will not ask again.';
    renderSession();

    ensureMic().then(ok=>{
      if(scToken !== token) return;
      if(!ok){
        scRecognizing = false;
        scStatus = speechErrorMessage('not-allowed');
        renderSession();
        return;
      }
      if(scStatus){ scStatus = null; renderSession(); }
      scListen(w, phrase, token);
    });
  }

  function scListen(w, phrase, token, isRetry){
    const recognition = scGetRecognizer();

    recognition.onresult = (e)=>{
      if(scToken !== token) return;
      const transcript = e.results[0][0].transcript;
      scRecognizing = false;
      scResult = scScorePhrase(phrase, transcript);
      saveSpeechScore(w.id, scResult.score);
      coachResults = coachResults.filter(r=>r.id!==w.id);
      coachResults.push({ id:w.id, w:w.w, phrase, score:scResult.score });
      // Inside Learn-a-set the spoken card has to move the word along like
      // any other stage, otherwise it would sit here forever. Anything from
      // "good, keep practicing" upward counts as getting it right.
      if(learnMode) recordResult(scResult.score >= 60);
      renderSession();
    };
    recognition.onerror = (e)=>{
      if(scToken !== token) return;
      const code = e.error || 'error';
      // Permission was withdrawn in browser settings: forget the shortcut
      // so the next attempt asks properly instead of failing silently.
      if(code==='not-allowed' || code==='service-not-allowed') setMicGranted(false);
      scRecognizing = false;
      scStatus = speechErrorMessage(code);
      renderSession();
    };
    recognition.onend = ()=>{
      if(scToken !== token) return;
      if(scRecognizing){
        scRecognizing = false;
        scStatus = speechErrorMessage('no-speech');
        renderSession();
      }
    };

    // The recognizer needs a moment between an abort and the next start, or
    // it throws; the Listening state is already on screen meanwhile.
    setTimeout(()=>{
      if(scToken !== token) return;
      try{
        recognition.start();
      }catch(e){
        // Almost always "already started", from a card left in a hurry. The
        // instance is past saving, so drop it and go round once more with a
        // fresh one -- the permission is granted by now, so no prompt.
        try{ recognition.abort(); }catch(e2){}
        scRecognizer = null;
        if(isRetry){
          scRecognizing = false;
          scStatus = speechErrorMessage('error');
          renderSession();
          return;
        }
        setTimeout(()=>{
          if(scToken !== token) return;
          scListen(w, phrase, token, true);
        }, 250);
      }
    }, 250);
  }

  function buildMixedSession(size){
    if(size === 'all'){
      return interleaveByCategory(sortByPriority(WORDS));
    }
    const byCat = {};
    CATEGORIES.forEach(c=>byCat[c]=sortByPriority(WORDS.filter(w=>w.cat===c)));
    const perCat = Math.max(1, Math.floor(size/CATEGORIES.length));
    let picks = [];
    CATEGORIES.forEach(c=>{
      picks = picks.concat(byCat[c].slice(0, perCat));
    });
    if(picks.length < size){
      const rest = sortByPriority(WORDS.filter(w=>!picks.includes(w)));
      picks = picks.concat(rest.slice(0, size-picks.length));
    }
    return interleaveByCategory(picks.slice(0,size));
  }

  function buildCategorySession(cat, size){
    const catWords = WORDS.filter(w=>w.cat===cat);
    if(size === 'all'){
      return sortByPriority(catWords);
    }
    return sortByPriority(catWords).slice(0, Math.min(size, catWords.length));
  }

  // Tracks progress through a Complete-length session that may span multiple
  // sittings (exit, come back hours later). Kept separate per scope ('Mixed'
  // or a category name) in meta.passes, independent of word-mastery progress.
  function buildCompletePass(scope, allWords){
    if(!meta.passes) meta.passes = {};
    const info = meta.passes[scope];
    const hasIncomplete = info && info.covered && info.covered.length > 0 && info.covered.length < allWords.length;
    if(hasIncomplete){
      const coveredSet = {};
      info.covered.forEach(id => coveredSet[id] = true);
      const remaining = allWords.filter(w => !coveredSet[w.id]);
      return { words: interleaveByCategory(sortByPriority(remaining)), continuing: true };
    }
    meta.passes[scope] = {covered: []};
    saveMeta();
    return { words: interleaveByCategory(sortByPriority(allWords)), continuing: false };
  }

  function markPassCovered(scope, wordId){
    if(!scope) return;
    if(!meta.passes) meta.passes = {};
    if(!meta.passes[scope]) meta.passes[scope] = {covered: []};
    if(meta.passes[scope].covered.indexOf(wordId) === -1){
      meta.passes[scope].covered.push(wordId);
      saveMeta();
    }
  }

  function buildTestSession(size){
    const arr = WORDS.slice();
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr.slice(0, Math.min(size, arr.length));
  }

  function startSession(list, label, learn){
    session = list; sIndex = 0; revealed = false; typedChecked = false; results = [];
    sessionRetryCounts = {};
    coachResults = []; scResetCard();
    learnMode = !!learn;
    learnCardMode = null;
    sessionKind = 'practice';
    sessionLabel = label;
    activeMode = learnMode ? learnStageFor(list[0]) : interactionMode;
    fastPhase = 'front'; fastPaused = false; clearFastTimer();
    returnTo = null;
    activePassScope = null;
    renderSession();
  }

  function startTest(){
    session = buildTestSession(20); sIndex = 0; revealed = false; typedChecked = false; results = [];
    sessionRetryCounts = {};
    learnMode = false;
    sessionKind = 'test';
    sessionLabel = 'Test';
    activeMode = 'typed';
    fastPhase = 'front'; fastPaused = false; clearFastTimer();
    returnTo = null;
    activePassScope = null;
    renderSession();
  }

  function normalizeAnswer(s){
    return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
  }

  function checkTyped(){
    const input = el('#type-input');
    if(!input) return;
    const w = session[sIndex];
    const typed = normalizeAnswer(input.value);
    let correct = typed === normalizeAnswer(w.w);
    // In a sentence card the blank may hold an inflected form ("endangers").
    // Either that or the headword is a fair answer.
    if(!correct && activeMode==='sentence'){
      const cloze = findClozeExample(w);
      if(cloze && cloze.answer) correct = typed === normalizeAnswer(cloze.answer);
    }
    lastCheckCorrect = correct;
    typedChecked = true;
    recordResult(correct);
    renderSession();
  }

  function recordResult(correct){
    const w = session[sIndex];
    const p = progress[w.id] || {status:'new', seen:0, correct:0, step:0, typedOnce:false};
    p.seen = (p.seen||0)+1;
    // Recognize mode is self-rated -- "Got it" is honest but not proof you
    // could actually produce the word. Typing it or completing it in a
    // sentence demands real recall (and Test shares the typed UI), so a
    // word can only reach the top, fully-mastered step once one of those
    // has happened at least once; until then, correct Recognize answers
    // can carry it right up to one step below mastered, but no further.
    // Math.max keeps this from ever demoting a step reached before this
    // rule existed.
    if((activeMode==='typed' || activeMode==='sentence') && correct) p.typedOnce = true;
    // which stages this word has cleared, so Learn-a-set can move it on
    if(activeMode==='sentence' && correct) p.sentOnce = true;
    if(activeMode==='coach' && correct) p.spokeOnce = true;
    if(correct){
      p.correct = (p.correct||0)+1;
      // A word only reaches the top step once it has been recognised,
      // typed, used in a sentence and said out loud. Until then correct
      // answers carry it to one step below mastered and no further.
      const ceiling = stagesCleared(p) ? SRS_MASTER_STEP : SRS_MASTER_STEP - 1;
      p.step = Math.max(p.step||0, Math.min((p.step||0)+1, ceiling));
    } else {
      p.step = 0;
    }
    p.status = (p.step>=SRS_MASTER_STEP) ? 'mastered' : 'learning';
    p.due = new Date(Date.now() + SRS_STEP_MINUTES[p.step]*60000).toISOString();
    p.lastSeen = new Date().toISOString();
    progress[w.id]=p;
    results.push({id:w.id, w:w.w, correct});
    saveProgress();

    if(!correct && sessionKind!=='test'){
      const n = sessionRetryCounts[w.id] || 0;
      if(n < MAX_RETRY_REINSERTS){
        sessionRetryCounts[w.id] = n+1;
        const gap = 3 + n; // space it a little further out each repeat miss
        session.splice(Math.min(sIndex+gap, session.length), 0, w);
      }
    }
  }

  // Summary stats use each word's LATEST result this session, not every
  // attempt -- a word missed once but nailed on a same-session retry should
  // read as learned, not linger in the follow-up list from its first slip.
  function latestResults(){
    const byId = new Map();
    results.forEach(r=> byId.set(r.id, r));
    return Array.from(byId.values());
  }

  function advance(){
    if(activePassScope){ markPassCovered(activePassScope, session[sIndex].id); }
    scResetCard();
    learnCardMode = null; // next card picks its own stage
    sIndex++; revealed=false; typedChecked=false; fastPhase='front';
    if(sIndex>=session.length){
      clearFastTimer();
      let correctCount;
      if(activeMode==='fast') correctCount = null;
      else if(activeMode==='coach' && !learnMode) correctCount = coachResults.filter(r=>r.score>=60).length;
      else correctCount = latestResults().filter(r=>r.correct).length;
      recordSession(sessionKind, sessionLabel, session.length, correctCount);
      renderSummary();
    } else {
      renderSession();
    }
  }

  // --- Keep them fresh -------------------------------------------------
  // A mastered word is the easiest kind to lose: nothing brings it back
  // until its review falls due, which can be a week away. This block puts
  // one in front of you and changes it on its own, so finished words keep
  // crossing your eyes between sessions. It is exposure, not testing --
  // the reminder bar above still handles the words actually due.
  const FRESH_MS = 7000;
  let freshTimer = null;
  let freshIndex = 0;
  let freshPaused = false;

  function clearFreshTimer(){
    if(freshTimer){ clearTimeout(freshTimer); freshTimer = null; }
  }

  // Mastered words, the ones closest to falling due first, so the block
  // spends its time on whatever is nearest to slipping.
  function freshPool(){
    const list = WORDS.filter(w=>statusOf(w.id)==='mastered');
    list.sort((a,b)=>{
      const pa = progress[a.id] || {}, pb = progress[b.id] || {};
      const da = pa.due ? new Date(pa.due).getTime() : 0;
      const db = pb.due ? new Date(pb.due).getTime() : 0;
      return da - db;
    });
    return list;
  }

  function freshBlockHtml(pool){
    if(!pool.length) return '';
    return '<div class="fresh-block">'
      + '<div class="fresh-head"><span>Keep them fresh</span>'
        + '<span class="fresh-count" id="fresh-count"></span></div>'
      + '<div class="fresh-word" id="fresh-word"></div>'
      + '<div class="fresh-pron" id="fresh-pron"></div>'
      + '<div class="fresh-mean" id="fresh-mean"></div>'
      + '<div class="fresh-ex" id="fresh-ex"></div>'
      + '<div class="fresh-tick"><span id="fresh-tick-fill"></span></div>'
      + '<div class="fresh-actions">'
        + '<button class="fresh-btn" id="fresh-prev" aria-label="Previous word">&lsaquo;</button>'
        + '<button class="fresh-btn" id="fresh-play" aria-label="Pause or resume"></button>'
        + '<button class="fresh-btn" id="fresh-next" aria-label="Next word">&rsaquo;</button>'
        + '<button class="fresh-practice" id="fresh-practice">Practice this one &rarr;</button>'
      + '</div>'
      + '</div>';
  }

  // Stepping back past the first word makes freshIndex negative, and a
  // negative remainder is still negative in JavaScript, so the wrap is
  // done here and both callers use it.
  function freshAt(pool){
    return ((freshIndex % pool.length) + pool.length) % pool.length;
  }

  function paintFresh(pool){
    // Leaving the home screen wipes these nodes; that is the signal to
    // stop, since nothing else tells the timer the view has gone.
    const wordEl = el('#fresh-word');
    if(!wordEl || !pool.length){ clearFreshTimer(); return false; }

    const at = freshAt(pool);
    const w = pool[at];
    const m = w.me[0] || {};
    el('#fresh-count').textContent = (at + 1) + ' / ' + pool.length;
    wordEl.textContent = w.w;
    const pron = el('#fresh-pron');
    pron.textContent = w.p ? '/' + w.p + '/' : '';
    pron.style.display = w.p ? '' : 'none';
    el('#fresh-mean').textContent = m.m || '';
    const ex = el('#fresh-ex');
    ex.textContent = m.e ? '“' + m.e + '”' : '';
    ex.style.display = m.e ? '' : 'none';
    el('#fresh-play').innerHTML = freshPaused ? ICON_PLAY : ICON_PAUSE;

    // Restart the sliver by replacing the node -- re-adding the class
    // alone would not retrigger the animation. The clone carries the old
    // class attribute with it, so paused has to take 'run' back off or
    // the bar would go on filling while nothing was moving.
    const tick = el('#fresh-tick-fill');
    const fresh = tick.cloneNode(false);
    fresh.style.animationDuration = (FRESH_MS/1000) + 's';
    fresh.classList.toggle('run', !freshPaused);
    tick.parentNode.replaceChild(fresh, tick);
    return true;
  }

  function scheduleFresh(pool){
    clearFreshTimer();
    if(freshPaused) return;
    freshTimer = setTimeout(()=>{
      freshTimer = null;
      freshIndex++;
      if(paintFresh(pool)) scheduleFresh(pool);
    }, FRESH_MS);
  }

  function startFresh(pool){
    clearFreshTimer();
    if(!pool.length) return;
    if(paintFresh(pool)) scheduleFresh(pool);
  }

  function wireFresh(pool){
    if(!pool.length) return;
    const step = n => { freshIndex += n; if(paintFresh(pool)) scheduleFresh(pool); };
    el('#fresh-prev').addEventListener('click', ()=>step(-1));
    el('#fresh-next').addEventListener('click', ()=>step(1));
    el('#fresh-play').addEventListener('click', ()=>{
      freshPaused = !freshPaused;
      if(paintFresh(pool)) scheduleFresh(pool);
    });
    el('#fresh-practice').addEventListener('click', ()=>{
      const w = pool[freshAt(pool)];
      clearFreshTimer();
      startSession([w], 'Keeping ' + w.w + ' fresh', true);
      returnTo = null; // straight back home afterwards
    });
  }

  function clearFastTimer(){
    if(fastTimerHandle){ clearTimeout(fastTimerHandle); fastTimerHandle = null; }
  }

  function scheduleFastStep(){
    clearFastTimer();
    if(fastPaused) return;
    const dur = FAST_TIMINGS[fastSpeed][fastPhase];
    fastTimerHandle = setTimeout(()=>{
      fastTimerHandle = null;
      if(fastPaused) return;
      if(fastPhase==='front'){
        fastPhase = 'back';
        renderSession();
      } else {
        advance();
      }
    }, dur);
  }

  function toggleFastPause(){
    fastPaused = !fastPaused;
    if(fastPaused){ clearFastTimer(); } else { scheduleFastStep(); }
    renderSession();
  }

  function exitSession(){
    clearFastTimer();
    scResetCard();
    renderHome();
  }

  function skipFastCard(){
    clearFastTimer();
    advance();
  }

  function animateFastBar(){
    const bar = el('#fast-bar-fill');
    if(!bar || fastPaused) return;
    const dur = FAST_TIMINGS[fastSpeed][fastPhase];
    requestAnimationFrame(()=>{
      bar.style.transition = 'width '+dur+'ms linear';
      bar.style.width = '100%';
    });
  }

  function askAboutWord(w){
    const meaningsText = w.me.map(m=>m.m).join(' / ');
    const msg = 'Can we go over "'+w.w+'" together? I keep struggling with it ('+meaningsText+'). Can you give me a couple more example sentences and quiz me on it?';
    if(window.sendPrompt) window.sendPrompt(msg);
  }

  function reviewMissedInChat(){
    const missed = latestResults().filter(r=>!r.correct);
    if(missed.length===0){
      const msg = 'I just finished a vocabulary session and got everything right! Can you give me a few harder practice sentences mixing these words: '+session.map(w=>w.w).join(', ')+'?';
      if(window.sendPrompt) window.sendPrompt(msg);
      return;
    }
    const list = missed.map(r=>r.w).join(', ');
    const msg = 'Review these with me in chat, I marked them needs practice in my session: '+list+'. Can you quiz me on them one at a time?';
    if(window.sendPrompt) window.sendPrompt(msg);
  }

  function renderHome(){
    clearFreshTimer(); // this render replaces the block the old timer was painting
    const stats = computeStats(WORDS);
    const catRows = CATEGORIES.map(c=>{
      const list = WORDS.filter(w=>w.cat===c);
      const s = computeStats(list);
      const pct = Math.round((s.good/list.length)*100);
      const pctColor = pct>=60 ? 'var(--good)' : (pct>0 ? 'var(--amber)' : 'var(--text-soft)');
      return '<button class="cat-row" data-cat="'+esc(c)+'">'
        + '<div class="cat-row-top"><span class="cat-name">'+esc(c)+'</span>'
          + '<span class="cat-pct" style="color:'+pctColor+';">'+pct+'%<span class="cat-arrow" style="margin-left:10px;">&rarr;</span></span></div>'
        + '<div class="cat-row-meta">'+list.length+' words &middot; '+s.good+' mastered &middot; '+s.warn+' in progress</div>'
        + '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '</button>';
    }).join('');

    const todaySessions = meta.history.filter(h=>h.date===todayStr());
    const todayCards = todaySessions.reduce((a,h)=>a+(h.total||0),0);
    const todayNote = todaySessions.length
      ? ' <span class="streak-best">&middot; today: '+todaySessions.length+' session'+(todaySessions.length===1?'':'s')+', '+todayCards+' cards</span>'
      : '';
    const streakHtml = meta.streak.current > 0
      ? '<div class="streak-row">'+ICON_FLAME+' '+meta.streak.current+'-day streak <span class="streak-best">&middot; best '+meta.streak.longest+'</span>'+todayNote+'</div>'
      : '<div class="streak-row" style="color:var(--text-soft);">'+ICON_FLAME+' Start a streak today'+todayNote+'</div>';

    const share = n => WORDS.length ? Math.round((n/WORDS.length)*100) : 0;
    const statTiles = [
      ['mastered','Mastered', stats.good, 'good', 'Finished, reviewed on a long gap'],
      ['learning','In progress', stats.warn, 'warn', 'Started, not finished yet'],
      ['new','Not started', stats.neu, 'new', 'Never shown to you yet']
    ].map(([status,label,count,tone,blurb])=>
      '<button class="hstat hstat-'+tone+'" data-status="'+status+'"'+(count?'':' disabled')+'>'
      + '<span class="hstat-label">'+label+'</span>'
      + '<span class="hstat-num">'+count+'</span>'
      + '<span class="hstat-sub">'+(count ? share(count)+'% of all words' : esc(blurb))+'</span>'
      + '<span class="hstat-go">See these words &rarr;</span>'
      + '</button>'
    ).join('');

    const overallPct = WORDS.length ? Math.round((stats.good/WORDS.length)*100) : 0;
    const progressHtml = '<div class="progress-line"><span>Vocabulary mastered</span>'
        + '<span><b>'+stats.good+'</b> of '+WORDS.length+' &middot; <b>'+overallPct+'%</b></span></div>'
      + '<div class="progress-wide"><span style="width:'+overallPct+'%"></span></div>';

    // Words from earlier sets that the schedule says are ready again.
    const homeDue = dueForReview(WORDS, LEARNSET_SIZE);
    // Everything already mastered, for the block that cycles through them.
    const fresh = freshPool();

    // Headline action: today's words. The app chooses them, so there is
    // nothing to pick -- this either starts the day or carries it on.
    const today = todaysSet();
    const todayDone = today.filter(w=>statusOf(w.id)==='mastered').length;
    const todayPct = today.length ? Math.round((todayDone/today.length)*100) : 0;
    const stageList = canListen
      ? 'recognize, type it, sentence, say it'
      : 'recognize, type it, sentence';
    const heroHtml = '<button class="btn-hero" id="learn-set">'
      + (todayDone >= today.length
          ? 'Today is done &middot; practice again'
          : "Today&rsquo;s " + today.length + " words")
      + '<small>'+todayDone+' of '+today.length+' mastered &middot; '+stageList+'</small>'
      + '<div class="hero-bar"><span style="width:'+todayPct+'%"></span></div>'
      + '</button>';

    // Progress comes first now, then today's work, then everything else
    // folded away at the bottom. The two spaces hold the daily work on the
    // left and the words you have finished on the right.
    const topHtml = '<div class="home-top">'
      + progressHtml
      + '<div class="stat-row">'+statTiles+'</div>'
      + '<p class="hint" style="margin:-12px 2px 0;">Tap any box to see those words and practice them.</p>'
      + '<div id="sync-host">'+syncLineHtml()+'</div>'
      + '</div>';

    const doSpace = '<div class="home-col home-col-do">'
      + '<div class="home-col-head"><span>Today</span>'
        + '<span class="home-col-hint">'+LEARNSET_SIZE+' a day &middot; '+PER_TOPIC+' from each list</span></div>'
      + streakHtml
      + recallHtml(homeDue)
      + heroHtml
      + '</div>';

    const seeSpace = '<div class="home-col home-col-see">'
      + '<div class="home-col-head"><span>Keep them fresh</span>'
        + '<span class="home-col-hint"><b>'+stats.good+'</b> mastered so far</span></div>'
      + (fresh.length
          ? freshBlockHtml(fresh)
          : '<p class="hint" style="margin:0 2px;">Nothing mastered yet. Words you finish will show up here, '
            + 'one at a time, so they stay in your head.</p>')
      + '</div>';

    // Topics and the odds and ends live at the end, closed up, so the
    // screen is only what you need to do today.
    const moreHtml = '<details class="home-more">'
      + '<summary>Everything else &middot; topics, your list, history</summary>'
      + '<div class="home-more-body">'
        + '<div class="section-label" style="margin-top:6px;">Work one topic</div>'
        + '<div class="cat-list">'+catRows+'</div>'
        + '<button class="reset-link" id="my-list">Study my list &middot; '+myList.length+'/'+MYLIST_MAX+' &rarr;</button>'
        + '<button class="reset-link" id="add-word">+ Add a new word &rarr;</button>'
        + '<button class="reset-link" id="view-history">View session history &rarr;</button>'
        + '<button class="reset-link" id="browse-topics">Browse words by topic &rarr;</button>'
      + '</div>'
      + '</details>';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Vocabulary &middot; '+WORDS.length+' words</div>'
      + '<h1 class="title">Word Log</h1>'
      + '<p class="subtitle">Every word from your spreadsheet, tracked as you go.</p>'
      + '<input type="text" class="field-input" id="home-search" placeholder="Search a word or meaning..." autocomplete="off" style="margin-bottom:18px;">'
      + topHtml
      + '<div class="home-cols">' + doSpace + seeSpace + '</div>'
      + moreHtml
      + '<div class="divider" style="margin-top:30px;"><span></span></div>'
      + '<button class="reset-link" id="reset-progress" style="margin-top:6px; color:var(--warn);">Reset progress</button>'
      + '</div>';

    const homeSearch = el('#home-search');
    homeSearch.addEventListener('input', ()=> renderSearch(homeSearch.value) );
    homeSearch.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); renderSearch(homeSearch.value); } });
    el('#my-list').addEventListener('click', ()=>renderMyList(''));
    el('#add-word').addEventListener('click', renderAddWord);
    // Always through the topic picker, even with a set underway -- from
    // there you pick the topic, then keep practicing or start a new set.
    el('#learn-set').addEventListener('click', renderDailySet);
    wireRecall(homeDue, 'Refresher', null);
    root.querySelectorAll('.hstat[data-status]').forEach(b=>{
      b.addEventListener('click', ()=>{ if(!b.disabled) renderStatusList(b.dataset.status); });
    });
    el('#view-history').addEventListener('click', renderHistory);
    el('#browse-topics').addEventListener('click', renderTopicPicker);
    wireSyncLine();
    wireFresh(fresh);
    startFresh(fresh);
    root.querySelectorAll('.cat-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const cat = b.dataset.cat;
        if(sessionLength==='all'){
          const catWords = WORDS.filter(w=>w.cat===cat);
          const result = buildCompletePass(cat, catWords);
          startSession(result.words, result.continuing ? (cat+' (remaining)') : cat);
          activePassScope = cat;
        } else {
          startSession(buildCategorySession(cat, sessionLength), cat);
        }
      });
    });
    el('#reset-progress').addEventListener('click', ()=>{
      if(confirm('Clear all saved progress? This cannot be undone.')){
        progress = {}; saveProgress(); renderHome();
      }
    });
  }

  function renderMeanings(w){
    const rows = w.me.map((m,i)=>{
      const exampleHtml = m.e ? (
        '<div class="meaning-example">"'+esc(m.e)+'"'
        + (canSpeak ? '<button class="mini-speak example-speak" data-text="'+esc(m.e)+'" aria-label="Listen to example">'+ICON_SPEAKER+'</button>' : '')
        + '</div>'
      ) : '';
      return '<div class="meaning-row"><span class="meaning-num">'+(i+1)+'</span>'
        + '<div class="meaning-body"><div class="meaning-text">'+esc(m.m)+'</div>'+exampleHtml+'</div></div>';
    }).join('');
    const notes = w.n ? '<div class="note-box"><span class="note-label">Note</span>'+esc(w.n)+'</div>' : '';
    return '<div class="meanings">'+rows+'</div>'+notes;
  }

  function renderTypedPrompt(w){
    const rows = w.me.map((m,i)=>
      '<div class="meaning-row"><span class="meaning-num">'+(i+1)+'</span>'
      + '<div class="meaning-body"><div class="meaning-text">'+esc(m.m)+'</div></div></div>'
    ).join('');
    return '<div class="prompt-label">Type the English word</div>'
      + '<div class="meanings">'+rows+'</div>'
      + '<input type="text" class="type-input" id="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here, then Enter">';
  }

  function renderTypedResult(w){
    const badge = lastCheckCorrect
      ? '<div class="result-badge result-good">'+ICON_CHECK+'Correct</div>'
      : '<div class="result-badge result-bad">'+ICON_X+'Not quite</div>';
    return badge
      + '<div class="card-word">'+esc(w.w)+'</div>'
      + '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'
      + (canSpeak ? '<button class="speak-btn" id="speak-word" aria-label="Listen to pronunciation">'+ICON_SPEAKER+'</button>' : '')
      + '</div>'
      + renderMeanings(w);
  }

  function renderSentencePrompt(w, cloze){
    return '<div class="prompt-label">Complete the sentence</div>'
      + '<div class="meaning-text" style="margin-bottom:14px;">'+esc(cloze.meaning.m)+'</div>'
      + '<div class="cloze-sentence">&ldquo;'+esc(cloze.blanked)+'&rdquo;</div>'
      + '<input type="text" class="type-input" id="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the missing word, then Enter">';
  }

  function renderSentenceResult(w, cloze){
    const badge = lastCheckCorrect
      ? '<div class="result-badge result-good">'+ICON_CHECK+'Correct</div>'
      : '<div class="result-badge result-bad">'+ICON_X+'Not quite</div>';
    // put back the form the sentence actually used, not the headword
    const answer = cloze.answer || w.w;
    const filled = esc(cloze.blanked).replace('_____', '<strong>'+esc(answer)+'</strong>');
    return badge
      + '<div class="card-word">'+esc(w.w)+'</div>'
      + '<div class="card-pron"><span class="pron-text">/'+esc(w.p)+'/</span>'
      + (canSpeak ? '<button class="speak-btn" id="speak-word" aria-label="Listen to pronunciation">'+ICON_SPEAKER+'</button>' : '')
      + '</div>'
      + '<div class="cloze-sentence" style="margin-top:14px;">&ldquo;'+filled+'&rdquo;</div>'
      + renderMeanings(w);
  }

  function renderSession(){
    const w = session[sIndex];
    // In a Learn-a-set session the mode is per card, not per session. It is
    // decided once, when the card first appears, and held: answering can
    // change the word's stage, and recomputing here would swap the result
    // screen for a fresh prompt of the new stage before it could be read.
    if(learnMode){
      if(learnCardMode === null) learnCardMode = learnStageFor(w);
      activeMode = learnCardMode;
    }
    const pct = Math.round((sIndex/session.length)*100);
    const isLast = (sIndex+1 >= session.length);
    let cardBody, belowCard;

    if(activeMode==='typed' || activeMode==='sentence'){
      const cloze = activeMode==='sentence' ? findClozeExample(w) : null;
      if(!typedChecked){
        cardBody = cloze ? renderSentencePrompt(w, cloze) : renderTypedPrompt(w);
        belowCard = '<button class="btn-oncard" id="check-btn">Check</button>';
      } else {
        cardBody = cloze ? renderSentenceResult(w, cloze) : renderTypedResult(w);
        belowCard = '<button class="btn-primary" id="next-btn" style="margin-top:16px;">'+(isLast?'See results':'Next card')+' &rarr;</button>'
          + '<p class="hint" style="text-align:center;">Press Enter</p>'
          + (sessionKind!=='test' ? '<button class="ask-link" id="ask-claude">Stuck on this word? Ask Claude &rarr;</button>' : '');
      }
    } else if(activeMode==='coach'){
      const phrase = coachPhraseFor(w);
      const micLabel = scRecognizing ? 'Listening&hellip;' : (scResult ? 'Try again' : 'Tap to speak');
      let resultHtml = '';
      if(scResult){
        const color = scResult.score>=85 ? 'var(--good)' : (scResult.score>=60 ? 'var(--amber-deep)' : 'var(--warn)');
        const label = scResult.score>=85 ? 'Excellent pronunciation!' : (scResult.score>=60 ? 'Good, keep practicing' : 'Try again, a bit slower');
        resultHtml = '<div class="sc-score-row"><span class="sc-score-value" style="color:'+color+';">'+scResult.score+'%</span><span class="sc-score-label">'+label+'</span></div>'
          + '<div class="sc-diff">'+scResult.diffHtml+'</div>'
          + '<p class="sc-transcript">Heard: &ldquo;'+esc(scResult.transcript)+'&rdquo;</p>';
      }
      cardBody = '<div class="prompt-label">'+esc(w.w)+'</div>'

      const spoken = coachResults.length;
      const avg = spoken ? Math.round(coachResults.reduce((a,r)=>a+r.score,0)/spoken) : 0;
      const weak = coachResults.filter(r=>r.score<60);

      if(pct>=90) label = 'Excellent, this set is locked in.';
      else if(pct>=70) label = 'Solid. A few more rounds and these are locked in.';
      else if(pct>=50) label = 'Good start. Keep at these ones.';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+eyebrowText+'</div>'

  function searchWords(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const starts = [], contains = [];
    WORDS.forEach(w=>{
      const wl = w.w.toLowerCase();
      const inMeaning = w.me.some(m=> m.m.toLowerCase().indexOf(q) !== -1);
      if(wl.indexOf(q)===0) starts.push(w);
      else if(wl.indexOf(q)!==-1 || inMeaning) contains.push(w);
    });
    return starts.concat(contains).slice(0,60);
  }

  function renderSearch(query){
    query = query || '';
    const matches = searchWords(query);
    const rows = matches.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');
    const body = query.trim()
      ? (matches.length ? '<div class="word-list">'+rows+'</div>' : '<p class="hint">Nothing matches yet. Try a shorter word or part of a meaning.</p>')
      : '<p class="hint">Type a word or part of a meaning to find it.</p>';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Search</div>'
      + '<h1 class="title">Find a word</h1>'
      + '<input type="text" class="field-input" id="search-input" placeholder="Search word or meaning..." autocomplete="off">'
      + '<div style="margin-top:14px;">'+body+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    const inp = el('#search-input');
    inp.value = query;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', ()=> renderSearch(inp.value) );
    root.querySelectorAll('.word-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const word = matches.find(w=>String(w.id)===b.dataset.id);
        if(!word) return;
        const currentQuery = inp.value;
        startSession([word], word.cat);
        returnTo = { run: ()=>renderSearch(currentQuery), label:'Back to search' };
      });
    });
    el('#back-home').addEventListener('click', renderHome);
  }

  function saveNewWord(){
    const wordVal = el('#new-word').value.trim();
    const pronVal = el('#new-pron').value.trim();
    const catVal = el('#new-cat').value;
    const meanings = [1,2,3].map(i=>({
      m: el('#new-m'+i).value.trim(),
      e: el('#new-e'+i).value.trim()
    })).filter(m=>m.m);
    const noteVal = el('#new-note').value.trim();
    const errEl = el('#add-word-error');

    if(!wordVal){ errEl.textContent = 'Enter the word itself first.'; return; }
    if(meanings.length===0){ errEl.textContent = 'Add at least one meaning.'; return; }

    const id = makeWordId(catVal, wordVal);
    const entry = { id:id, cat:catVal, w:wordVal, p:pronVal, me:meanings, n:noteVal };
    WORDS.push(entry);
    customWords.push(entry);
    saveCustomWords();
    renderHome();
  }

  // Opened by tapping one of the home counters, so those numbers lead
  // somewhere instead of just being a readout.
  function renderStatusList(status){
    const LABELS = { mastered:'Mastered', learning:'In progress', new:'Not started' };
    const BLURBS = {
      mastered:'Words that survived the full spaced-repetition ladder. They still come back for review now and then.',
      learning:'Words you have started but not finished. These are the ones worth your next session.',
      new:'Words you have never been shown yet.'
    };
    const words = WORDS.filter(w=>statusOf(w.id)===status);
    words.sort((a,b)=>{
      const pa = wordPercent(a.id), pb = wordPercent(b.id);
      if(pa===null && pb===null) return 0;
      if(pa===null) return -1;
      if(pb===null) return 1;
      return pa - pb;
    });
    const shown = words.slice(0, 300);

    const rows = shown.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+esc(LABELS[status])+' &middot; '+words.length+' words</div>'
      + '<h1 class="title">'+esc(LABELS[status])+'</h1>'
      + '<p class="subtitle">'+esc(BLURBS[status])+' Weakest first. Tap any word to practice just that one.</p>'
      + (words.length ? '<div class="word-list">'+rows+'</div>' : '<p class="hint">Nothing here yet.</p>')
      + (words.length > shown.length ? '<p class="hint">Showing the first '+shown.length+' of '+words.length+'.</p>' : '')
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    root.querySelectorAll('.word-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const word = shown.find(w=>String(w.id)===b.dataset.id);
        if(!word) return;
        startSession([word], CAT_ABBR[word.cat]||word.cat);
        returnTo = { run: ()=>renderStatusList(status), label:'Back to the list' };
      });
    });
    el('#back-home').addEventListener('click', renderHome);
  }

  // Today's words. No topic to choose any more -- the app decides, every
  // day, and this screen just shows what it chose and how far through you
  // are. The four stages are walked automatically, one per card.
  function renderDailySet(){
    const set = todaysSet();
    const mastered = set.filter(w=>statusOf(w.id)==='mastered');
    // Stage order first, so a round meets the new words before drilling the
    // ones already in progress; weakest-first within each stage.
    const remaining = sortByPriority(set.filter(w=>statusOf(w.id)!=='mastered'))
      .sort((a,b)=> learnStageRank(a)-learnStageRank(b));
    const pct = set.length ? Math.round((mastered.length/set.length)*100) : 0;
    const complete = remaining.length===0;
    const stageList = canListen
      ? 'recognize, type it, sentence, say it'
      : 'recognize, type it, sentence';
    const setDue = dueForReview(WORDS, LEARNSET_SIZE);

    const rows = set.map(w=>{
      const isMastered = statusOf(w.id)==='mastered';
      const stage = learnStageFor(w);
      const label = isMastered ? 'Mastered' : LEARN_STAGES[stage];
      const color = isMastered ? 'var(--good)'
        : (stage==='recognize' ? 'var(--new)' : 'var(--amber)');
      return '<div class="follow-row"><span class="follow-word">'+esc(w.w)
        + ' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'
        + esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span></div>';
    }).join('');

    root.innerHTML = '<div class="view">'
      // friendlyDate turns today's date into the word "Today", so spelling
      // out the date here as well would just read "Today - Today".
      + '<div class="eyebrow">Today &middot; '+new Date().toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'})+'</div>'
      + '<h1 class="title">'+mastered.length+' of '+set.length+' mastered</h1>'
      + '<p class="subtitle">'+(complete
          ? 'Today is done. Tomorrow brings '+LEARNSET_SIZE+' more, and anything you leave unfinished carries over.'
          : 'Your '+LEARNSET_SIZE+' words for today, '+PER_TOPIC+' from each of the '+CATEGORIES.length+' lists. '
            + 'The app picks the method for each one: '+stageList
            + '. A word is only mastered once you have said it out loud.')+'</p>'
      + '<div class="bar bar-session"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
      + recallHtml(setDue)
      + (complete
          ? '<button class="btn-primary" id="review-set">Practice these '+set.length+' again &rarr;</button>'
            + '<p class="hint">Goes back over today’s words. Miss one and it returns to the set to work on again.</p>'
          : '<button class="btn-primary" id="start-set">Start &middot; '+remaining.length+' left &rarr;</button>'
            + '<p class="hint">Carries on from wherever each word had got to.</p>')
      + '<div class="divider"><span>today&rsquo;s '+set.length+'</span></div>'
      + '<div class="follow-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    const startBtn = el('#start-set');
    if(startBtn){
      startBtn.addEventListener('click', ()=>{
        startSession(remaining, 'Today', true);
        returnTo = { run: renderDailySet, label:'Back to today' };
      });
    }
    const reviewBtn = el('#review-set');
    if(reviewBtn){
      reviewBtn.addEventListener('click', ()=>{
        startSession(sortByPriority(set), 'Today again', true);
        returnTo = { run: renderDailySet, label:'Back to today' };
      });
    }
    wireRecall(setDue, 'Refresher', { run: renderDailySet, label:'Back to today' });
    el('#back-home').addEventListener('click', renderHome);
  }
