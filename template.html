    query = query || '';
    const listWords = myList.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);

    const listRows = listWords.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<div class="follow-row"><span class="follow-word">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span style="display:flex; align-items:center; gap:12px;">'
        + '<span style="font-family:var(--mono); font-weight:600; font-size:.85rem; color:'+color+';">'+label+'</span>'
        + '<button class="mini-speak" data-remove="'+esc(String(w.id))+'" aria-label="Remove from list" style="color:var(--warn);">'+ICON_X+'</button>'
        + '</span></div>';
    }).join('');

    const listSection = listWords.length
      ? '<div class="follow-list">'+listRows+'</div>'
      : '<p class="hint">No words yet. Search below and tap one to add it, up to '+MYLIST_MAX+'.</p>';

    const matches = query.trim() ? searchWords(query) : [];
    const searchRows = matches.map(w=>{
      const already = myList.indexOf(w.id) !== -1;
      const full = !already && myList.length >= MYLIST_MAX;
      const label = already ? 'Added' : (full ? 'List full' : '+ Add');
      const color = already ? 'var(--good)' : (full ? 'var(--text-soft)' : 'var(--amber)');
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+' <span style="color:var(--text-soft); font-weight:400; font-size:.78rem;">'+esc(CAT_ABBR[w.cat]||w.cat)+'</span></span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');
    const searchBody = query.trim()
      ? (matches.length ? '<div class="word-list">'+searchRows+'</div>' : '<p class="hint">No words match.</p>')
      : '';

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">My list &middot; '+listWords.length+'/'+MYLIST_MAX+'</div>'
      + '<h1 class="title">Study my list</h1>'
      + '<p class="subtitle">Pick your own words below, then study just this set in whichever mode is selected at home, until every one is mastered.</p>'
      + listSection
      + (listWords.length ? '<button class="btn-primary" id="start-mylist" style="margin-top:14px;">Start studying</button>' : '')
      + '<div class="divider"><span>add words</span></div>'
      + '<input type="text" class="field-input" id="mylist-search" placeholder="Search a word or meaning..." autocomplete="off">'
      + '<div style="margin-top:14px;">'+searchBody+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back to home</button>'
      + '</div>';

    const inp = el('#mylist-search');
    inp.value = query;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', ()=> renderMyList(inp.value) );

    root.querySelectorAll('[data-remove]').forEach(b=>{
      b.addEventListener('click', ()=>{
        toggleMyListWord(b.dataset.remove);
        renderMyList(inp.value);
      });
    });
    root.querySelectorAll('.word-row[data-id]').forEach(b=>{
      b.addEventListener('click', ()=>{
        toggleMyListWord(b.dataset.id);
        renderMyList(inp.value);
      });
    });
    const startBtn = el('#start-mylist');
    if(startBtn){
      startBtn.addEventListener('click', ()=>{
        const words = sortByPriority(myList.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean));
        if(!words.length) return;
        startSession(words, 'My list');
        returnTo = { run: ()=>renderMyList(''), label:'Back to my list' };
      });
    }
    el('#back-home').addEventListener('click', renderHome);
  }

  function renderTopicPicker(){
    const rows = CATEGORIES.map(c=>{
      const list = WORDS.filter(w=>w.cat===c);
      const s = computeStats(list);
      const pct = Math.round((s.good/list.length)*100);
      return '<button class="cat-row" data-cat="'+esc(c)+'">'
        + '<div class="cat-row-top"><span class="cat-name">'+esc(c)+'</span><span class="cat-arrow">&rarr;</span></div>'
        + '<div class="cat-row-meta">'+list.length+' words &middot; '+s.good+' mastered</div>'
        + '<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Browse by topic</div>'
      + '<h1 class="title">Pick a topic</h1>'
      + '<p class="subtitle">See every word with its real accuracy, then tap any single one to practice just that word.</p>'
      + '<div class="cat-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-home" style="margin-top:16px;">&larr; Back</button>'
      + '</div>';

    root.querySelectorAll('.cat-row').forEach(b=>{
      b.addEventListener('click', ()=> renderWordList(b.dataset.cat) );
    });
    el('#back-home').addEventListener('click', renderHome);
  }

  function renderWordList(cat){
    const words = WORDS.filter(w=>w.cat===cat).slice();
    words.sort((a,b)=>{
      const pa = wordPercent(a.id), pb = wordPercent(b.id);
      if(pa===null && pb===null) return 0;
      if(pa===null) return -1; // never-attempted words need attention first
      if(pb===null) return 1;
      return pa - pb; // weakest first
    });

    const rows = words.map(w=>{
      const pct = wordPercent(w.id);
      const label = pct===null ? 'New' : pct+'%';
      const color = pct===null ? 'var(--new)' : (pct>=80 ? 'var(--good)' : (pct>=40 ? 'var(--amber)' : 'var(--warn)'));
      return '<button class="word-row" data-id="'+esc(String(w.id))+'">'
        + '<span class="word-row-name">'+esc(w.w)+'</span>'
        + '<span class="word-row-pct" style="color:'+color+';">'+label+'</span>'
        + '</button>';
    }).join('');

    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">'+esc(cat)+'</div>'
      + '<h1 class="title">Word list</h1>'
      + '<p class="subtitle">Weakest first. Tap any word to practice just that one, in whichever mode is selected at home.</p>'
      + '<div class="word-list">'+rows+'</div>'
      + '<button class="btn-secondary" id="back-topics" style="margin-top:16px;">&larr; Back to topics</button>'
      + '</div>';

    root.querySelectorAll('.word-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const word = words.find(w=>String(w.id)===b.dataset.id);
        if(!word) return;
        startSession([word], cat);
        returnTo = { run: ()=>renderWordList(cat), label:'Back to word list' };
      });
    });
    el('#back-topics').addEventListener('click', renderTopicPicker);
  }

  function handleGlobalKeydown(e){
    const inSession = root.querySelector('.sess-top');
    if(!inSession) return; // shortcuts only apply during an active card session

    if(activeMode==='fast'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        toggleFastPause();
      } else if(e.key==='Enter'){
        e.preventDefault();
        skipFastCard();
      }
      return;
    }

    if(activeMode==='typed' || activeMode==='sentence'){
      // pre-check Enter is handled by the input's own listener (which stops
      // propagation); this only covers "Enter again to move on" after checking
      if(e.key==='Enter' && typedChecked){
        e.preventDefault();
        advance();
      }
      return;
    }

    if(activeMode==='coach'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        if(!scRecognizing) scStartListening();
      } else if(e.key==='Enter'){
        e.preventDefault();
        advance();
      }
      return;
    }


    // recognize mode: Enter reveals the meaning; once revealed, arrow keys rate
    if(e.key==='Enter' && !revealed){
      e.preventDefault();
      revealed = true;
      renderSession();
    } else if(revealed && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
      e.preventDefault();
      recordResult(e.key==='ArrowRight');
      advance();
    }
  }
  document.addEventListener('keydown', handleGlobalKeydown);

  // --- The recall check on the way in ------------------------------------
  // Different from "Keep them fresh", which only shows you a word. This
  // asks, and the answer counts: forget one and it stops being mastered
  // and rejoins the normal rotation. The method is not yours to pick --
  // the app rotates recognize, type it and speaking so a word is not
  // always checked the way it is easiest to remember.
  const RECALL_COUNT = 5;
  const RECALL_METHODS = ['recognize', 'typed', 'coach'];
  let recallQuiz = null;
  let recallShown = false;

  // Mastered words, longest since you last saw one first, so the check
  // works its way through all of them instead of circling a few.
  function recallPool(n){
    const list = WORDS.filter(w=>statusOf(w.id)==='mastered');
    list.sort((a,b)=>{
      const pa = progress[a.id] || {}, pb = progress[b.id] || {};
      const ta = pa.lastSeen ? new Date(pa.lastSeen).getTime() : 0;
      const tb = pb.lastSeen ? new Date(pb.lastSeen).getTime() : 0;
      return ta - tb;
    });
    return list.slice(0, n);
  }

  function recallMethods(){
    return RECALL_METHODS.filter(m=> m !== 'coach' || canListen);
  }

  // Rotated by position, shifted by the day, so the same word is not met
  // with the same question every morning.
  function recallMethodFor(i){
    const avail = recallMethods();
    const day = Math.floor(Date.now() / 86400000);
    return avail[(i + day) % avail.length];
  }

  const RECALL_HOW = {
    recognize: 'Do you remember what it means?',
    typed: 'Type the word from its meaning',
    coach: 'Say it out loud'
  };

  function maybeOpenRecall(){
    if(recallShown) return;
    recallShown = true;
    const words = recallPool(RECALL_COUNT);
    if(!words.length) return; // nothing mastered yet, so nothing to forget
    recallQuiz = { words: words, i: 0, revealed: false, verdict: null, marks: [], status: null };
    renderRecall();
  }

  function closeRecall(){
    scStopListening();
    recallQuiz = null;
    const box = document.getElementById('recall-scrim');
    if(box) box.remove();
    renderHome(); // counts may have moved while the check was open
  }

  // Forgetting a mastered word means it is not mastered any more. It drops
  // back far enough to come round again soon, but not all the way to new --
  // you did learn it once.
  function recallRecord(w, correct){
    const p = progress[w.id];
    if(!p) return;
    p.seen = (p.seen||0) + 1;
    if(correct){
      p.correct = (p.correct||0) + 1;
      p.due = new Date(Date.now() + SRS_STEP_MINUTES[SRS_MASTER_STEP]*60000).toISOString();
    } else {
      p.step = 2;
      p.status = 'learning';
      p.due = new Date(Date.now() + SRS_STEP_MINUTES[2]*60000).toISOString();
    }
    p.lastSeen = new Date().toISOString();
    progress[w.id] = p;
    saveProgress();
  }

  function recallAnswer(correct){
    const q = recallQuiz;
    if(!q || q.verdict !== null) return;
    recallRecord(q.words[q.i], correct);
    q.verdict = correct;
    q.marks[q.i] = correct ? 'ok' : 'miss';
    renderRecall();
  }

  function recallNext(){
    const q = recallQuiz;
    if(!q) return;
    q.i++;
    q.revealed = false;
    q.verdict = null;
    q.status = null;
    if(q.i >= q.words.length){ renderRecall(); return; } // summary
    renderRecall();
  }

  // Drawn into whatever container is on screen, and repainted in place
  // rather than through renderHome, so a sync finishing never steals the
  // cursor out of a box you are typing in.
  function syncLineHtml(){
    if(!syncAvailable()){
      return '<div class="sync-line"><span class="sync-dot"></span>'
        + 'Opened as a file, so there is nothing to sync with.</div>';
    }
    if(!syncKey){
      return '<div class="sync-line" id="sync-line">'
        + '<span class="sync-dot"></span>'
        + '<span>Progress is only on this device.</span>'
        + '<button id="sync-start">Share it with my other devices &rarr;</button>'
        + '</div>'
        + '<div class="sync-setup" id="sync-setup" style="display:none;">'
          + '<input type="text" id="sync-code" placeholder="passcode" autocomplete="off" '
            + 'autocapitalize="off" spellcheck="false">'
          + '<button id="sync-save">Connect</button>'
        + '</div>'
        + '<p class="hint" id="sync-help" style="display:none;">The laptop prints the passcode '
          + 'in the Word Log window when it starts, and keeps it in <b>wordlog_key.txt</b> '
          + 'next to the app. Type the same one on every device.</p>';
    }
    const cls = syncState === 'busy' ? 'busy' : (syncState === 'error' ? 'bad' : 'on');
    const label = syncState === 'busy' ? 'Syncing&hellip;'
      : (syncState === 'error' ? esc(syncNote) : (syncNote ? esc(syncNote) : 'Progress is shared'));
    return '<div class="sync-line" id="sync-line">'
      + '<span class="sync-dot '+cls+'"></span><span>'+label+'</span>'
      + '<button id="sync-now">Sync now</button>'
      + '<button id="sync-forget">Stop sharing</button>'
      + '</div>';
  }

  function wireSyncLine(){
    const on = function(id, fn){
      const b = document.getElementById(id);
      if(b) b.addEventListener('click', fn);
    };
    on('sync-start', function(){
      const setup = document.getElementById('sync-setup');
      const help = document.getElementById('sync-help');
      if(setup) setup.style.display = 'flex';
      if(help) help.style.display = 'block';
      const box = document.getElementById('sync-code');
      if(box) box.focus();
    });
    const save = function(){
      const box = document.getElementById('sync-code');
      if(!box || !box.value.trim()) return;
      setSyncKey(box.value);
      syncNow().then(function(ok){
        if(ok){ startSyncLoop(); renderHome(); }
        else { setSyncKey(''); paintSyncLine(); }
      });
    };
    on('sync-save', save);
    const box = document.getElementById('sync-code');
    if(box) box.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); save(); }
    });
    on('sync-now', function(){ syncNow().then(function(){ renderHome(); }); });
    on('sync-forget', function(){
      setSyncKey('');
      if(syncTimer) clearInterval(syncTimer);
      renderHome();
    });
  }

  // Swaps just this one line, leaving the rest of the page alone.
  function paintSyncLine(){
    const host = document.getElementById('sync-host');
    if(!host) return;
    host.innerHTML = syncLineHtml();
    wireSyncLine();
  }

  function recallDots(q){
    return '<div class="recall-dots">' + q.words.map(function(w, idx){
      const cls = q.marks[idx] || (idx === q.i ? 'now' : '');
      return '<span class="'+cls+'"></span>';
    }).join('') + '</div>';
  }

  function renderRecall(){
    const q = recallQuiz;
    if(!q) return;
    let scrim = document.getElementById('recall-scrim');
    if(!scrim){
      scrim = document.createElement('div');
      scrim.id = 'recall-scrim';
      scrim.className = 'recall-scrim';
      document.body.appendChild(scrim);
    }

    // finished: say what happened, then get out of the way
    if(q.i >= q.words.length){
      const kept = q.marks.filter(function(m){ return m === 'ok'; }).length;
      const lost = q.marks.length - kept;
      scrim.innerHTML = '<div class="recall-box">'
        + '<div class="recall-head"><span>Recall check</span><span>done</span></div>'
        + '<h2 class="recall-title">'+kept+' of '+q.marks.length+' still there</h2>'
        + '<p class="recall-answer">'+(lost
            ? lost+' word'+(lost===1?'':'s')+' slipped, so '+(lost===1?'it is':'they are')
              + ' back in the rotation and will come round again soon.'
            : 'Nothing forgotten. They are all booked in for a longer gap.')+'</p>'
        + '<button class="btn-primary" id="recall-done">Go to the app &rarr;</button>'
        + '</div>';
      document.getElementById('recall-done').addEventListener('click', closeRecall);
      return;
    }

    const w = q.words[q.i];
    const method = recallMethodFor(q.i);
    const m = w.me[0] || {};
    const head = '<div class="recall-head"><span>Recall check</span>'
      + '<span>'+(q.i+1)+' of '+q.words.length+'</span></div>'
      + '<h2 class="recall-title">Do you remember this word?</h2>'
      + '<p class="recall-how">'+RECALL_HOW[method]+'</p>';

    let body = '';

    if(q.verdict !== null){
      // the same closing panel, whichever way it was asked
      body = '<div class="recall-subject">'+esc(w.w)+'</div>'
        + (w.p ? '<div class="recall-pron">/'+esc(w.p)+'/</div>' : '')
        + '<p class="recall-verdict" style="color:'+(q.verdict?'var(--good)':'var(--warn)')+';">'
          + (q.verdict ? 'Still yours' : 'Back into the rotation')+'</p>'
        + '<p class="recall-answer">'+esc(m.m||'')+(m.e ? '<br><em>&ldquo;'+esc(m.e)+'&rdquo;</em>' : '')+'</p>'
        + '<button class="btn-primary" id="recall-next">'
          + (q.i+1 >= q.words.length ? 'See how you did' : 'Next word')+' &rarr;</button>';
    } else if(method === 'recognize'){
      body = '<div class="recall-subject">'+esc(w.w)+'</div>'
        + (w.p ? '<div class="recall-pron">/'+esc(w.p)+'/</div>' : '')
        + (q.revealed
            ? '<p class="recall-prompt">'+esc(m.m||'')+'</p>'
              + (m.e ? '<p class="recall-ex">&ldquo;'+esc(m.e)+'&rdquo;</p>' : '')
              + '<div class="recall-btns">'
                + '<button class="btn-secondary" id="recall-no">I had forgotten</button>'
                + '<button class="btn-primary" id="recall-yes">I knew it</button>'
              + '</div>'
            : '<button class="btn-primary" id="recall-reveal">Show the meaning</button>');
    } else if(method === 'typed'){
      body = '<p class="recall-prompt">'+esc(m.m||'')+'</p>'
        + '<input type="text" class="recall-input" id="recall-input" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false" placeholder="Type the word...">'
        + '<button class="btn-primary" id="recall-check">Check</button>';
    } else {
      const phrase = coachPhraseFor(w);
      body = '<div class="recall-subject">'+esc(w.w)+'</div>'
        + '<p class="recall-prompt">&ldquo;'+esc(phrase)+'&rdquo;</p>'
        + (q.status ? '<p class="recall-ex">'+esc(q.status)+'</p>' : '')
        + '<button class="btn-primary" id="recall-speak">'+ICON_MIC
          + (q.listening ? ' Listening&hellip;' : ' Tap and say it')+'</button>';
    }

    scrim.innerHTML = '<div class="recall-box">' + head + body
      + recallDots(q)
      + '<button class="recall-dismiss" id="recall-skip">Not now &mdash; take me to the app</button>'
      + '</div>';

    const on = function(id, fn){
      const b = document.getElementById(id);
      if(b) b.addEventListener('click', fn);
    };
    on('recall-skip', closeRecall);
    on('recall-next', recallNext);
    on('recall-reveal', function(){ q.revealed = true; renderRecall(); });
    on('recall-yes', function(){ recallAnswer(true); });
    on('recall-no', function(){ recallAnswer(false); });
    on('recall-check', function(){
      const input = document.getElementById('recall-input');
      recallAnswer(normalizeAnswer(input ? input.value : '') === normalizeAnswer(w.w));
    });
    on('recall-speak', function(){ recallListen(w); });

    const input = document.getElementById('recall-input');
    if(input){
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          recallAnswer(normalizeAnswer(input.value) === normalizeAnswer(w.w));
        }
      });
      input.focus();
    }
  }

  // The speaking question. It leans on the same primitives the practice
  // sessions use -- one recognizer, one permission, the same token guard --
  // but renders into the pop-up rather than the session screen, so the two
  // never fight over who owns the page.
  function recallListen(w){
    const q = recallQuiz;
    if(!q || !canListen) return;
    const phrase = coachPhraseFor(w);
    scStopListening();
    const token = ++scToken;
    q.listening = true;
    q.status = micGranted ? null : 'Allow the microphone once and it will not ask again.';
    renderRecall();

    ensureMic().then(function(ok){
      if(scToken !== token || recallQuiz !== q) return;
      if(!ok){
        q.listening = false;
        q.status = speechErrorMessage('not-allowed');
        renderRecall();
        return;
      }
      const recognition = scGetRecognizer();
      const finish = function(status){
        if(scToken !== token || recallQuiz !== q) return;
        q.listening = false;
        q.status = status;
        renderRecall();
      };
      recognition.onresult = function(e){
        if(scToken !== token || recallQuiz !== q) return;
        const scored = scScorePhrase(phrase, e.results[0][0].transcript);
        saveSpeechScore(w.id, scored.score);
        q.listening = false;
        recallAnswer(scored.score >= 60);
      };
      recognition.onerror = function(e){
        const code = e.error || 'error';
        if(code === 'not-allowed' || code === 'service-not-allowed') setMicGranted(false);
        finish(speechErrorMessage(code));
      };
      recognition.onend = function(){
        if(q.listening) finish(speechErrorMessage('no-speech'));
      };
      setTimeout(function(){
        if(scToken !== token || recallQuiz !== q) return;
        try{ recognition.start(); }
        catch(err){
          try{ recognition.abort(); }catch(e2){}
          scRecognizer = null;
          finish(speechErrorMessage('error'));
        }
      }, 250);
    });
  }

  // --- Sharing progress between the phone and the laptop ----------------
  //
  // Everything the app knows still lives in localStorage on each device;
  // the laptop just keeps a copy that both of them reconcile against. So
  // the app still works with nothing to talk to, and two devices that
  // have been used apart come back together rather than one flattening
  // the other.
  //
  // The merge is per word, not per device. For each word the side that
  // saw it more recently wins, which is the only ordering either device
  // can agree on without a clock they share. Everything else merges the
  // way its own shape allows: speaking scores take the higher, lists take
  // the union, counters take the larger.
  //
  // The address is public, so the server will not say a word without the
  // passcode. It is typed once per device and kept here.
  const SYNC_KEY_STORE = 'wordlog_sync_key';
  const SYNC_URL = '/api/state';
  const SYNC_EVERY_MS = 30000;

  let syncKey = '';
  try{ syncKey = localStorage.getItem(SYNC_KEY_STORE) || ''; }catch(e){}
  let syncState = syncKey ? 'idle' : 'off';   // off | idle | busy | error
  let syncNote = '';
  let syncTimer = null;
  let syncQueued = false;

  function syncAvailable(){
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  function setSyncKey(key){
    syncKey = (key || '').trim();
    try{
      if(syncKey) localStorage.setItem(SYNC_KEY_STORE, syncKey);
      else localStorage.removeItem(SYNC_KEY_STORE);
    }catch(e){}
    syncState = syncKey ? 'idle' : 'off';
  }

  // Everything worth carrying between devices, in one bundle.
  function localBundle(){
    return {
      progress: progress,
      meta: meta,
      speech: speechScores,
      myList: myList,
      custom: customWords,
      learnSets: learnSets
    };
  }

  function seenAt(p){
    if(!p) return 0;
    if(p.lastSeen){
      const t = new Date(p.lastSeen).getTime();
      if(!isNaN(t)) return t;
    }
    return 0;
  }

  // Per word: whoever saw it last is right about it. Where neither side
  // has a timestamp -- progress saved before lastSeen existed -- the one
  // with more reps is the better guess.
  function mergeProgress(mine, theirs){
    const out = {};
    Object.keys(mine || {}).forEach(id=>{ out[id] = mine[id]; });
    Object.keys(theirs || {}).forEach(id=>{
      const a = out[id], b = theirs[id];
      if(!a){ out[id] = b; return; }
      const ta = seenAt(a), tb = seenAt(b);
      if(tb > ta) out[id] = b;
      else if(tb === ta && (b.seen||0) > (a.seen||0)) out[id] = b;
    });
    return out;
  }

  function mergeScores(mine, theirs){
    const out = {};
    Object.keys(mine || {}).forEach(id=>{ out[id] = mine[id]; });
    Object.keys(theirs || {}).forEach(id=>{
      if(out[id] === undefined || theirs[id] > out[id]) out[id] = theirs[id];
    });
    return out;
  }

  function mergeMeta(mine, theirs){
    if(!theirs) return mine;
    const out = JSON.parse(JSON.stringify(mine || {}));
    const ms = out.streak || {current:0, longest:0, lastDate:null};
    const ts = theirs.streak || {current:0, longest:0, lastDate:null};
    // The later day is the live one; the longest ever is the larger.
    out.streak = {
      current: (ts.lastDate || '') > (ms.lastDate || '') ? ts.current : ms.current,
      longest: Math.max(ms.longest||0, ts.longest||0),
      lastDate: (ts.lastDate || '') > (ms.lastDate || '') ? ts.lastDate : ms.lastDate
    };
    // Sessions happened on both sides; keep them all, newest first, and
    // drop anything that is plainly the same entry twice.
    const seen = {};
    out.history = (mine && mine.history ? mine.history : [])
      .concat(theirs.history || [])
      .filter(h=>{
        const k = [h.date, h.label, h.total, h.correct, h.at || ''].join('|');
        if(seen[k]) return false;
        seen[k] = true;
        return true;
      })
      .slice(0, 200);
    out.passes = Object.assign({}, theirs.passes || {}, (mine && mine.passes) || {});
    return out;
  }

  function mergeLearnSets(mine, theirs){
    if(!theirs || !theirs.daily) return mine;
    if(!mine || !mine.daily) return theirs;
    // The set belonging to the later day is the real one.
    const md = mine.daily.day || '', td = theirs.daily.day || '';
    if(td > md) return theirs;
    if(md > td) return mine;
    // Same day on both: keep whichever was started later.
    return (theirs.daily.startedAt || '') > (mine.daily.startedAt || '') ? theirs : mine;
  }

  function mergeBundle(mine, theirs){
    if(!theirs) return mine;
    const customIds = {};
    const custom = (mine.custom || []).slice();
    custom.forEach(w=>{ customIds[w.id] = true; });
    (theirs.custom || []).forEach(w=>{ if(!customIds[w.id]){ custom.push(w); customIds[w.id] = true; } });

    const list = (mine.myList || []).slice();
    (theirs.myList || []).forEach(id=>{ if(list.indexOf(id) === -1) list.push(id); });

    return {
      progress: mergeProgress(mine.progress, theirs.progress),
      meta: mergeMeta(mine.meta, theirs.meta),
      speech: mergeScores(mine.speech, theirs.speech),
      myList: list.slice(0, MYLIST_MAX),
      custom: custom,
      learnSets: mergeLearnSets(mine.learnSets, theirs.learnSets)
    };
  }

  function adoptBundle(b){
    progress = b.progress || {};
    meta = b.meta || meta;
    speechScores = b.speech || {};
    myList = b.myList || [];
    const knownCustom = {};
    customWords.forEach(w=>{ knownCustom[w.id] = true; });
    customWords = b.custom || [];
    // A word added on the other device has to join WORDS here too, or
    // its progress would point at an id this device cannot resolve.
    customWords.forEach(w=>{
      if(!knownCustom[w.id] && !WORDS.some(x=>x.id === w.id)) WORDS.push(w);
    });
    learnSets = b.learnSets || {};
    if(!meta.streak) meta.streak = {current:0, longest:0, lastDate:null};
    if(!meta.history) meta.history = [];
    if(!meta.passes) meta.passes = {};
    // the local saver, not saveProgress: adopting what the server just
    // sent must not schedule another push of the same thing
    saveProgressLocal();
    saveMeta();
    saveSpeechScores();
    saveMyList();
    saveCustomWords();
    saveLearnSets();
  }

  // One round trip: take what the laptop has, merge it with what is here,
  // and hand the result back. Both devices end up holding the same thing.
  async function syncNow(quiet){
    if(!syncKey || !syncAvailable()) return false;
    if(syncState === 'busy'){ syncQueued = true; return false; }
    syncState = 'busy';
    if(!quiet) paintSyncLine();
    try{
      const headers = { 'X-Word-Log-Key': syncKey };
      const got = await fetch(SYNC_URL, { headers: headers, cache: 'no-store' });
      if(got.status === 403){
        syncState = 'error';
        syncNote = 'That passcode was not accepted.';
        paintSyncLine();
        return false;
      }
      if(!got.ok) throw new Error('get failed');
      const remote = await got.json();
      const merged = mergeBundle(localBundle(), remote.data || null);
      adoptBundle(merged);

      const put = await fetch(SYNC_URL, {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
        body: JSON.stringify({ data: merged })
      });
      if(!put.ok) throw new Error('put failed');
      syncState = 'idle';
      syncNote = 'Last synced ' + new Date().toLocaleTimeString();
      paintSyncLine();
      return true;
    }catch(e){
      syncState = 'error';
      syncNote = 'The laptop did not answer. Your work is saved here and will go over next time.';
      paintSyncLine();
      return false;
    }finally{
      if(syncState !== 'busy' && syncQueued){
        syncQueued = false;
        setTimeout(()=>syncNow(true), 400);
      }
    }
  }

  // Called after anything is written locally. Debounced, because a
  // session writes on every single card.
  let syncSoonHandle = null;
  function syncSoon(){
    if(!syncKey) return;
    if(syncSoonHandle) clearTimeout(syncSoonHandle);
    syncSoonHandle = setTimeout(()=>{ syncSoonHandle = null; syncNow(true); }, 2500);
  }

  function startSyncLoop(){
    if(syncTimer) clearInterval(syncTimer);
    if(!syncKey) return;
    syncTimer = setInterval(()=>{
      if(document.visibilityState === 'visible') syncNow(true);
    }, SYNC_EVERY_MS);
  }

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') syncNow(true);
  });

  async function init(){
    loadProgress();
    loadMeta();
    loadCustomWords();
    loadMyList();
    loadSpeechScores();
    loadLearnSets();
    renderHome();
    // Catch up with the other device before deciding what to show, so the
    // day's set and the recall check are built from the shared picture
    // rather than this device's stale half of it.
    if(syncKey && syncAvailable()){
      const caughtUp = await syncNow(true);
      startSyncLoop();
      if(caughtUp) renderHome();
    }
    // Meets you at the door, once per opening of the app.
    maybeOpenRecall();
  }
  init().catch(()=>{ root.innerHTML = '<p class="loading">Something went wrong loading the app. Refreshing might help.</p>'; });

  // Registering the worker is what makes the browser offer to install
  // this as an app, and what lets it open when the laptop is off. It
  // needs a real https address, so it is skipped when the page is opened
  // as a file -- and a failure here must never stop the app loading.
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
