  function handleGlobalKeydown(e){
    const inSession = root.querySelector('.sess-top');
    if(!inSession) return; // shortcuts only apply during an active card session

    if(activeMode==='fast'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        toggleFastPause();
      } else if(e.key==='Enter'){
        e.preventDefault();
        skipFastCard();
      }
      return;
    }

    if(activeMode==='typed' || activeMode==='sentence'){
      // pre-check Enter is handled by the input's own listener (which stops
      // propagation); this only covers "Enter again to move on" after checking
      if(e.key==='Enter' && typedChecked){
        e.preventDefault();
        advance();
      }
      return;
    }

    if(activeMode==='coach'){
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        if(!scRecognizing) scStartListening();
      } else if(e.key==='Enter'){
        e.preventDefault();
        advance();
      }
      return;
    }


    // recognize mode: Enter reveals the meaning; once revealed, arrow keys rate
    if(e.key==='Enter' && !revealed){
      e.preventDefault();
      revealed = true;
      renderSession();
    } else if(revealed && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
      e.preventDefault();
      recordResult(e.key==='ArrowRight');
      advance();
    }
  }
  document.addEventListener('keydown', handleGlobalKeydown);

  // --- The recall check on the way in ------------------------------------
  // Different from "Keep them fresh", which only shows you a word. This
  // asks, and the answer counts: forget one and it stops being mastered
  // and rejoins the normal rotation.
  //
  // It always asks you to type the word from its meaning. Recognising a
  // word you are looking at proves little, and this is meant to be the
  // hard question -- if you cannot produce it from memory, you have not
  // really kept it.
  const RECALL_COUNT = 5;
  let recallQuiz = null;
  let recallShown = false;

  // Mastered words, longest since you last saw one first, so the check
  // works its way through all of them instead of circling a few.
  function recallPool(n){
    const list = WORDS.filter(w=>statusOf(w.id)==='mastered');
    list.sort((a,b)=>{
      const pa = progress[a.id] || {}, pb = progress[b.id] || {};
      const ta = pa.lastSeen ? new Date(pa.lastSeen).getTime() : 0;
      const tb = pb.lastSeen ? new Date(pb.lastSeen).getTime() : 0;
      return ta - tb;
    });
    return list.slice(0, n);
  }

  const RECALL_HOW = 'Type the word from its meaning';

  function maybeOpenRecall(){
    if(recallShown) return;
    recallShown = true;
    const words = recallPool(RECALL_COUNT);
    if(!words.length) return; // nothing mastered yet, so nothing to forget
    recallQuiz = { words: words, i: 0, revealed: false, verdict: null, marks: [], status: null };
    renderRecall();
  }

  function closeRecall(){
    scStopListening();
    recallQuiz = null;
    const box = document.getElementById('recall-scrim');
    if(box) box.remove();
    renderHome(); // counts may have moved while the check was open
  }

  // Forgetting a mastered word means it is not mastered any more. It drops
  // back far enough to come round again soon, but not all the way to new --
  // you did learn it once.
  function recallRecord(w, correct){
    const p = progress[w.id];
    if(!p) return;
    p.seen = (p.seen||0) + 1;
    if(correct){
      p.correct = (p.correct||0) + 1;
      p.due = new Date(Date.now() + SRS_STEP_MINUTES[SRS_MASTER_STEP]*60000).toISOString();
    } else {
      p.step = 2;
      p.status = 'learning';
      p.due = new Date(Date.now() + SRS_STEP_MINUTES[2]*60000).toISOString();
      if(p.masteredAt) delete p.masteredAt; // it did not stick after all
    }
    p.lastSeen = new Date().toISOString();
    progress[w.id] = p;
    saveProgress();
  }

  function recallAnswer(correct){
    const q = recallQuiz;
    if(!q || q.verdict !== null) return;
    recallRecord(q.words[q.i], correct);
    q.verdict = correct;
    q.marks[q.i] = correct ? 'ok' : 'miss';
    renderRecall();
  }

  function recallNext(){
    const q = recallQuiz;
    if(!q) return;
    q.i++;
    q.verdict = null;
    if(q.i >= q.words.length){ renderRecall(); return; } // summary
    renderRecall();
  }

  function recallDots(q){
    return '<div class="recall-dots">' + q.words.map(function(w, idx){
      const cls = q.marks[idx] || (idx === q.i ? 'now' : '');
      return '<span class="'+cls+'"></span>';
    }).join('') + '</div>';
  }

  function renderRecall(){
    const q = recallQuiz;
    if(!q) return;
    let scrim = document.getElementById('recall-scrim');
    if(!scrim){
      scrim = document.createElement('div');
      scrim.id = 'recall-scrim';
      scrim.className = 'recall-scrim';
      document.body.appendChild(scrim);
    }

    // finished: say what happened, then get out of the way
    if(q.i >= q.words.length){
      const kept = q.marks.filter(function(m){ return m === 'ok'; }).length;
      const lost = q.marks.length - kept;
      scrim.innerHTML = '<div class="recall-box">'
        + '<div class="recall-head"><span>Recall check</span><span>done</span></div>'
        + '<h2 class="recall-title">'+kept+' of '+q.marks.length+' still there</h2>'
        + '<p class="recall-answer">'+(lost
            ? lost+' word'+(lost===1?'':'s')+' slipped, so '+(lost===1?'it is':'they are')
              + ' back in the rotation and will come round again soon.'
            : 'Nothing forgotten. They are all booked in for a longer gap.')+'</p>'
        + '<button class="btn-primary" id="recall-done">Go to the app &rarr;</button>'
        + '</div>';
      document.getElementById('recall-done').addEventListener('click', closeRecall);
      return;
    }

    const w = q.words[q.i];
    const m = w.me[0] || {};
    const head = '<div class="recall-head"><span>Recall check</span>'
      + '<span>'+(q.i+1)+' of '+q.words.length+'</span></div>'
      + '<h2 class="recall-title">Do you remember this word?</h2>'
      + '<p class="recall-how">'+RECALL_HOW+'</p>';

    let body = '';

    if(q.verdict !== null){
      // the same closing panel, whichever way it was asked
      body = '<div class="recall-subject">'+esc(w.w)+'</div>'
        + (w.p ? '<div class="recall-pron">/'+esc(w.p)+'/</div>' : '')
        + '<p class="recall-verdict" style="color:'+(q.verdict?'var(--good)':'var(--warn)')+';">'
          + (q.verdict ? 'Still yours' : 'Back into the rotation')+'</p>'
        + '<p class="recall-answer">'+esc(m.m||'')+(m.e ? '<br><em>&ldquo;'+esc(m.e)+'&rdquo;</em>' : '')+'</p>'
        + '<button class="btn-primary" id="recall-next">'
          + (q.i+1 >= q.words.length ? 'See how you did' : 'Next word')+' &rarr;</button>'
        + '<p class="recall-how" style="margin-top:9px;">Press Enter</p>';
    } else {
      body = '<p class="recall-prompt">'+esc(m.m||'')+'</p>'
        + (m.e ? '<p class="recall-ex">&ldquo;'+esc(m.e.replace(new RegExp('\\b'+escapeRegExp(w.w)+'\\b','gi'), '\u2014\u2014\u2014'))+'&rdquo;</p>' : '')
        + '<input type="text" class="recall-input" id="recall-input" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false" placeholder="Type the word...">'
        + '<button class="btn-primary" id="recall-check">Check</button>';
    }

    scrim.innerHTML = '<div class="recall-box">' + head + body
      + recallDots(q)
      + '<button class="recall-dismiss" id="recall-skip">Not now &mdash; take me to the app</button>'
      + '</div>';

    const on = function(id, fn){
      const b = document.getElementById(id);
      if(b) b.addEventListener('click', fn);
    };
    on('recall-skip', closeRecall);
    on('recall-next', recallNext);
    on('recall-check', function(){
      const input = document.getElementById('recall-input');
      recallAnswer(normalizeAnswer(input ? input.value : '') === normalizeAnswer(w.w));
    });

    const input = document.getElementById('recall-input');
    if(input){
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          // Answering redraws the panel, "Next word" appears, and this
          // same keypress would carry on up and press it. One key, one
          // step: the press that answers stops here.
          e.stopPropagation();
          recallAnswer(normalizeAnswer(input.value) === normalizeAnswer(w.w));
        }
      });
      input.focus();
    }

    // Enter answers, and then Enter again moves on. Assigned rather than
    // added, so redrawing the panel replaces this instead of stacking up
    // another copy of it.
    scrim.onkeydown = function(e){
      if(e.key !== 'Enter') return;
      const next = document.getElementById('recall-next');
      if(next){ e.preventDefault(); next.click(); }
    };

    // Without this the key has nowhere to land once the typing box is
    // gone, and the whole run would need the mouse again halfway through.
    const next = document.getElementById('recall-next');
    if(next) next.focus();
  }

  // --- Keeping your progress in a file -----------------------------------
  //
  // The browser is a fine place to read progress from and a poor place to
  // keep it: clearing site data, switching browser or moving laptop all
  // take it with them. So every change is also written to a plain file in
  // the project folder, which is the copy that actually lasts -- and,
  // since the folder is inside OneDrive, is carried off this machine too.
  //
  // The file follows the browser, never the other way round, with one
  // exception: if this browser has nothing at all and the file does, the
  // file is read back. That covers exactly the case this is for, and
  // means a backup can never quietly overwrite work you have just done.
  const BACKUP_URL = '/api/progress';
  let backupState = 'idle';   // idle | busy | saved | error | restored
  let backupNote = '';
  let backupHandle = null;

  function backupAvailable(){
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  function everythingLocal(){
    return {
      progress: progress,
      meta: meta,
      speech: speechScores,
      myList: myList,
      custom: customWords,
      learnSets: learnSets,
      chats: chats
    };
  }

  async function backupNow(){
    if(!backupAvailable()) return false;
    // An app holding nothing has nothing worth writing, and saving it
    // would look exactly like "forget everything" to the file that exists
    // to rescue this case. The server refuses it too; this stops it being
    // asked for at all.
    if(!Object.keys(progress).length) return false;
    backupState = 'busy';
    paintBackupLine();
    try{
      const res = await fetch(BACKUP_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: everythingLocal() })
      });
      if(res.status === 409){
        // the file holds more than this copy does; it is right, not us
        backupState = 'error';
        backupNote = 'The saved copy in your folder is ahead of this one, so it was left alone.';
        paintBackupLine();
        return false;
      }
      if(!res.ok) throw new Error('save failed');
      const out = await res.json();
      backupState = 'saved';
      backupNote = 'Saved to your folder at ' + new Date().toLocaleTimeString();
      paintBackupLine();
      return true;
    }catch(e){
      backupState = 'error';
      backupNote = 'Could not write the backup. Is the Word Log window still running?';
      paintBackupLine();
      return false;
    }
  }

  // Debounced, because a session writes after every single card.
  function backupSoon(){
    if(!backupAvailable()) return;
    if(backupHandle) clearTimeout(backupHandle);
    backupHandle = setTimeout(()=>{ backupHandle = null; backupNow(); }, 3000);
  }

  function adoptBackup(b){
    progress = b.progress || {};
    // Study time is earned, so take whichever side has more for each day
    // rather than letting one replace the other outright.
    const mineStudy = (meta && meta.study) || {};
    meta = b.meta || meta;
    if(!meta.study) meta.study = {};
    Object.keys(mineStudy).forEach(day=>{
      if((mineStudy[day] || 0) > (meta.study[day] || 0)) meta.study[day] = mineStudy[day];
    });
    speechScores = b.speech || {};
    myList = b.myList || [];
    customWords = b.custom || [];
    if(b.chats) chats = { current: b.chats.current || null, past: b.chats.past || [] };
    learnSets = b.learnSets || {};
    if(!meta.streak) meta.streak = {current:0, longest:0, lastDate:null};
    if(!meta.history) meta.history = [];
    if(!meta.passes) meta.passes = {};
    // Words you added on a machine whose browser storage is now gone have
    // to rejoin WORDS, or their progress would point at ids nothing here
    // can resolve.
    customWords.forEach(w=>{ if(!WORDS.some(x=>x.id === w.id)) WORDS.push(w); });
    saveProgressLocal();
    saveMeta();
    saveSpeechScores();
    saveMyList();
    saveCustomWords();
    saveLearnSets();
  }

  // Run once at startup. Only reads the file back when this browser has
  // nothing of its own, so it can never undo anything.
  async function restoreIfEmpty(){
    if(!backupAvailable()) return false;
    if(Object.keys(progress).length) return false;
    try{
      const res = await fetch(BACKUP_URL, { cache: 'no-store' });
      if(!res.ok) return false;
      const saved = await res.json();
      const data = saved && saved.data;
      if(!data || !data.progress || !Object.keys(data.progress).length) return false;
      adoptBackup(data);
      backupState = 'restored';
      backupNote = 'Your progress was restored from the backup in your folder.';
      return true;
    }catch(e){
      return false;
    }
  }

  function backupLineHtml(){
    if(!backupAvailable()){
      return '<div class="backup-line" id="backup-line"><span class="backup-dot"></span>'
        + 'Opened as a file, so nothing is being backed up.</div>';
    }
    const cls = backupState === 'busy' ? 'busy'
      : (backupState === 'error' ? 'bad' : 'on');
    const label = backupState === 'busy' ? 'Saving&hellip;'
      : (backupNote ? esc(backupNote) : 'Your progress is kept in your folder as well');
    return '<div class="backup-line" id="backup-line">'
      + '<span class="backup-dot '+cls+'"></span><span>'+label+'</span>'
      + '<button id="backup-now">Save now</button>'
      + '</div>';
  }

  function wireBackupLine(){
    const b = document.getElementById('backup-now');
    if(b) b.addEventListener('click', ()=>{ backupNow(); });
  }

  // Repaints only this line, so a save finishing never disturbs the page.
  function paintBackupLine(){
    const host = document.getElementById('backup-host');
    if(!host) return;
    host.innerHTML = backupLineHtml();
    wireBackupLine();
  }

  // A tab being closed is the one moment a pending save would be lost.
  window.addEventListener('pagehide', ()=>{
    if(!backupHandle || !backupAvailable()) return;
    if(!Object.keys(progress).length) return;
    clearTimeout(backupHandle);
    try{
      const blob = new Blob([JSON.stringify({ data: everythingLocal() })],
                            { type: 'application/json' });
      // fetch would be cancelled with the page; a beacon is not. The
      // server takes it on PUT, so send it as one where possible.
      fetch(BACKUP_URL, { method:'PUT', body: blob, keepalive: true,
                          headers: { 'Content-Type': 'application/json' } });
    }catch(e){}
  });

  // --- Which words you finished, and when -------------------------------
  //
  // Words mastered before the app started recording the day are dated by
  // the last time they were practised, which for a finished word is the
  // session that finished it. Close enough to be honest, and the only
  // thing that history offers.
  let calYear = null, calMonth = null, calPicked = null;
  let resetArmed = false;   // Reset progress asks in the page, not in a popup

  function dayKey(iso){
    if(!iso) return null;
    const d = new Date(iso);
    if(isNaN(d.getTime())) return null;
    return todayStr(d);
  }

  // Days you practised on, from the session history, whether or not
  // anything was finished. Without this the calendar reads as empty on
  // days you actually sat down and worked.
  function practisedByDay(){
    const days = {};
    (meta.history || []).forEach(h=>{
      if(!h || !h.date) return;
      const d = days[h.date] = days[h.date] || { sessions:0, cards:0 };
      d.sessions++;
      d.cards += (h.total || 0);
    });
    return days;
  }

  function masteredByDay(){
    const days = {};
    WORDS.forEach(w=>{
      const p = progress[w.id];
      if(!p || statusOf(w.id) !== 'mastered') return;
      const key = dayKey(p.masteredAt || p.lastSeen);
      if(!key) return;
      (days[key] = days[key] || []).push(w);
    });
    return days;
  }

  function calendarHtml(){
    const days = masteredByDay();
    const sat = practisedByDay();
    const keys = Object.keys(days).concat(Object.keys(sat)).sort();
    const now = new Date();
    if(calYear === null){
      // open on the month of the most recent finished word, not on an
      // empty month, so there is something to see straight away
      const last = keys.length ? keys[keys.length-1] : todayStr();
      const parts = last.split('-').map(Number);
      calYear = parts[0]; calMonth = parts[1]-1;
    }

    const first = new Date(calYear, calMonth, 1);
    const lead = first.getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const monthName = first.toLocaleDateString('en-US', {month:'long', year:'numeric'});

    // Back is always open -- looking at a month before you started is
    // harmless, and refusing it strands you when everything you have is in
    // one month. Forward stops at this month, since later is not history.
    const atEnd = new Date(calYear, calMonth, 1) >= new Date(now.getFullYear(), now.getMonth(), 1);

    let cells = ['S','M','T','W','T','F','S']
      .map(d=>'<div class="cal-dow">'+d+'</div>').join('');
    for(let i=0;i<lead;i++) cells += '<div class="cal-day blank"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const key = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const got = days[key] ? days[key].length : 0;
      const worked = sat[key];
      const cls = ['cal-day'];
      if(got) cls.push('has');
      else if(worked) cls.push('sat');
      if(key === todayStr()) cls.push('today');
      if(key === calPicked) cls.push('sel');
      // stronger shading the more words landed that day
      const shade = got ? ' style="background:rgba(92,174,124,'+Math.min(.10 + got*0.10, .45)+');"' : '';
      cells += '<button class="'+cls.join(' ')+'"'+shade
        + ((got || worked) ? ' data-day="'+key+'"' : ' disabled')+'>'
        + '<span>'+d+'</span>'
        + (got ? '<span class="cal-count">'+got+'</span>'
               : (worked ? '<span class="cal-dot"></span>' : ''))
        + '</button>';
    }

    // friendlyDate says "Today" and "Yesterday", which do not take the
    // "on" that a date does.
    const when = key => (key === todayStr() || friendlyDate(key) === 'Yesterday')
      ? friendlyDate(key).toLowerCase()
      : 'on ' + friendlyDate(key);

    let below;
    const picked = calPicked && (days[calPicked] || sat[calPicked]) ? calPicked : null;
    if(picked && days[picked]){
      const list = days[picked].slice().sort((a,b)=>a.w.localeCompare(b.w));
      const worked = sat[picked];
      below = '<div class="cal-list">'
        + '<div class="cal-list-head">'+list.length+' word'+(list.length===1?'':'s')
          + ' finished '+when(picked)
          + (worked ? ' &middot; '+worked.cards+' cards' : '')+'</div>'
        + list.map(w=>'<div class="cal-word"><span>'+esc(w.w)+'</span>'
            + '<em>'+esc(CAT_ABBR[w.cat]||w.cat)+'</em></div>').join('')
        + '</div>';
    } else if(picked){
      const worked = sat[picked];
      below = '<div class="cal-list">'
        + '<div class="cal-list-head">'+friendlyDate(picked)+'</div>'
        + '<p class="cal-empty">'+worked.cards+' card'+(worked.cards===1?'':'s')
          + ' over '+worked.sessions+' session'+(worked.sessions===1?'':'s')
          + ', and nothing crossed the line that day. That is still practice.</p>'
        + '</div>';
    } else {
      const total = Object.keys(days).reduce((n,k)=>n+days[k].length, 0);
      const workedDays = Object.keys(sat).length;
      below = '<div class="cal-list"><p class="cal-empty">'
        + (total
            ? 'Tap a day to see what you finished on it.'
            : (workedDays
                ? 'You have practised on '+workedDays+' day'+(workedDays===1?'':'s')+'. '
                  + 'A day turns green once a word is finished on it.'
                : 'Nothing here yet. Days you practise get a dot, and days you finish a word turn green.'))
        + '</p></div>';
    }

    return '<div class="cal-head">'
        + '<span class="cal-title">'+monthName+'</span>'
        + '<span class="cal-nav">'
          + '<button id="cal-prev" aria-label="Previous month">&lsaquo;</button>'
          + '<button id="cal-next"'+(atEnd?' disabled':'')+' aria-label="Next month">&rsaquo;</button>'
        + '</span>'
      + '</div>'
      + '<div class="cal-grid">'+cells+'</div>'
      + '<div class="cal-legend">'
        + '<span><i class="cal-key fin"></i>finished words</span>'
        + '<span><i class="cal-key prac"></i>practised</span>'
      + '</div>'
      + below;
  }

  // Repaints only the calendar, so changing month never disturbs the rest
  // of the page or restarts the Keep them fresh rotation.
  function paintCalendar(){
    const host = document.getElementById('cal-host');
    if(!host) return;
    host.innerHTML = calendarHtml();
    wireCalendar();
  }

  function wireCalendar(){
    const prev = document.getElementById('cal-prev');
    const next = document.getElementById('cal-next');
    if(prev) prev.addEventListener('click', ()=>{
      calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
      calPicked = null; paintCalendar();
    });
    if(next) next.addEventListener('click', ()=>{
      calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
      calPicked = null; paintCalendar();
    });
    document.querySelectorAll('.cal-day[data-day]').forEach(b=>{
      b.addEventListener('click', ()=>{
        calPicked = (calPicked === b.dataset.day) ? null : b.dataset.day;
        paintCalendar();
      });
    });
  }

  // --- Adding a word you did not know ------------------------------------
  //
  // Select any word on a card and this offers to look it up. The server
  // asks Claude for the entry in the same style as the rest of the
  // spreadsheet, appends the row, and rebuilds -- so a refresh has it.
  //
  // The selection has to be a plausible word or short phrase, or every
  // stray drag across a sentence would pop a button up.
  let glossBubble = null;
  const GLOSS_LAST = 'wordlog_last_glossary_topic';

  // Your own spreadsheet already holds the Spanish for 1410 words, in
  // the form "Evening meal -- Cena." When the selection is one of them
  // there is nothing to ask anybody: it is on the page already.
  function spanishFromSheet(text){
    const want = (text || '').trim().toLowerCase().replace(/^to /, '');
    if(!want) return '';
    for(let i = 0; i < WORDS.length; i++){
      const w = WORDS[i];
      if(w.w.toLowerCase().replace(/^to /, '') !== want) continue;
      const first = (w.me || [])[0];
      const m = first && first.m ? first.m : '';
      // the part after the dash is the Spanish, minus its full stop
      const cut = m.split(/\s[\u2014\u2013-]\s/);
      if(cut.length > 1){
        const es = cut[cut.length - 1].trim().replace(/\.$/, '');
        if(es) return es;
      }
    }
    return '';
  }

  function plausibleWord(text){
    const t = (text || '').trim().replace(/\s+/g, ' ');
    if(t.length < 2 || t.length > 40) return null;
    if(!/^[A-Za-z][A-Za-z'\-]*( [A-Za-z'\-]+){0,3}$/.test(t)) return null;
    return t;
  }

  function clearGlossBubble(){
    if(glossBubble){ glossBubble.remove(); glossBubble = null; }
    const pick = document.getElementById('gloss-pick');
    if(pick) pick.remove();
  }

  // Which list should the word join? Asked every time, with the one you
  // chose last offered first -- a run of new words usually belongs
  // together, and it saves re-reading five options each time.
  function askWhichTopic(word, context, left, top){
    clearGlossBubble();
    let last = '';
    try{ last = localStorage.getItem(GLOSS_LAST) || ''; }catch(e){}
    const order = CATEGORIES.slice().sort((a,b)=>
      (b === last ? 1 : 0) - (a === last ? 1 : 0));

    const panel = document.createElement('div');
    panel.id = 'gloss-pick';
    panel.className = 'gloss-pick';
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    panel.innerHTML = '<div class="gloss-pick-head">Add <b>' + esc(word) + '</b> to</div>'
      + order.map(c=>'<button data-sheet="'+esc(c)+'"'
          + (c === last ? ' class="last"' : '')+'>'+esc(c)+'</button>').join('')
      + '<button class="gloss-cancel">Never mind</button>';
    panel.addEventListener('mousedown', e=>e.preventDefault());
    document.body.appendChild(panel);

    // The panel is much taller than the little bubble was, so opening it
    // upwards runs it off the top whenever the word is near it. Measure,
    // then flip below or nudge sideways if it does not fit.
    const box = panel.getBoundingClientRect();
    if(box.top < 8){
      panel.style.transform = 'translate(-50%, 0)';
      panel.style.top = (top + 26) + 'px';
    }
    const after = panel.getBoundingClientRect();
    if(after.left < 8){
      panel.style.left = (parseFloat(panel.style.left) + (8 - after.left)) + 'px';
    } else if(after.right > window.innerWidth - 8){
      panel.style.left = (parseFloat(panel.style.left) - (after.right - window.innerWidth + 8)) + 'px';
    }

    panel.querySelectorAll('button[data-sheet]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const sheet = b.dataset.sheet;
        try{ localStorage.setItem(GLOSS_LAST, sheet); }catch(e){}
        panel.remove();
        addToGlossary(word, context, sheet);
      });
    });
    panel.querySelector('.gloss-cancel').addEventListener('click', ()=>{
      panel.remove();
      const sel = window.getSelection(); if(sel) sel.removeAllRanges();
    });
  }

  // A message about a word, over the page. It goes when you tap it, and
  // by itself if you do not -- it should never be something to wait out.
  function glossToast(message, tone, ms){
    const old = document.getElementById('gloss-toast');
    if(old) old.remove();
    const el = document.createElement('div');
    el.id = 'gloss-toast';
    el.className = 'gloss-toast' + (tone ? ' ' + tone : '');
    el.innerHTML = message + '<span class="toast-close">Tap to dismiss</span>';
    el.addEventListener('click', ()=>{ if(el.parentNode) el.remove(); });
    document.body.appendChild(el);
    if(ms) setTimeout(()=>{ if(el.parentNode) el.remove(); }, ms);
    return el;
  }

  async function addToGlossary(word, context, sheet){
    glossToast('Looking up <b>' + esc(word) + '</b> for ' + esc(sheet) + '\u2026');
    try{
      const res = await fetch('/api/glossary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: word, context: context || '', sheet: sheet })
      });
      const out = await res.json();
      clearGlossBubble();
      if(out.added){
        const m = out.entry && out.entry.meanings && out.entry.meanings[0];
        glossToast('<b>' + esc(out.entry.word) + '</b> added to ' + esc(out.sheet) + '.'
          + (m ? '<br>' + esc(m.meaning) : '')
          + '<br><small>Refresh to practice it.</small>', 'ok', 9000);
      } else if(out.already){
        // Show what the sheet already says, so you can see whether it is
        // really the same word rather than just being told "no".
        glossToast(esc(out.message)
          + (out.meaning ? '<br>' + esc(out.meaning) : '')
          + '<br><small>Nothing was added.</small>', 'ok', 8000);
      } else if(out.queued){
        glossToast(esc(out.message) + '<br><small>It is waiting in '
          + 'progress/pending-words.json.</small>', 'bad', 9000);
      } else {
        glossToast(esc(out.message || 'That did not work.'), 'bad', 7000);
      }
    }catch(e){
      clearGlossBubble();
      glossToast('Could not reach the app server.', 'bad', 6000);
    }
  }

  // The sentence the word came from, so the lookup can tell which sense
  // is meant -- "harness" on a dog is not "harness" on an engine.
  function selectionContext(node){
    const host = node && node.closest
      ? (node.closest('.card') || node.closest('.chat-bubble')) : null;
    const text = host ? host.innerText : '';
    return text.replace(/\s+/g, ' ').trim().slice(0, 300);
  }

  function onSelectionChanged(){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.rangeCount){ clearGlossBubble(); return; }
    // Anything readable can be asked about; only something word-shaped
    // can be added to the spreadsheet.
    const phrase = sel.toString().replace(/\s+/g, ' ').trim();
    if(phrase.length < 2 || phrase.length > 200){ clearGlossBubble(); return; }
    const word = plausibleWord(phrase);

    const range = sel.getRangeAt(0);
    const anchor = range.commonAncestorContainer;
    const node = anchor.nodeType === 1 ? anchor : anchor.parentElement;
    // Inside a practice card or something said in a conversation. Anywhere
    // else -- the app's own labels and buttons -- would just be noise.
    const within = node && node.closest
      ? (node.closest('.card') || node.closest('.chat-bubble')) : null;
    if(!within){ clearGlossBubble(); return; }

    const rect = range.getBoundingClientRect();
    if(!rect || (!rect.width && !rect.height)){ clearGlossBubble(); return; }

    clearGlossBubble();
    const context = selectionContext(node);
    const left = rect.left + rect.width/2 + window.scrollX;
    const top = rect.top + window.scrollY - 8;

    const bar = document.createElement('div');
    bar.className = 'gloss-bar';
    bar.style.left = left + 'px';
    bar.style.top = top + 'px';
    bar.addEventListener('mousedown', e=>e.preventDefault());  // keep the selection

    // What it says, in Spanish, without being asked. Understanding is the
    // usual reason for highlighting something; the buttons are for the
    // times that is not enough.
    const es = document.createElement('div');
    es.className = 'gloss-es';
    const known = spanishFromSheet(phrase);
    if(known){
      es.innerHTML = esc(known)
        + '<span class="gloss-es-from">from your spreadsheet</span>';
    } else {
      es.innerHTML = '<span class="gloss-es-wait">translating&hellip;</span>';
      askSpanish(phrase, context, es);
    }
    bar.appendChild(es);

    // Anything you can read, you can ask about. Whole sentences included:
    // not understanding is usually about a phrase, not a single word.
    const actions = document.createElement('div');
    actions.className = 'gloss-actions';
    bar.appendChild(actions);

    const askBtn = document.createElement('button');
    askBtn.className = 'ask';
    askBtn.textContent = 'Explain it';
    askBtn.addEventListener('click', ()=>explainSelection(phrase, context, within));
    actions.appendChild(askBtn);

    // Adding to the spreadsheet only makes sense for something word-shaped.
    if(word){
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Add \u201c' + word + '\u201d';
      addBtn.addEventListener('click', ()=>askWhichTopic(word, context, left, top));
      actions.appendChild(addBtn);
    }

    document.body.appendChild(bar);
    // keep it on screen if the selection is near an edge
    const box = bar.getBoundingClientRect();
    if(box.left < 8) bar.style.left = (left + (8 - box.left)) + 'px';
    else if(box.right > window.innerWidth - 8)
      bar.style.left = (left - (box.right - window.innerWidth + 8)) + 'px';
    if(box.top < 8){ bar.style.transform = 'translate(-50%, 0)'; bar.style.top = (top + 26) + 'px'; }

    glossBubble = bar;
  }

  // One at a time: dragging across a sentence changes the selection
  // several times, and only the last one is worth an answer.
  let glossAsk = 0;

  async function askSpanish(phrase, context, slot){
    const mine = ++glossAsk;
    try{
      const out = await fetch('/api/translate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phrase: phrase, context: context })
      }).then(r=>r.json());
      if(mine !== glossAsk || !slot.isConnected) return;
      slot.innerHTML = out.ok
        ? esc(out.es)
        : '<span class="gloss-es-wait">' + esc(out.message || 'no translation') + '</span>';
    }catch(e){
      if(mine !== glossAsk || !slot.isConnected) return;
      slot.innerHTML = '<span class="gloss-es-wait">the app server did not answer</span>';
    }
  }

  // Where the answer goes: under whatever was being read, so it stays next
  // to the thing it is about rather than floating over the page.
  function explainInto(within){
    let slot = within.parentElement
      ? within.parentElement.querySelector(':scope > .explain') : null;
    if(!slot){
      slot = document.createElement('div');
      slot.className = 'explain';
      (within.parentElement || within).appendChild(slot);
    }
    return slot;
  }

  async function explainSelection(phrase, context, within){
    clearGlossBubble();
    const sel = window.getSelection(); if(sel) sel.removeAllRanges();
    const slot = explainInto(within);
    slot.innerHTML = '<div class="explain-phrase">' + esc(phrase) + '</div>'
      + '<div class="explain-wait">asking&hellip;</div>';
    slot.scrollIntoView({ block:'nearest' });
    try{
      const out = await fetch('/api/explain', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phrase: phrase, context: context })
      }).then(r=>r.json());
      if(!out.ok){
        slot.innerHTML = '<div class="explain-phrase">' + esc(phrase) + '</div>'
          + '<div class="explain-note">' + esc(out.message || 'That did not work.') + '</div>';
        return;
      }
      slot.innerHTML = '<div class="explain-phrase">' + esc(out.phrase) + '</div>'
        + '<div>' + esc(out.meaning) + '</div>'
        + (out.spanish ? '<div class="explain-es">' + esc(out.spanish) + '</div>' : '')
        + (out.note ? '<div class="explain-note">' + esc(out.note) + '</div>' : '');
      slot.scrollIntoView({ block:'nearest' });
    }catch(e){
      slot.innerHTML = '<div class="explain-phrase">' + esc(phrase) + '</div>'
        + '<div class="explain-note">Could not reach the app server.</div>';
    }
  }

  document.addEventListener('selectionchange', ()=>{
    // let the selection settle before measuring it
    clearTimeout(window.__glossTimer);
    window.__glossTimer = setTimeout(onSelectionChanged, 180);
  });
  document.addEventListener('scroll', clearGlossBubble, true);

  // --- Setting up the lookup ---------------------------------------------
  // Everything else about the glossary is automatic; this is the one thing
  // that needs a human, so it asks for as little as possible: paste, press,
  // done. The key is checked before it is saved, so a typo is caught now
  // rather than the next time a word fails to be added.
  let keyState = null;   // {hasKey, pending:[]}

  async function loadKeyState(){
    try{
      keyState = await fetch('/api/glossary', {cache:'no-store'}).then(r=>r.json());
    }catch(e){ keyState = null; }
    paintKeyRow();
  }

              + list.slice().sort((a,b)=>voiceRank(b)-voiceRank(a))
                  .map(v=>'<option value="'+esc(v.name)+'"'

  function wireVoiceRow(){
    const sel = document.getElementById('voice-pick');
    if(sel) sel.addEventListener('change', ()=>{
      chosenVoiceName = sel.value;
      try{ localStorage.setItem(VOICE_KEY, chosenVoiceName); }catch(e){}
