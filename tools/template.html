  function keyRowHtml(){
    if(!keyState) return '';
    const waiting = (keyState.pending || []).length;
    if(keyState.hasKey){
      return '<div class="key-row"><span class="key-dot on"></span>'
        + '<span>Word lookup is on. Select a word while practising to add it.</span>'
        + (waiting
            ? ' <button class="reset-link" id="key-fill" style="display:inline; width:auto; margin:0;">'
              + 'Fill in the '+waiting+' word'+(waiting===1?'':'s')+' waiting &rarr;</button>'
            : '')
        + '</div>';
    }
    return '<div class="key-row"><span class="key-dot"></span>'
      + '<span>Word lookup needs an Anthropic API key'
      + (waiting ? ' &mdash; '+waiting+' word'+(waiting===1?'':'s')+' waiting' : '')
      + '.</span></div>'
      + '<div class="key-form">'
        + '<input type="password" id="key-input" placeholder="paste your key here" '
          + 'autocomplete="off" spellcheck="false">'
        + '<button id="key-save">Save</button>'
      + '</div>'
      + '<p class="hint">From console.anthropic.com &rarr; API Keys. It is checked before '
      + 'it is saved, kept in <b>server/anthropic_key.txt</b> on this laptop, and never '
      + 'sent anywhere except to Anthropic.</p>';
  }

  function paintKeyRow(){
    const host = document.getElementById('key-host');
    if(!host) return;
    host.innerHTML = keyRowHtml();
    wireKeyRow();
  }

  function wireKeyRow(){
    const save = document.getElementById('key-save');
    const input = document.getElementById('key-input');
    const fill = document.getElementById('key-fill');
    const send = async ()=>{
      const value = input ? input.value.trim() : '';
      if(!value) return;
      save.disabled = true; save.textContent = 'Checking\u2026';
      try{
        const out = await fetch('/api/key', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ key: value })
        }).then(r=>r.json());
        if(input) input.value = '';
        if(out.ok){
          glossToast('Key saved and working. Word lookup is on.', 'ok', 6000);
          await loadKeyState();
        } else {
          glossToast(esc(out.message || 'That key was not accepted.'), 'bad', 7000);
          save.disabled = false; save.textContent = 'Save';
        }
      }catch(e){
        glossToast('Could not reach the app server.', 'bad', 6000);
        save.disabled = false; save.textContent = 'Save';
      }
    };
    if(save) save.addEventListener('click', send);
    if(input) input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); send(); }
    });
    if(fill) fill.addEventListener('click', async ()=>{
      fill.disabled = true; fill.textContent = 'Filling them in\u2026';
      try{
        const out = await fetch('/api/glossary/pending', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:'{}'}).then(r=>r.json());
        glossToast(esc(out.message || 'Done.')
          + (out.added && out.added.length ? '<br>' + esc(out.added.join(', ')) : '')
          + '<br><small>Refresh to practice them.</small>', 'ok', 9000);
        await loadKeyState();
      }catch(e){
        glossToast('That did not work.', 'bad', 6000);
      }
    });
  }

  // --- Adding a word by typing it ----------------------------------------
  // The same road as selecting one while practising: Claude writes the
  // entry in the sheet's own style and the row is appended. Typing it is
  // just the other door into that.
  function addWordBlockHtml(){
    let last = '';
    try{ last = localStorage.getItem(GLOSS_LAST) || ''; }catch(e){}
    const options = CATEGORIES.map(c=>
      '<option value="'+esc(c)+'"'+(c===last?' selected':'')+'>'+esc(c)+'</option>').join('');
    return '<div class="addword">'
      + '<div class="addword-head"><span>Add a word</span>'
        + '<span class="band-hint">looked up and written into your spreadsheet</span></div>'
      + '<div class="addword-row">'
        + '<input type="text" id="addword-input" placeholder="A word you want to learn\u2026" '
          + 'autocomplete="off" autocapitalize="off" spellcheck="false">'
        + '<select id="addword-topic">'+options+'</select>'
        + '<button id="addword-go">Add</button>'
      + '</div>'
      + '<p class="hint" id="addword-note">Its pronunciation, meaning, example and notes are '
        + 'written for you, in the same style as the rest of the sheet.</p>'
      + '</div>';
  }

  async function submitNewWord(){
    const input = el('#addword-input');
    const topic = el('#addword-topic');
    const go = el('#addword-go');
    if(!input || !go) return;
    const word = input.value.trim();
    if(!word) { input.focus(); return; }

    const sheet = topic ? topic.value : CATEGORIES[0];
    try{ localStorage.setItem(GLOSS_LAST, sheet); }catch(e){}

    go.disabled = true; go.textContent = 'Adding\u2026';
    const note = el('#addword-note');
    if(note) note.textContent = 'Looking up \u201c' + word + '\u201d for ' + sheet + '\u2026';

    try{
      const out = await fetch('/api/glossary', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: word, context: '', sheet: sheet })
      }).then(r=>r.json());

      if(out.added){
        const m = out.entry && out.entry.meanings && out.entry.meanings[0];
        input.value = '';
        glossToast('<b>' + esc(out.entry.word) + '</b> added to ' + esc(out.sheet) + '.'
          + (m ? '<br>' + esc(m.meaning) : '')
          + '<br><small>Refresh to practice it.</small>', 'ok', 9000);
      } else if(out.already){
        // Show what the sheet already says, so you can see whether it is
        // really the same word rather than just being told "no".
        glossToast(esc(out.message)
          + (out.meaning ? '<br>' + esc(out.meaning) : '')
          + '<br><small>Nothing was added.</small>', 'ok', 8000);
      } else if(out.queued){
        // Say what went wrong, not just that something did -- otherwise
        // neither of us can tell a dropped connection from a real fault.
        glossToast(esc(out.message)
          + (out.detail ? '<br><small>' + esc(out.detail) + '</small>' : '')
          + '<br><small>It is waiting; there is a button to fill it in '
          + 'under Everything else.</small>', 'bad', 11000);
      } else {
        glossToast(esc(out.message || 'That did not work.'), 'bad', 7000);
      }
    }catch(e){
      glossToast('Could not reach the app server.', 'bad', 6000);
    }
    go.disabled = false; go.textContent = 'Add';
    if(note) note.textContent = 'Its pronunciation, meaning, example and notes are written '
      + 'for you, in the same style as the rest of the sheet.';
  }

  function wireAddWord(){
    const go = el('#addword-go');
    const input = el('#addword-input');
    if(go) go.addEventListener('click', submitNewWord);
    if(input) input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); submitNewWord(); }
    });
  }

  // --- The daily two hours -----------------------------------------------
  //
  // New words are earned. Put the time in today and tomorrow brings ten
  // more; do not, and you keep working the same ones -- which is what you
  // would want anyway, since ten words you have not learnt are not helped
  // by ten more arriving on top.
  //
  // The time has to be honestly measured, or the rule means nothing. It
  // counts only while a session is actually on screen, the window is
  // visible, and you have touched something in the last two minutes. A
  // card left open while you make dinner is not study.
  const DAILY_GOAL_MIN = 60;
  const STUDY_TICK_MS = 5000;
  const STUDY_IDLE_MS = 120000;

  let lastInteraction = Date.now();
  let studyTimer = null;
  let studyUnsaved = 0;

  function studySeconds(day){
    const all = (meta && meta.study) || {};
    return all[day || todayStr()] || 0;
  }

  function goalMet(day){
    return studySeconds(day) >= DAILY_GOAL_MIN * 60;
  }

  function addStudy(seconds){
    if(!meta.study) meta.study = {};
    const key = todayStr();
    meta.study[key] = (meta.study[key] || 0) + seconds;
    studyUnsaved += seconds;
    // written every half minute rather than every tick: it is a counter,
    // not something worth a disk write six times a minute
    if(studyUnsaved >= 30){
      studyUnsaved = 0;
      saveMeta();
      backupSoon();
    }
    paintStudyBar();
  }

  function studying(){
    if(document.visibilityState !== 'visible') return false;
    if(Date.now() - lastInteraction > STUDY_IDLE_MS) return false;
    // a card, the check at the door, or a conversation: all of it is study
    return !!document.querySelector('.card')
        || !!document.getElementById('recall-scrim')
        || !!document.querySelector('.chat-wrap');
  }

  function startStudyClock(){
    if(studyTimer) return;
    studyTimer = setInterval(()=>{
      if(studying()) addStudy(STUDY_TICK_MS / 1000);
    }, STUDY_TICK_MS);
  }

  ['pointerdown', 'keydown', 'touchstart'].forEach(ev=>
    document.addEventListener(ev, ()=>{ lastInteraction = Date.now(); }, true));
  window.addEventListener('pagehide', ()=>{
    if(studyUnsaved){ studyUnsaved = 0; saveMeta(); }
  });

  // "1 hour", "2 hours", "90 minutes" -- so the goal can be changed
  // without the sentences around it reading oddly.
  function goalWords(){
    if(DAILY_GOAL_MIN % 60 === 0){
      const h = DAILY_GOAL_MIN / 60;
      return h + ' hour' + (h === 1 ? '' : 's');
    }
    return DAILY_GOAL_MIN + ' minutes';
  }

  function hhmm(seconds){
    const m = Math.floor(seconds / 60);
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }

  function studyBarHtml(){
    const done = studySeconds();
    const goal = DAILY_GOAL_MIN * 60;
    const pct = Math.min(100, Math.round((done / goal) * 100));
    const met = done >= goal;
    const left = Math.max(0, Math.ceil((goal - done) / 60));

    let note;
    if(met){
      note = '<p class="studybar-note met"><b>Done for today.</b> Tomorrow brings '
        + LEARNSET_SIZE + ' new words.</p>';
    } else if(done === 0){
      note = '<p class="studybar-note">Study <b>' + hhmm(goal) + '</b> today and tomorrow '
        + 'brings ' + LEARNSET_SIZE + ' new words. Until then you keep the ones you have.</p>';
    } else {
      note = '<p class="studybar-note"><b>' + left + ' minute' + (left === 1 ? '' : 's')
        + ' to go</b> to unlock tomorrow&rsquo;s ' + LEARNSET_SIZE + ' words.</p>';
    }

    return '<div class="studybar" id="studybar">'
      + '<div class="studybar-line"><span>Studied today'
        + (studying() ? ' <span class="studying">&middot; counting</span>' : '')
        + '</span>'
        + '<span><b class="'+(met?'met':'')+'">' + hhmm(done) + '</b> of ' + hhmm(goal) + '</span></div>'
      + '<div class="studybar-track"><span class="'+(met?'met':'')+'" style="width:'+pct+'%"></span></div>'
      + note
      + '</div>';
  }

  // Repainted in place on every tick, so it never disturbs the page.
  function paintStudyBar(){
    const host = document.getElementById('studybar-host');
    if(host) host.innerHTML = studyBarHtml();
  }

  // --- Using the words for real ------------------------------------------
  //
  // Unlocked by finishing the day's ten, because there is no point
  // rehearsing words you have not learnt yet. Someone plays a part -- a
  // shop assistant, a landlord, an interviewer -- and the conversation is
  // built to need your words.
  //
  // Only what you write counts. The partner is told not to use the target
  // words itself, so each one has to come from you, and they tick off as
  // they do. Recognising a word is easy; producing one is the thing.
  const SCENARIOS = [
    { name:'At the shop',
      blurb:'You are buying something and there is a problem with it.',
      role:'You are a shop assistant. The customer has come in about something they bought that is not right. Be helpful but ask questions before agreeing to anything.' },
    { name:'A job interview',
      blurb:'You are being interviewed for a job you want.',
      role:'You are interviewing this person for a job. Ask about their experience, how they handle difficulty, and why they want the work. Be friendly but not easy.' },
    { name:'Renting a flat',
      blurb:'You are seeing a flat and asking about it.',
      role:'You are a landlord showing a flat. Answer questions about the place, the neighbours and the rules, and ask the viewer about themselves.' },
    { name:'At the doctor',
      blurb:'You are describing what is wrong.',
      role:'You are a doctor seeing a patient. Ask what is wrong, how long it has been going on, and what makes it better or worse.' },
    { name:'Catching up with a friend',
      blurb:'You have not seen each other for months.',
      role:'You are an old friend who has not seen them in months. Ask what they have been doing, tell them a little about yourself, and keep it light.' }
  ];

  let chat = null;   // { scenario, words, used:[], turns:[], busy, error }

  function chatWordsForToday(){
    return todaysSet().map(w=>w.w);
  }

  function chatUnlocked(){
    const set = todaysSet();
    return set.length > 0 && set.every(w=>statusOf(w.id)==='mastered');
  }

  // Kept between renders so asking for another does not lose the last.
  let chatMade = null;
  let chatDeleting = null;   // the one being asked about, if any

  function madeCardHtml(){
    if(chatMade === 'thinking'){
      return '<button class="scene scene-made" disabled>'
        + '<span class="scene-tag">Made for today&rsquo;s words</span>'
        + '<b>Thinking of one&hellip;</b>'
        + '<span>Looking for a situation these ten would really come up in.</span>'
        + '</button>';
    }
    if(chatMade && chatMade.name){
      return '<button class="scene scene-made" id="scene-made">'
        + '<span class="scene-tag">Made for today&rsquo;s words</span>'
        + '<b>'+esc(chatMade.name)+'</b><span>'+esc(chatMade.blurb||'')+'</span></button>'
        + '<div class="scene-actions">'
          + '<button class="btn-secondary" id="scene-another">Think of another</button>'
        + '</div>';
    }
    return '<button class="scene scene-made" id="scene-make">'
      + '<span class="scene-tag">Made for today&rsquo;s words</span>'
      + '<b>Build one around these ten</b>'
      + '<span>A situation where your words would actually come up, '
      + 'rather than one off a list.</span></button>';
  }

  async function makeScenario(){
    chatMade = 'thinking';
    renderChatPicker();
    try{
      const out = await fetch('/api/scenario', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ words: chatWordsForToday() })
      }).then(r=>r.json());
      chatMade = out.ok ? out : null;
      if(!out.ok) glossToast(esc(out.message || 'Could not think of one.'), 'bad', 6000);
    }catch(e){
      chatMade = null;
      glossToast('Could not reach the app server.', 'bad', 6000);
    }
    renderChatPicker();
  }

  function renderChatPicker(){
    const words = chatWordsForToday();
    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Conversation</div>'
      + '<h1 class="title">Use them for real</h1>'
      + '<p class="subtitle">Someone plays a part and you talk to them. Your '
        + words.length + ' words are the ones the conversation is built to need &mdash; '
        + 'and only the ones <em>you</em> write count. Once you are in, say '
        + '<b>&ldquo;imagine we are&hellip;&rdquo;</b> at any point and the '
        + 'conversation moves to wherever you said.</p>'
      + '<div class="chat-words">'
        + words.map(w=>'<span class="chat-word">'+esc(w)+'</span>').join('')
      + '</div>'
      + (chats.current && (chats.current.turns||[]).length
          ? '<div class="section-label">Left unfinished</div>'
            + '<button class="scene" id="chat-resume">'
              + '<b>' + esc(chats.current.scenario.name) + '</b>'
              + '<span>' + (chats.current.turns.length) + ' messages &middot; '
              + (chats.current.used||[]).length + ' of ' + (chats.current.words||[]).length
              + ' words used. Carry on where you stopped.</span></button>'
            + '<button class="reset-link" id="drop-current" style="color:var(--warn); margin-top:2px;">'
            + (chatDeleting === chats.current.id
                ? 'Tap again to throw this one away' : 'Throw it away instead')+'</button>'
          : '')
      + '<div class="section-label">Pick a situation</div>'
      + madeCardHtml()
      + SCENARIOS.map((sc,i)=>'<button class="scene" data-i="'+i+'">'
          + '<b>'+esc(sc.name)+'</b><span>'+esc(sc.blurb)+'</span></button>').join('')
      + ((chats.past||[]).length
          ? '<div class="section-label">Conversations you have had</div>'
            + chats.past.map(c=>'<div class="past-item">'
                + '<button class="past-row" data-open="'+esc(c.id)+'">'
                  + '<b>'+esc(c.scenario.name)+'</b>'
                  + '<span>'+friendlyDate((c.endedAt||c.startedAt||'').slice(0,10))
                  + ' &middot; ' + (c.used||[]).length + ' of ' + (c.words||[]).length + ' words'
                  + ' &middot; ' + (c.turns||[]).length + ' messages</span></button>'
                + (chatDeleting === c.id
                    ? '<button class="past-del sure" data-confirm="'+esc(c.id)+'">Delete</button>'
                      + '<button class="past-del" data-cancel="1" aria-label="Keep it">'+ICON_X+'</button>'
                    : '<button class="past-del" data-del="'+esc(c.id)+'" '
                      + 'aria-label="Delete this conversation">'+ICON_X+'</button>')
                + '</div>').join('')
          : '')
      + '<button class="btn-secondary" id="chat-home" style="margin-top:14px;">&larr; Back to home</button>'
      + '</div>';

    root.querySelectorAll('.scene[data-i]').forEach(b=>{
      b.addEventListener('click', ()=>startChat(SCENARIOS[+b.dataset.i], words));
    });
    const make = el('#scene-make');
    if(make) make.addEventListener('click', makeScenario);
    const another = el('#scene-another');
    if(another) another.addEventListener('click', makeScenario);
    const made = el('#scene-made');
    if(made) made.addEventListener('click', ()=>startChat(chatMade, words));
    const resume = el('#chat-resume');
    if(resume) resume.addEventListener('click', ()=>{ if(!resumeChat()) renderChatPicker(); });
    const drop = el('#drop-current');
    if(drop) drop.addEventListener('click', ()=>{
      if(chatDeleting === chats.current.id){ deleteChat(chats.current.id); chatDeleting = null; }
      else { chatDeleting = chats.current.id; }
      renderChatPicker();
    });
    root.querySelectorAll('.past-row[data-open]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const c = (chats.past||[]).find(x=>x.id === b.dataset.open);
        renderPastChat(c);
      });
    });
    root.querySelectorAll('.past-del[data-del]').forEach(b=>{
      b.addEventListener('click', ()=>{ chatDeleting = b.dataset.del; renderChatPicker(); });
    });
    root.querySelectorAll('.past-del[data-cancel]').forEach(b=>{
      b.addEventListener('click', ()=>{ chatDeleting = null; renderChatPicker(); });
    });
    root.querySelectorAll('.past-del[data-confirm]').forEach(b=>{
      b.addEventListener('click', ()=>{
        deleteChat(b.dataset.confirm);
        chatDeleting = null;
        renderChatPicker();
      });
    });
    el('#chat-home').addEventListener('click', renderHome);
  }

  // --- Talking to it -------------------------------------------------
  // The same recognizer the practice cards use, so it inherits the one
  // permission and the guard against a late result from a turn you have
  // already left. What you said goes in as your message: a conversation
  // where you have to press send after speaking is not a conversation.
  let chatListening = false;
  let chatVoiceOnly = false;   // talking, with nothing written down
  let chatPhase = 'idle';      // idle | listening | thinking | speaking
  let chatHeard = '';          // the last thing it caught, for when it mishears
  let chatNote = '';           // a correction, shown beside the circle
  let chatNoteTimer = null;
  let chatSilence = null;      // how long it has been quiet
  let chatTurnClosed = false;  // this turn is over; a late result is not wanted

  // How long a silence is allowed to be before it counts as the end of
  // your turn. Learning a language means stopping mid-sentence to find a
  // word, and the browser's own idea of a finished sentence is far too
  // quick for that -- it would cut you off and answer half a thought.
  const CHAT_PAUSE_MS = 4000;    // after you have said something
  const CHAT_FIRST_MS = 15000;   // before you have said anything at all
  const CHAT_MAX_MS = 90000;     // a whole turn, however long you take
  let talkShown = false;       // the last line, shown because you asked for it
  let talkGloss = null;        // and what it means, if you asked that too
  let chatSpeaks = true;
  try{ chatSpeaks = localStorage.getItem('wordlog_chat_voice') !== 'off'; }catch(e){}

  function chatSay(text, then){
    if(!chatSpeaks || !canSpeak || !text){ if(then) then(); return; }
    speak(text, then);
  }

  function stopChatListening(){
    chatListening = false;
    chatTurnClosed = true;
    if(chatSilence){ clearTimeout(chatSilence); chatSilence = null; }
    if(chatPhase === 'listening') chatPhase = 'idle';
    scStopListening();
  }

  async function chatListen(){
    if(!canListen || !chat || chat.busy) return;
    if(chatListening){ stopChatListening(); renderChat(); return; }

    stopSpeaking();  // do not listen to itself
    scStopListening();
    const token = ++scToken;
    chatListening = true;
    chatPhase = 'listening';
    renderChat();

    const ok = await ensureMic();
    if(scToken !== token) return;
    if(!ok){
      chatListening = false;
      chat.error = speechErrorMessage('not-allowed');
      renderChat();
      return;
    }

    // Listening carries on through a pause. The browser's recognizer will
    // still stop by itself -- there is no setting for "wait longer" -- so
    // it is started again underneath, and a clock of our own decides when
    // the turn is actually over.
    const recognition = scGetRecognizer();
    recognition.continuous = true;
    recognition.interimResults = true;

    let settled = '';        // what it has committed to
    let pending = '';        // what it is still hearing
    let restarts = 0;
    chatTurnClosed = false;
    const began = Date.now();

    const quietFor = (ms)=>{
      if(chatSilence) clearTimeout(chatSilence);
      chatSilence = setTimeout(()=>{
        if(scToken !== token) return;
        closeTurn();
      }, ms);
    };

    const closeTurn = ()=>{
      if(chatTurnClosed || scToken !== token) return;
      chatTurnClosed = true;
      if(chatSilence){ clearTimeout(chatSilence); chatSilence = null; }
      chatListening = false;
      try{ recognition.stop(); }catch(e){}
      const said = (settled + ' ' + pending).replace(/\s+/g, ' ').trim();
      if(!said){
        chatPhase = 'idle';
        renderChat();
        return;
      }
      chatHeard = said;
      sendChat(false, said);
    };

    recognition.onresult = (e)=>{
      if(scToken !== token || chatTurnClosed) return;
      pending = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        const text = (r[0] && r[0].transcript) || '';
        if(r.isFinal) settled += (settled ? ' ' : '') + text.trim();
        else pending += text;
      }
      // Every word heard puts the clock back to the beginning, so a long
      // sentence with three pauses in it is still one turn.
      quietFor(CHAT_PAUSE_MS);
    };

    recognition.onerror = (e)=>{
      if(scToken !== token || chatTurnClosed) return;
      const code = e.error || 'error';
      // Silence is not a failure here: it is someone thinking.
      if(code === 'no-speech') return;
      if(code === 'aborted') return;
      if(code === 'not-allowed' || code === 'service-not-allowed') setMicGranted(false);
      chatTurnClosed = true;
      if(chatSilence){ clearTimeout(chatSilence); chatSilence = null; }
      chatListening = false;
      chat.error = speechErrorMessage(code);
      renderChat();
    };

    recognition.onend = ()=>{
      if(scToken !== token || chatTurnClosed) return;
      if(!chatListening) return;
      // It stopped on its own, which it does every few seconds of quiet.
      // Start it again unless this has gone on long enough to be a fault.
      if(restarts < 40 && Date.now() - began < CHAT_MAX_MS){
        restarts++;
        try{ recognition.start(); return; }catch(err){}
      }
      closeTurn();
    };

    setTimeout(()=>{
      if(scToken !== token) return;
      try{
        recognition.start();
        quietFor(CHAT_FIRST_MS);
      }
      catch(err){
        try{ recognition.abort(); }catch(e2){}
        scRecognizer = null;
        chatListening = false;
        chat.error = speechErrorMessage('error');
        renderChat();
      }
    }, 250);
  }

  function startChat(scenario, words){
    parkCurrentChat();
    chatPhase = 'idle';
    chatHeard = '';
    chat = { id: newChatId(), scenario: scenario, words: words, used: [], turns: [],
             startedAt: new Date().toISOString(), sceneAt: 0, busy: true, error: '' };
    rememberChat();
    renderChat();
    sendChat(true);
  }

  // Written after every turn, so closing the tab mid-conversation costs
  // nothing. Only the conversation itself is kept -- not the busy flag or
  // the error, which mean nothing once you come back to it.
  function rememberChat(){
    chats.current = chat ? {
      id: chat.id, scenario: chat.scenario, words: chat.words, used: chat.used,
      turns: chat.turns, startedAt: chat.startedAt, sceneAt: chat.sceneAt || 0
    } : null;
    saveChats();
  }

  // Whatever was open goes to the list rather than being dropped, so
  // opening a second conversation never costs you the first.
  function parkCurrentChat(){
    const open = chats.current;
    if(open && (open.turns || []).length){
      chats.past = (chats.past || []).filter(c=>c.id !== open.id);
      chats.past.unshift(open);
    }
    chats.current = null;
  }

  function openChat(saved){
    if(!saved) return false;
    if(!chats.current || chats.current.id !== saved.id) parkCurrentChat();
    chats.past = (chats.past || []).filter(c=>c.id !== saved.id);
    chat = { id: saved.id || newChatId(), scenario: saved.scenario,
             words: saved.words || [], used: saved.used || [],
             turns: saved.turns || [], startedAt: saved.startedAt,
             sceneAt: saved.sceneAt || 0, busy: false, error: '' };
    rememberChat();
    renderChat();
    return true;
  }

  function resumeChat(){
    return openChat(chats.current);
  }

  function deleteChat(id){
    chats.past = (chats.past || []).filter(c=>c.id !== id);
    if(chats.current && chats.current.id === id) chats.current = null;
    saveChats();
  }

  // The written conversation: what was said, and a box to answer in.
  function writtenChatHtml(){
    return '<div class="chat-log" id="chat-log">'
        + chat.turns.map(t=>{
            if(t.who === 'scene'){
              return '<div class="scene-turn"><span>now imagine</span>'
                + '<b>'+esc(t.text)+'</b>'
                + (t.blurb ? '<em>'+esc(t.blurb)+'</em>' : '') + '</div>';
            }
            if(t.who === 'you'){
              return '<div class="chat-turn you"><div class="chat-who">You</div>'
                + '<div class="chat-bubble">'+esc(t.text)+'</div>'
                + (t.scored && t.scored.length
                    ? '<div class="chat-scored">+ '+t.scored.map(esc).join(', ')+'</div>' : '')
                + (t.fix ? '<div class="chat-fix">'+esc(t.fix)+'</div>' : '')
                + '</div>';
            }
            return '<div class="chat-turn them"><div class="chat-who">'
              + esc(chat.scenario.name)+'</div>'
              + '<div class="chat-bubble">'+esc(t.text)+'</div></div>';
          }).join('')
        + (chat.busy ? '<p class="chat-thinking">typing&hellip;</p>' : '')
        + (chat.error ? '<p class="chat-fix">'+esc(chat.error)+'</p>' : '')
      + '</div>'
      + (chatListening ? '<p class="chat-heard">listening&hellip; speak now</p>' : '')
      + '<div class="chat-ask">'
        + (canListen
            ? '<button class="chat-mic'+(chatListening?' on':'')+'" id="chat-mic" '
              + 'aria-label="Speak your reply"'+(chat.busy?' disabled':'')+'>'+ICON_MIC+'</button>'
            : '')
        + '<input type="text" id="chat-input" placeholder="'
          + (canListen ? 'Write your reply, or tap the microphone' : 'Write your reply in English')
          + '..." autocomplete="off"'+(chat.busy?' disabled':'')+'>'
        + '<button id="chat-send"'+(chat.busy?' disabled':'')+'>Send</button>'
      + '</div>';
  }

  // Talking only: nothing is written down, the way a real conversation is.
  // One circle tells you whose turn it is, and the turn passes by itself --
  // it speaks, then listens again, so you never touch the screen.
  function lastThemSaid(){
    if(!chat) return '';
    for(let i = chat.turns.length - 1; i >= 0; i--){
      if(chat.turns[i].who === 'them') return chat.turns[i].text;
    }
    return '';
  }

  // A scene marker is not something anybody said, so it does not count
  // as a turn when deciding whether there is a conversation to review.
  function saidAnything(turns){
    return (turns || []).some(t=>t.who === 'you');
  }

  function talkGlossHtml(){
    if(!talkGloss) return '';
    if(talkGloss.state === 'asking'){
      return '<div class="explain"><div class="explain-wait">asking&hellip;</div></div>';
    }
    if(talkGloss.state === 'error'){
      return '<div class="explain"><div class="explain-note">'
        + esc(talkGloss.message) + '</div></div>';
    }
    return '<div class="explain">'
      + '<div>' + esc(talkGloss.meaning) + '</div>'
      + (talkGloss.spanish ? '<div class="explain-es">' + esc(talkGloss.spanish) + '</div>' : '')
      + (talkGloss.note ? '<div class="explain-note">' + esc(talkGloss.note) + '</div>' : '')
      + '</div>';
  }

  // Seeing it written is the quickest way out of not having understood,
  // and it is kept out of the way until asked for so the mode stays what
  // it is meant to be.
  function talkLineHtml(){
    const said = lastThemSaid();
    if(!said) return '';
    return '<div class="talk-line">'
      + '<div class="talk-line-who">' + esc(chat.scenario.name) + '</div>'
      + '<p>' + esc(said) + '</p>'
      + '<button class="reset-link" id="talk-mean">What does it mean? &rarr;</button>'
      + talkGlossHtml()
      + '</div>';
  }

  // Having finished a sentence, it takes the turn back to you. Said from
  // one place so repeating a line behaves exactly like hearing it first.
  function afterSpeaking(){
    if(chatPhase !== 'speaking') return;   // something else took over
    chatPhase = 'idle';
    if(chatVoiceOnly && chat && !chat.busy) chatListen();
    else renderChat();
  }

  // Said wrong, told once. It appears beside the circle and takes itself
  // away again, because in a conversation you are holding by ear a
  // correction that stays on screen is just something else to ignore.
  function showChatNote(text){
    chatNote = (text || '').trim();
    if(chatNoteTimer){ clearTimeout(chatNoteTimer); chatNoteTimer = null; }
    if(!chatNote) return;
    chatNoteTimer = setTimeout(()=>{
      const note = document.querySelector('.talk-note');
      if(note) note.classList.add('going');
      chatNoteTimer = setTimeout(()=>{
        chatNote = '';
        chatNoteTimer = null;
        if(chatVoiceOnly && chat) renderChat();
      }, 500);
    }, 9000);
  }

  function talkViewHtml(){
    const STATE = {
      listening: ['your turn', 'Speak. It is listening.'],
      thinking:  ['thinking', 'Working out what to say back.'],
      speaking:  ['talking', 'It listens again the moment it stops.'],
      idle:      ['tap to talk', 'Tap the circle and say something.']
    };
    const phase = STATE[chatPhase] ? chatPhase : 'idle';
    return '<div class="talk">'
      + '<div class="talk-orb-wrap">'
        + '<button class="talk-orb '+phase+'" id="talk-orb" '
          + 'aria-label="'+STATE[phase][0]+'">'
          + (phase === 'speaking' ? ICON_SPEAKER : ICON_MIC) + '</button>'
        + (chatNote
            ? '<div class="talk-note"><b>say it like this</b>' + esc(chatNote) + '</div>'
            : '')
      + '</div>'
      + '<div class="talk-state">'+STATE[phase][0]+'</div>'
      + '<p class="talk-hint">'+STATE[phase][1]+'</p>'
      + (chat.error ? '<p class="chat-fix">'+esc(chat.error)+'</p>' : '')
      + (talkShown ? talkLineHtml() : '')
      + '<div class="talk-actions">'
        + (lastThemSaid()
            ? '<button class="btn-secondary" id="talk-what">'
              + (talkShown ? 'Hide it' : 'What did it say?') + '</button>'
              + '<button class="btn-secondary" id="talk-again">Say it again</button>'
            : '')
        + '<button class="btn-secondary" id="talk-off">Show the conversation</button>'
      + '</div>'
      + '</div>';
  }

  // The same explanation the written conversation gives, for the whole
  // line rather than a phrase picked out of it -- when you did not catch
  // it by ear, you do not yet know which part lost you.
  async function explainLastLine(){
    const said = lastThemSaid();
    if(!said || (talkGloss && talkGloss.state === 'asking')) return;
    let before = '';
    for(let i = chat.turns.length - 1; i >= 0; i--){
      if(chat.turns[i].who === 'you'){ before = chat.turns[i].text; break; }
    }
    talkGloss = { state: 'asking' };
    renderChat();
    try{
      const out = await fetch('/api/explain', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phrase: said, context: chat.scenario.name
          + (before ? '. You had just said: ' + before : '') })
      }).then(r=>r.json());
      talkGloss = out.ok
        ? { state:'done', meaning: out.meaning || '', spanish: out.spanish || '',
            note: out.note || '' }
        : { state:'error', message: out.message || 'That did not work.' };
    }catch(e){
      talkGloss = { state:'error', message: 'Could not reach the app server.' };
    }
    renderChat();
  }

  function renderChat(){
    if(!chat) return;
    const done = chat.used.length, total = chat.words.length;

    root.innerHTML = '<div class="view"><div class="chat-wrap">'
      + '<div class="chat-head">'
        + '<div class="eyebrow">' + esc(chat.scenario.name)
          + ' &middot; ' + done + ' of ' + total + ' used</div>'
        + '<div class="chat-tools">'
          + (chatVoiceOnly || !canListen || !canSpeak
              ? ''
              : '<button class="chat-toggle" id="talk-on">'+ICON_MIC+'talk only</button>')
          + (chatVoiceOnly || !canSpeak
              ? ''
              : '<button class="chat-toggle'+(chatSpeaks?' on':'')+'" id="chat-voice">'
                + ICON_SPEAKER + (chatSpeaks ? 'voice on' : 'voice off') + '</button>')
        + '</div>'
      + '</div>'
      + '<div class="chat-words">'
        + chat.words.map(w=>'<span class="chat-word'
            + (chat.used.indexOf(w) >= 0 ? ' used' : '') + '">'+esc(w)+'</span>').join('')
      + '</div>'
      + (chatVoiceOnly ? talkViewHtml() : writtenChatHtml())
      + '<button class="reset-link" id="chat-end" style="margin-top:10px;">'
        + 'End the conversation &rarr;</button>'
      + '</div></div>';

    const log = el('#chat-log');
    if(log) log.scrollTop = log.scrollHeight;
    const input = el('#chat-input');
    if(input && !chat.busy){
      input.focus();
      input.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){ e.preventDefault(); sendChat(false); }
      });
    }
    const send = el('#chat-send');
    if(send) send.addEventListener('click', ()=>sendChat(false));
    const mic = el('#chat-mic');
    if(mic) mic.addEventListener('click', chatListen);
    const voice = el('#chat-voice');
    if(voice) voice.addEventListener('click', ()=>{
      chatSpeaks = !chatSpeaks;
      try{ localStorage.setItem('wordlog_chat_voice', chatSpeaks ? 'on' : 'off'); }catch(e){}
      if(!chatSpeaks) stopSpeaking();
      renderChat();
    });

    // talking only
    const talkOn = el('#talk-on');
    if(talkOn) talkOn.addEventListener('click', ()=>{
      chatVoiceOnly = true;
      chatSpeaks = true;            // the mode is nothing without a voice
      try{ localStorage.setItem('wordlog_chat_voice', 'on'); }catch(e){}
      renderChat();
      chatListen();
    });
    const orb = el('#talk-orb');
    if(orb) orb.addEventListener('click', ()=>{
      if(chatPhase === 'speaking'){
        stopSpeaking();
        chatPhase = 'idle';
      }
      chatListen();
    });
    const what = el('#talk-what');
    if(what) what.addEventListener('click', ()=>{
      talkShown = !talkShown;
      if(!talkShown) talkGloss = null;
      renderChat();
    });

    const again = el('#talk-again');
    if(again) again.addEventListener('click', ()=>{
      const said = lastThemSaid();
      if(!said) return;
      stopChatListening();          // or it would hear itself repeating
      chatPhase = 'speaking';
      renderChat();
      chatSay(said, afterSpeaking);
    });

    const mean = el('#talk-mean');
    if(mean) mean.addEventListener('click', explainLastLine);

    const talkOff = el('#talk-off');
    if(talkOff) talkOff.addEventListener('click', ()=>{
      chatVoiceOnly = false;
      stopChatListening();
      stopSpeaking();
      chatPhase = 'idle';
      renderChat();
    });

    el('#chat-end').addEventListener('click', endChat);
  }

  // `spoken` is passed straight in rather than left in the input box:
  // renderChat rebuilds the page, so anything put in the box just before
  // would be wiped before this could read it.
  // "Imagine we are at the airport and I have lost my bag." Said out loud
  // or typed, it is a request to be somewhere else, and the conversation
  // should go there rather than treat it as a line of dialogue.
  const IMAGINE_RE = /^(?:ok(?:ay)?[,.]?\s+)?(?:now[,.]?\s+)?(?:let'?s\s+|can\s+(?:we|you)\s+|i\s+want\s+(?:you\s+)?to\s+)?imagine\b[\s,:.-]*/i;

  function askedToImagine(text){
    const t = (text || '').trim();
    if(!IMAGINE_RE.test(t)) return '';
    const rest = t.replace(IMAGINE_RE, '').trim();
    // "Imagine that." on its own is not a situation to build.
    return rest.split(/\s+/).length >= 3 ? rest : '';
  }

  async function changeScene(request){
    if(!chat || chat.busy) return;
    chat.busy = true;
    chat.error = '';
    chatPhase = 'thinking';
    renderChat();
    let out;
    try{
      out = await fetch('/api/imagine', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ request: request, words: chat.words })
      }).then(r=>r.json());
    }catch(e){
      out = { ok:false, message:'Could not reach the app server.' };
    }
    chat.busy = false;
    if(!out || !out.ok){
      chat.error = (out && out.message) || 'That did not work.';
      chatPhase = 'idle';
      renderChat();
      return;
    }
    chat.scenario = { ok:true, name: out.name, blurb: out.blurb, role: out.role };
    // The old conversation stays on the page as a record, but the partner
    // starts clean: it is somebody else now, somewhere else.
    chat.turns.push({ who:'scene', text: out.name, blurb: out.blurb });
    chat.sceneAt = chat.turns.length;
    rememberChat();
    sendChat(true);
  }

  async function sendChat(first, spoken){
    if(!chat || (chat.busy && !first)) return;
    let text = '';
    if(!first){
      if(spoken !== undefined && spoken !== null){
        text = String(spoken).trim();
      } else {
        const input = el('#chat-input');
        text = input ? input.value.trim() : '';
      }
      if(!text) return;
      const wish = askedToImagine(text);
      if(wish){
        talkShown = false;
        talkGloss = null;
        changeScene(wish);
        return;
      }
      chat.turns.push({ who:'you', text:text });
    }
    // A new turn starts bare: what was shown belonged to the last one.
    talkShown = false;
    talkGloss = null;
    chat.busy = true;
    chat.error = '';
    chatPhase = 'thinking';
    renderChat();

    // Only the real back-and-forth goes to the model, not the scoring
    // notes -- and only since the situation last changed, because the
    // partner is now someone else and would be reading a stranger's lines.
    const from = chat.sceneAt || 0;
    const history = chat.turns.slice(from)
      .filter(t=>t.who === 'you' || t.who === 'them')
      .map(t=>({ role: t.who === 'you' ? 'user' : 'assistant', content: t.text }));

    try{
      const out = await fetch('/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ history: history, words: chat.words,
                               scenario: chat.scenario.role, first: !!first })
      }).then(r=>r.json());

      chat.busy = false;
      if(!out.ok){
        chat.error = out.message || 'The reply did not arrive.';
      } else {
        const fresh = (out.used || []).filter(w=>chat.used.indexOf(w) < 0);
        fresh.forEach(w=>chat.used.push(w));
        if(!first && chat.turns.length){
          const mine = chat.turns[chat.turns.length - 1];
          if(mine.who === 'you'){
            mine.scored = fresh;
            mine.fix = out.correction || '';
            // Talking only, there is nowhere for it to be written down,
            // so it is shown beside the circle for long enough to read.
            if(chatVoiceOnly) showChatNote(out.correction || '');
          }
        }
        chat.turns.push({ who:'them', text: out.reply });
        // In talking-only mode the turn carries on by itself: it speaks,
        // and when it has finished speaking it listens again. Anything
        // else would mean reaching for the screen every sentence.
        chatPhase = 'speaking';
        chatSay(out.reply, afterSpeaking);
      }
    }catch(e){
      chat.busy = false;
      chat.error = 'Could not reach the app server.';
    }
    rememberChat();
    renderChat();
  }

  // An old conversation, read back. Not resumable -- it is finished, and
  // reopening it to add a line would blur what you actually did that day.
  function renderPastChat(c){
    if(!c) return;
    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">' + esc(c.scenario.name) + ' &middot; '
        + friendlyDate((c.endedAt||c.startedAt||'').slice(0,10)) + '</div>'
      + '<h1 class="title">'+(c.used||[]).length+' of '+(c.words||[]).length+' used</h1>'
      + '<div class="chat-words">'
        + (c.words||[]).map(w=>'<span class="chat-word'
            + ((c.used||[]).indexOf(w) >= 0 ? ' used' : '')+'">'+esc(w)+'</span>').join('')
      + '</div>'
      + (c.turns||[]).map(t=>{
          if(t.who === 'scene'){
            return '<div class="scene-turn"><span>now imagine</span>'
              + '<b>'+esc(t.text)+'</b>'
              + (t.blurb ? '<em>'+esc(t.blurb)+'</em>' : '') + '</div>';
          }
          if(t.who === 'you'){
            return '<div class="chat-turn you"><div class="chat-who">You</div>'
              + '<div class="chat-bubble">'+esc(t.text)+'</div>'
              + (t.scored && t.scored.length
                  ? '<div class="chat-scored">+ '+t.scored.map(esc).join(', ')+'</div>' : '')
              + (t.fix ? '<div class="chat-fix">'+esc(t.fix)+'</div>' : '')
              + '</div>';
          }
          return '<div class="chat-turn them"><div class="chat-who">'+esc(c.scenario.name)+'</div>'
            + '<div class="chat-bubble">'+esc(t.text)+'</div></div>';
        }).join('')
      + '<div id="review-host">'
        + (c.review
            ? reviewHtml(c.review)
            : (saidAnything(c.turns)
                ? '<div class="review"><button class="btn-secondary" id="review-ask">'
                  + 'How did I do?</button></div>'
                : ''))
      + '</div>'
      + '<div class="past-actions">'
        + '<button class="btn-primary" id="past-continue">Carry on with this one &rarr;</button>'
        + '<button class="btn-secondary" id="past-back">&larr; Back to conversations</button>'
      + '</div>'
      + (chatDeleting === c.id
          ? '<p class="hint" style="color:var(--warn); margin-top:14px;">'
            + 'This conversation and everything in it goes for good.</p>'
            + '<button class="btn-secondary" id="past-really" '
            + 'style="margin-top:8px; border-color:var(--warn); color:var(--warn);">'
            + 'Yes, delete it</button>'
            + '<button class="reset-link" id="past-keep">Never mind</button>'
          : '<button class="reset-link" id="past-delete" style="color:var(--warn);">'
            + 'Delete this conversation</button>')
      + '</div>';
    wireReview(c, paintReview);
    el('#past-back').addEventListener('click', ()=>{ chatDeleting = null; renderChatPicker(); });
    el('#past-continue').addEventListener('click', ()=>{ chatDeleting = null; openChat(c); });
    const del = el('#past-delete');
    if(del) del.addEventListener('click', ()=>{ chatDeleting = c.id; renderPastChat(c); });
    const really = el('#past-really');
    if(really) really.addEventListener('click', ()=>{
      deleteChat(c.id); chatDeleting = null; renderChatPicker();
    });
    const keep = el('#past-keep');
    if(keep) keep.addEventListener('click', ()=>{ chatDeleting = null; renderPastChat(c); });
  }

  // What a partner in character cannot tell you. Stopping to mark every
  // slip would have wrecked the conversation, so it is done afterwards,
  // over the whole thing at once.
  function reviewHtml(r){
    if(!r) return '';
    if(r.state === 'asking'){
      return '<div class="review"><div class="section-label">How it went</div>'
        + '<p class="review-wait">Reading back over what you said&hellip;</p></div>';
    }
    if(r.state === 'error'){
      return '<div class="review"><div class="section-label">How it went</div>'
        + '<p class="review-wait">' + esc(r.message || 'That did not work.') + '</p>'
        + '<button class="reset-link" id="review-retry">Try again &rarr;</button></div>';
    }
    return '<div class="review">'
      + '<div class="section-label">How it went</div>'
      + (r.summary ? '<p class="review-say">' + esc(r.summary) + '</p>' : '')
      + (r.level ? '<div class="review-level">' + esc(r.level) + '</div>' : '')
      + ((r.mistakes || []).length
          ? '<div class="section-label">Say these differently</div>'
            + r.mistakes.map(m=>'<div class="review-fix">'
                + '<div class="review-said">' + esc(m.said) + '</div>'
                + '<div class="review-better">' + esc(m.better) + '</div>'
                + (m.why ? '<div class="review-why">' + esc(m.why) + '</div>' : '')
              + '</div>').join('')
          : '<p class="review-wait">Nothing worth correcting this time.</p>')
      + ((r.strengths || []).length
          ? '<div class="section-label">You did this well</div>'
            + r.strengths.map(g=>'<div class="review-good">' + esc(g) + '</div>').join('')
          : '')
      + (r.next
          ? '<div class="review-next"><b>next conversation</b>' + esc(r.next) + '</div>'
          : '')
      + '</div>';
  }

  // Kept with the conversation, so it is read back rather than asked for
  // twice, and travels with the backup like everything else.
  async function askReview(convo, paint){
    if(!convo) return;
    convo.review = { state: 'asking' };
    paint();
    try{
      const out = await fetch('/api/review', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ turns: convo.turns || [],
                               scenario: (convo.scenario || {}).name || '',
                               words: convo.words || [],
                               used: convo.used || [] })
      }).then(r=>r.json());
      convo.review = out.ok
        ? { state:'done', summary: out.summary, level: out.level, next: out.next,
            mistakes: out.mistakes || [], strengths: out.strengths || [] }
        : { state:'error', message: out.message || 'That did not work.' };
    }catch(e){
      convo.review = { state:'error', message: 'Could not reach the app server.' };
    }
    saveChats();
    paint();
  }

  function endChat(){
    stopChatListening();
    chatNote = '';
    if(chatNoteTimer){ clearTimeout(chatNoteTimer); chatNoteTimer = null; }
    stopSpeaking();
    chatPhase = 'idle';
    chatHeard = '';
    chatVoiceOnly = false;   // the next conversation starts written unless asked
    const done = chat ? chat.used.length : 0;
    const total = chat ? chat.words.length : 0;
    const missed = chat ? chat.words.filter(w=>chat.used.indexOf(w) < 0) : [];
    let parked = null;
    if(chat && chat.turns.length){
      chats.past = (chats.past || []).filter(c=>c.id !== chat.id);
      parked = {
        id: chat.id, scenario: chat.scenario, words: chat.words, used: chat.used,
        turns: chat.turns, startedAt: chat.startedAt, sceneAt: chat.sceneAt || 0,
        endedAt: new Date().toISOString()
      };
      chats.past.unshift(parked);
    }
    chat = null;
    chats.current = null;
    saveChats();
    // Every conversation gets looked over, without being asked for: the
    // moment you have finished is the moment it is worth reading.
    if(parked && saidAnything(parked.turns)){
      askReview(parked, ()=>paintReview(parked));
    }
    root.innerHTML = '<div class="view">'
      + '<div class="eyebrow">Conversation</div>'
      + '<h1 class="title">'+done+' of '+total+' used</h1>'
      + '<p class="subtitle">'+(done === total
          ? 'Every word, in a real conversation. That is the whole point of them.'
          : (done
              ? 'Good going. The ones that did not come up are worth another conversation.'
              : 'Nothing came up this time. A different situation might suit these words better.'))
        + '</p>'
      + (missed.length
          ? '<div class="section-label">Still to use</div>'
            + '<div class="chat-words">'
            + missed.map(w=>'<span class="chat-word">'+esc(w)+'</span>').join('')
            + '</div>'
          : '')
      + '<div id="review-host">' + reviewHtml(parked && parked.review) + '</div>'
      + '<button class="btn-primary" id="chat-again" style="margin-top:16px;">Another conversation &rarr;</button>'
      + '<button class="btn-secondary" id="chat-home" style="margin-top:10px;">&larr; Back to home</button>'
      + '</div>';
    el('#chat-again').addEventListener('click', renderChatPicker);
    el('#chat-home').addEventListener('click', renderHome);
    wireReview(parked, paintReview);
  }

  // Only this one block is repainted, so the screen does not jump while
  // you are already reading the words you missed.
  function paintReview(convo){
    const host = document.getElementById('review-host');
    if(!host) return;
    host.innerHTML = reviewHtml(convo && convo.review);
    wireReview(convo, paintReview);
  }

  function wireReview(convo, paint){
    const retry = document.getElementById('review-retry');
    if(retry) retry.addEventListener('click', ()=>askReview(convo, ()=>paint(convo)));
    const ask = document.getElementById('review-ask');
    if(ask) ask.addEventListener('click', ()=>askReview(convo, ()=>paint(convo)));
  }

  async function init(){
    loadProgress();
    loadMeta();
    loadCustomWords();
    loadMyList();
    loadSpeechScores();
    loadLearnSets();
    loadChats();
    // If this browser has lost everything -- cleared site data, a new
    // profile, a new laptop -- take it back from the file before anything
    // is drawn, so the day's set is built from the real picture.
    await restoreIfEmpty();
    renderHome();
    startStudyClock();
    loadKeyState();   // fills the glossary row in once the server answers
    // Meets you at the door, once per opening of the app.
    maybeOpenRecall();
  }
  init().catch(()=>{ root.innerHTML = '<p class="loading">Something went wrong loading the app. Refreshing might help.</p>'; });

  // Registering the worker is what makes the browser offer to install
  // this as an app. It needs a trusted origin, which localhost is as much
  // as https is -- isSecureContext is exactly that question, so it also
  // stays correctly switched off for a page opened as a file. A failure
  // here must never stop the app loading.
  if('serviceWorker' in navigator && window.isSecureContext){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
